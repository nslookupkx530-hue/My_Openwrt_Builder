# ============================================================================
# N1 产线 —— PHICOMM N1 / Amlogic S905D
# 路线：armsr/armv8 通用 ARM64 rootfs + ffuqiangg 外置内核 + Amlogic 打包 action
# ============================================================================
name: Build PHICOMM-N1

on:
  workflow_dispatch:
    inputs:
      include_docker:
        description: '是否集成 Docker 插件及防火墙配置'
        type: choice
        options:
          - no
          - yes
        default: 'no'
      enable_store:
        description: '是否集成 iStore 商店'
        type: choice
        options:
          - yes
          - no
        default: 'yes'

permissions:
  contents: write

concurrency:
  group: n1-build
  cancel-in-progress: false

env:
  WORKSPACE: ${{ github.workspace }}
  LOG: ${{ github.workspace }}/build.log
  SEED: configs/DSF/n1/phicomm-n1.config
  IMM_TAG: v25.12.2
  AMLOGIC_PIN: '26.10.0301'
  AMLOGIC_ACTION_SHA: 6a10e4a4a4d7ade41b87fad44e6b1be0b981743a
  KVER_PIN: '6.12.103'
  OWRT: /mnt/ci/openwrt
  N1_LAN_IP: '192.168.1.99'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:

      - name: 释放磁盘空间
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'false'
        continue-on-error: true

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析功能开关
        id: switches
        env:
          IN_DOCKER: ${{ inputs.include_docker }}
          IN_STORE: ${{ inputs.enable_store }}
        run: |
          set -uo pipefail
          norm() {
            case "$1" in
              yes|YES|Yes|true|TRUE|True|1|y|Y|on|ON) echo yes ;;
              *) echo no ;;
            esac
          }
          D="$(norm "${IN_DOCKER:-false}")"
          S="$(norm "${IN_STORE:-true}")"
          BD="$(date +%Y.%m.%d)"
          {
            echo "WANT_DOCKER=${D}"
            echo "WANT_STORE=${S}"
            echo "BUILD_DATE=${BD}"
          } >> "$GITHUB_ENV"
          SUF=""; [ "${D}" = "yes" ] && SUF="-docker"
          NAM=""; [ "${D}" = "yes" ] && NAM=" (docker)"
          {
            echo "docker_suffix=${SUF}"
            echo "docker_name=${NAM}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### 功能开关"
            echo ""
            echo "| 项 | 原始输入 | 归一化 | 来源 |"
            echo "|---|---|---|---|"
            echo "| WANT_DOCKER | ${IN_DOCKER:-<空>} | ${D} | inputs.include_docker |"
            echo "| WANT_STORE | ${IN_STORE:-<空>} | ${S} | inputs.enable_store |"
            echo "| BUILD_DATE | - | ${BD} | date +%Y.%m.%d |"
            echo "| KVER_PIN | - | ${KVER_PIN} | 顶层 env |"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: 前置检查
        run: |
          set -uo pipefail
          IMM_VER="${IMM_TAG#v}"
          WANT_KVER="${KVER_PIN}"
          OK_BASE=""
          KVER=""
          KVG=""
          FAIL=0

          echo "=========== immortalwrt 下载站现有版本目录 ==========="
          curl -s -m 25 "https://downloads.immortalwrt.org/releases/" -o /tmp/idx.html || true
          grep -oE 'href="[^"]+/"' /tmp/idx.html | sed -E 's/href="//; s|/"$||' | sort -u | tee /tmp/vers.txt || true

          echo "=========== 逐候选探 profiles.json ==========="
          for M in "https://downloads.immortalwrt.org" "https://downloads.openwrt.org"; do
            for V in "${IMM_VER}" "v${IMM_VER}"; do
              B="${M}/releases/${V}/targets/armsr/armv8"
              C="$(curl -s -o /tmp/p.json -w '%{http_code}' -m 25 "${B}/profiles.json" || echo 000)"
              KV=""
              VG=""
              if [ "${C}" = "200" ]; then
                KV="$(jq -r '.linux_kernel.version' /tmp/p.json)"
                VG="$(jq -r '.linux_kernel.vermagic' /tmp/p.json)"
              fi
              echo "  HTTP=${C}  kernel=${KV:-?}  vermagic=${VG:-?}  ${B}/profiles.json"
              if [ "${C}" = "200" ] && [ "${KV}" = "${WANT_KVER}" ] && [ -z "${OK_BASE}" ]; then
                OK_BASE="${B}"
                KVER="${KV}"
                KVG="${VG}"
              fi
            done
          done

          KMODS=""
          C2=000
          if [ -n "${OK_BASE}" ]; then
            KMODS="${KVER}-1-${KVG}"
            echo "EXPECT_KVG=${KVG}" >> "$GITHUB_ENV"
            C2="$(curl -s -o /dev/null -w '%{http_code}' -m 25 "${OK_BASE}/kmods/${KMODS}/packages.adb" || echo 000)"
            [ "${C2}" = "200" ] || FAIL=1
          else
            FAIL=1
          fi
          K_TAG="kernel_${WANT_KVER}"
          K_BASE="https://github.com/ffuqiangg/kernel_6.12.y/releases/download/${K_TAG}"
          C3="$(curl -sIL -o /dev/null -w '%{http_code}' -m 30 "${K_BASE}/${WANT_KVER}.tar.gz" || echo 000)"
          C3B="$(curl -sIL -o /dev/null -w '%{http_code}' -m 30 "${K_BASE}/deb-${WANT_KVER}.tar.gz" || echo 000)"

          {
            echo "### 前置检查"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 采用的 base | ${OK_BASE:-**无**} |"
            echo "| linux_kernel.version | ${KVER:-?}（要求 = ${WANT_KVER}） |"
            echo "| linux_kernel.vermagic | ${KVG:-?} |"
            echo "| kmods/${KMODS}/packages.adb | ${C2} |"
            echo "| ffuqiangg ${K_TAG}/${WANT_KVER}.tar.gz | ${C3} | 直链，不走 API |"
            echo "| ffuqiangg ${K_TAG}/deb-${WANT_KVER}.tar.gz | ${C3B} | 直链 |"
            echo ""
            echo '```'
            if [ "${C3}" != "200" ] || [ "${C3B}" != "200" ]; then
              echo "（内核资产不可达 → 列出现有 tag，走 atom 源，同样不限流）"
              curl -sL -m 25 "https://github.com/ffuqiangg/kernel_6.12.y/releases.atom" | grep -oE '<title>[^<]*</title>' | sed -E 's|</?title>||g' | head -n 20 || true
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "采用 BASE=${OK_BASE:-无} kernel=${KVER} vermagic=${KVG} kmods=${C2} ffkernel=${C3}/${C3B}"
          [ "${FAIL}" = "0" ] || { echo "::error::前置检查未通过，见 Step Summary"; exit 1; }

      - name: 准备容器
        run: |
          set -euxo pipefail
          bash scripts/n1/init.sh

      - name: 准备源码与补丁
        run: |
          set -euxo pipefail
          d "cd \${ffdir} && WANT_DOCKER=${WANT_DOCKER} bash scripts/n1/prepare.sh"

      
      - name: 打印构建树实况
        # 构建树实况（诊断，长期保留）
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### 构建树实况"
            echo ""
            echo '```'
            echo "--- 宿主侧 ---"
            echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
            ls -ld /mnt/ci /mnt/ci/openwrt /mnt/ci/ffos 2>&1 || true
            df -h /mnt/ci 2>&1 | tail -n 2 || true
            echo ""
            echo "--- 容器内变量 ---"
            d "echo workdir=\${workdir}" || true
            d "echo ffdir=\${ffdir}" || true
            d "echo wrtdir=\${wrtdir}" || true
            d "echo pwd=\$(pwd) HOME=\${HOME}" || true
            echo ""
            echo "--- 容器内目录 ---"
            d "ls -ld \${wrtdir} \${ffdir} 2>&1" || true
            d "ls -l \${wrtdir} 2>&1 | head -n 25" || true
            d "ls -l \${ffdir}/scripts/n1/ 2>&1" || true
            d "ls -ld \${ffdir}/files/etc \${ffdir}/files/etc/uci-defaults 2>&1" || true
            echo ""
            echo "--- 内核对齐 / 种子 ---"
            d "echo .vermagic=\$(cat \${wrtdir}/.vermagic 2>/dev/null)" || true
            d "ls -l \${wrtdir}/.config 2>&1" || true
            echo ""
            echo "--- 容器磁盘 ---"
            d "df -h /ci" 2>&1 | tail -n 3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 展开种子
        run: |
          set -euxo pipefail
          d "cp -f /ci/ffos/${SEED} /ci/openwrt/.config"
          d "cd /ci/openwrt && make defconfig"
          CFG=/mnt/ci/openwrt/.config
          {
            echo "### 种子自检"
            echo '```'
            grep -nE '^#? ?CONFIG_TARGET_(armsr_armv8_DEVICE_generic|ARCH_PACKAGES|ROOTFS_)' "${CFG}" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^CONFIG_TARGET_ROOTFS_TARGZ=y' "${CFG}" || { echo "::error::TARGZ 没生效，打包拿不到 rootfs.tar.gz"; exit 1; }
          grep -qE '^CONFIG_TARGET_ARCH_PACKAGES="aarch64_generic"' "${CFG}" || { echo "::error::ARCH_PACKAGES 不是 aarch64_generic，apk 脚本会推错架构目录"; exit 1; }

      - name: 应用可选插件
        run: |
          set -euxo pipefail
          CFG=/mnt/ci/openwrt/.config
          # docker 包集合：与 A 线 Fetch Docker APKs / DSF 注入清单保持同一份名单
          #   immortalwrt 官方树是拆包制（dockerd=守护进程、docker=CLI）；MISS 零成本，少写会静默缺功能
          DOCKER_PKGS="docker dockerd containerd runc docker-compose luci-app-dockerman luci-i18n-dockerman-zh-cn"

          if [ "${WANT_DOCKER}" = "yes" ]; then
            for p in ${DOCKER_PKGS}; do
              grep -qxF "CONFIG_PACKAGE_${p}=y" "${CFG}" || echo "CONFIG_PACKAGE_${p}=y" >> "${CFG}"
            done
            echo ">>> docker 已注入（7 包并集）"
          else
            echo ">>> WANT_DOCKER=no，跳过 docker"
          fi
          d "cd /ci/openwrt && make defconfig"

          if [ "${WANT_DOCKER}" = "yes" ]; then
            for p in ${DOCKER_PKGS}; do
              if grep -qxF "CONFIG_PACKAGE_${p}=y" "${CFG}"; then
                echo "  ON   CONFIG_PACKAGE_${p}"
              else
                echo "  MISS CONFIG_PACKAGE_${p}（本源树没有这个符号 → 正常）"
              fi
            done
            DOCKER_HIT=""
            for p in dockerd docker; do
              if grep -qxF "CONFIG_PACKAGE_${p}=y" "${CFG}"; then DOCKER_HIT="${p}"; break; fi
            done
            [ -n "${DOCKER_HIT}" ] || { echo "::error::WANT_DOCKER=yes 但 CONFIG_PACKAGE_dockerd/docker 都没进 .config（看上面的 MISS）"; exit 1; }
            echo ">>> [docker 校验] docker 已进 .config，符号来源: ${DOCKER_HIT}"
          fi

      - name: docker 防火墙 + 首启启用（可选）
        if: env.WANT_DOCKER == 'yes'
        run: |
          set -euxo pipefail
          FILES=/mnt/ci/openwrt/files
          mkdir -p "${FILES}/etc/init.d" "${FILES}/etc/rc.d" "${FILES}/etc/uci-defaults"

          # 1) docker-firewall（只补 forwarding，不建/不删 zone）
          SRC_FW=/mnt/ci/ffos/files/etc/init.d/docker-firewall
          [ -f "${SRC_FW}" ] || { echo "::error::仓库里找不到 ${SRC_FW}"; exit 1; }
          install -m 0755 "${SRC_FW}" "${FILES}/etc/init.d/docker-firewall"
          ln -sf ../init.d/docker-firewall "${FILES}/etc/rc.d/S99docker-firewall"
          ln -sf ../init.d/docker-firewall "${FILES}/etc/rc.d/K10docker-firewall"

          # 2) 首启启用：N1 的 docker 是【编进镜像】的，没有"首启安装脚本"来 enable 它 → 用 uci-defaults
          cat > "${FILES}/etc/uci-defaults/99-docker-enable" <<'EOS'
          #!/bin/sh
          # 构建期生成：首启启用 docker 与 docker-firewall（仅 WANT_DOCKER=yes 的固件里有）
          SVC=""
          [ -x /etc/init.d/dockerd ] && SVC="/etc/init.d/dockerd"
          [ -x /etc/init.d/docker ]  && SVC="/etc/init.d/docker"
          [ -n "$SVC" ] || exit 0
          "$SVC" enable >/dev/null 2>&1
          "$SVC" start  >/dev/null 2>&1
          [ -x /etc/init.d/docker-firewall ] && /etc/init.d/docker-firewall enable >/dev/null 2>&1
          exit 0
          EOS
          chmod 0755 "${FILES}/etc/uci-defaults/99-docker-enable"
          [ "$(head -n1 "${FILES}/etc/uci-defaults/99-docker-enable")" = "#!/bin/sh" ] \
            || { echo "::error::99-docker-enable 首行不是 #!/bin/sh（heredoc 缩进错了）"; exit 1; }
          sh -n "${FILES}/etc/uci-defaults/99-docker-enable"
          ls -l "${FILES}/etc/init.d/docker-firewall" "${FILES}/etc/rc.d/S99docker-firewall" "${FILES}/etc/uci-defaults/99-docker-enable"

      - name: 包清单自检
        run: |
          set -uo pipefail
          d "grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_+.-]+=y\$' /ci/openwrt/.config" | sort -u > /tmp/have.txt
          grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_+.-]+=y$' "${GITHUB_WORKSPACE}/${SEED}" | sort -u > /tmp/want.txt
          comm -23 /tmp/want.txt /tmp/have.txt > /tmp/miss.txt || true
          {
            echo "### 包清单自检"
            echo '```'
            echo "want=$(wc -l < /tmp/want.txt)  have=$(wc -l < /tmp/have.txt)  miss=$(wc -l < /tmp/miss.txt)"
            sed 's/^/MISS /' /tmp/miss.txt
            echo '```'
            if [ -s /tmp/miss.txt ]; then
              echo ""
              echo "#### MISS 诊断（符号状态 + 候选名）"
              echo '```'
              while IFS= read -r m; do
                pkg="${m#CONFIG_PACKAGE_}"
                pkg="${pkg%=y}"
                echo "--- ${pkg} 在 .config 里的状态 ---"
                grep -n "${pkg}" /mnt/ci/openwrt/.config || echo "(符号完全不存在 → 名字变了)"
                echo "--- 在 feeds/luci/applications 里按源码名搜 ${pkg} ---"
                d "grep -rl --include=Makefile '${pkg}' /ci/openwrt/feeds/luci/applications/ 2>/dev/null | head -n 5" || true
              done < /tmp/miss.txt
              echo "--- feeds/luci/applications 里含 opkg/pkg/package/manager/store 的目录 ---"
              d "ls -1 /ci/openwrt/feeds/luci/applications/ 2>/dev/null | grep -iE 'opkg|pkg|package|manager|store'" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/miss.txt ]; then
            if [ "${STRICT_PKGS:-0}" = "1" ]; then
              echo "::error::种子里有包被 defconfig 丢掉（STRICT_PKGS=1），见 Summary"
              exit 1
            fi
            echo "::warning::种子里有包被 defconfig 丢掉，本轮按警告放行（STRICT_PKGS=0），见 Summary"
          fi

      - name: 准备第三方商店
        if: env.WANT_STORE == 'yes'
        run: |
          set -euxo pipefail
          d "cd /ci/ffos && SOURCE_DIR=/ci/openwrt REPO=https://github.com/nslookupkx530-hue/apk.git BRANCHES='My master' ALLOW_MISSING=0 CUSTOM_PACKAGES=luci-app-store bash /ci/ffos/shell/apk-prepare-packages.sh"
          d "ls -lh /ci/openwrt/packages"

      - name: 将第三方商店装入固件
        if: env.WANT_STORE == 'yes'
        run: |
          set -euxo pipefail
          d "$(cat <<'EOS'
          #!/bin/bash
          set -euxo pipefail
          OPENWRT_DIR=/ci/openwrt
          FIRMWARE_FILES_DIR="${OPENWRT_DIR}/files"
          REPO_FILES_DIR=/ci/ffos/files
          APK_SOURCE_DIR="${OPENWRT_DIR}/packages"
          mkdir -p "${FIRMWARE_FILES_DIR}/usr/share/third-party"
          mkdir -p "${FIRMWARE_FILES_DIR}/etc/third-party"
          mkdir -p "${FIRMWARE_FILES_DIR}/etc/init.d"
          mkdir -p "${FIRMWARE_FILES_DIR}/etc/rc.d"
          APK_COUNT="$(find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          echo ">>> apk 数量 = ${APK_COUNT}"
          [ "${APK_COUNT}" -gt 0 ]
          find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' -exec cp -f {} "${FIRMWARE_FILES_DIR}/usr/share/third-party/" \;
          SRC_INIT="$(find "${REPO_FILES_DIR}" -type f -name 'apk-install' -print -quit 2>/dev/null || true)"
          SRC_INSTALLER="$(find "${REPO_FILES_DIR}" -type f -name 'install_third_party_apk.sh' -print -quit 2>/dev/null || true)"
          DST_INIT="${FIRMWARE_FILES_DIR}/etc/init.d/apk-install"
          DST_INSTALLER="${FIRMWARE_FILES_DIR}/etc/third-party/install_third_party_apk.sh"
          [ -f "${DST_INIT}" ] || { [ -n "${SRC_INIT}" ] && install -m 0755 "${SRC_INIT}" "${DST_INIT}"; }
          [ -f "${DST_INSTALLER}" ] || { [ -n "${SRC_INSTALLER}" ] && install -m 0755 "${SRC_INSTALLER}" "${DST_INSTALLER}"; }
          chmod 0755 "${DST_INIT}" "${DST_INSTALLER}" 2>/dev/null || true
          ln -sf ../init.d/apk-install "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"
          test -L "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"
          find "${FIRMWARE_FILES_DIR}/usr/share/third-party" -maxdepth 1 -type f -name '*.apk' -exec ls -lh {} \;
          EOS
          )"
            
      - name: 探测容器挂载
        # 容器挂载探测（诊断，长期保留）
        if: always()
        run: |
          set -uo pipefail
          CT="$(docker ps -qf name=opbe | head -n1)"
          {
            echo "### 容器挂载探测"
            echo ""
            echo '```'
            echo "--- 容器列表 ---"
            docker ps -a --format '{{.ID}}  {{.Names}}  {{.Image}}  {{.Status}}' 2>&1 || true
            echo "CT=${CT}"
            echo ""
            echo "--- 挂载表（宿主 => 容器）---"
            docker inspect -f '{{range .Mounts}}{{.Source}} => {{.Destination}}{{"\n"}}{{end}}' "${CT}" 2>&1 || true
            echo ""
            echo "--- 宿主侧 ---"
            ls -ld /mnt/ci /mnt/ci/openwrt /mnt/ci/ffos 2>&1 || true
            ls -l /mnt/ci/openwrt/bin/targets 2>&1 || true
            echo ""
            echo "--- 容器内 ---"
            d "ls -ld /ci /ci/openwrt /ci/ffos" 2>&1 || true
            d "df -h /ci" 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: 开始编译
        run: |
          set -o pipefail
          JOBS="$(( $(nproc) + 1 ))"
          : > "${LOG}"
          d "cd /ci/openwrt && make download -j8" 2>&1 | tee -a "${LOG}" || d "cd /ci/openwrt && make download -j1 V=s" 2>&1 | tee -a "${LOG}" || echo "::warning::download 有失败项"
          d "cd /ci/openwrt && make -j${JOBS}" 2>&1 | tee -a "${LOG}" || d "cd /ci/openwrt && make -j1 V=s" 2>&1 | tee -a "${LOG}"
          zstd -T0 -3 "${LOG}" -o "${LOG}.zst" || true

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: n1-build-logs-${{ github.run_id }}
          path: |
            build.log
            build.log.zst
          retention-days: 7
          if-no-files-found: warn

      - name: 校验内核 vermagic（防 docker 带偏）
        if: success()
        run: |
          set -euxo pipefail
          VG="$(cat /mnt/ci/openwrt/.vermagic 2>/dev/null || true)"
          [ -n "${VG}" ] || { echo "::error::读不到 /mnt/ci/openwrt/.vermagic"; exit 1; }
          echo ">>> 本机 .vermagic = ${VG}"
          echo ">>> 官方 vermagic  = ${EXPECT_KVG:-<未采集>}"
          [ -n "${EXPECT_KVG:-}" ] || { echo "::warning::未采集到官方 vermagic，跳过断言"; exit 0; }
          case "${VG}" in
            *"${EXPECT_KVG}"*) echo ">>> OK 内核 vermagic 与官方一致"; ;;
            *)
              echo "::error::内核 vermagic 漂移：本机=${VG} 官方=${EXPECT_KVG}"
              echo "::error::说明有包把内核配置带偏了（本线最可能是 docker 的 kmod 依赖：veth / br-netfilter / nf-nat）"
              echo "::error::后果：官方 kmods 目录 ${KVER_PIN}-1-${EXPECT_KVG} 对不上，设备上装不了内核模块"
              exit 1 ;;
          esac

      - name: 打包 Amlogic 镜像
        uses: ffuqiangg/amlogic-s9xxx-openwrt@6a10e4a4a4d7ade41b87fad44e6b1be0b981743a
        with:
          openwrt_path: /mnt/ci/openwrt/bin/targets/*/*/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ffuqiangg/kernel_6.12.y
          openwrt_kernel: ${{ env.KVER_PIN }}
          kernel_usage: stable
          auto_kernel: false
          openwrt_ip: ${{ env.N1_LAN_IP }}
          build_date: ${{ env.BUILD_DATE }}

      - name: 收集产物并核验
        if: always()
        run: |
          set -euxo pipefail
          AP="${PACKAGED_OUTPUTPATH:-}"
          [ -n "${AP}" ] || { echo "::error::PACKAGED_OUTPUTPATH 为空，打包那步没成功"; exit 1; }
          BASE="${AP%/openwrt/out}"
          echo "PACKAGED_OUTPUTPATH=${AP}"
          rm -rf out
          mkdir -p out
          ls -lh "${AP}" 2>/dev/null || true
          ls -lh "${BASE}/out" 2>/dev/null || true
          find "${BASE}" -maxdepth 4 -type f -name '*.img.gz' -exec cp -v {} out/ \;
          find /mnt/ci/openwrt/bin/targets/armsr/armv8 -maxdepth 1 -type f -name '*rootfs.tar.gz' -exec cp -v {} out/ \;
          {
            echo "### 产物"
            echo '```'
            ls -lh out
            echo '```'
            echo ""
            echo "内核版本核验（必须含 ${KVER_PIN}）"
            echo '```'
            ls out | grep -F "${KVER_PIN}" || echo "!! 产物名里没有 ${KVER_PIN}，内核可能被 stable 漂移，kmods 会对不上"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$(find out -type f | head -n 1)" ] || echo "::warning::out/ 是空的（编译或打包未产出）"

      - name: 生成 Release 说明
        if: always()
        run: |
          set -uo pipefail
          dcap() { d "$1" 2>/dev/null | grep -v '>> runner@opbe:'; }
          CFG=/mnt/ci/openwrt/.config
          TARGET_DIR=/mnt/ci/openwrt/bin/targets/armsr/armv8

          COMMIT="$(dcap 'git -C /ci/openwrt rev-parse HEAD' | head -n1 | tr -d '[:space:]')"
          [ -n "${COMMIT}" ] || COMMIT="unknown"
          VG="$(cat /mnt/ci/openwrt/.vermagic 2>/dev/null || true)"
          [ -n "${VG}" ] || VG="unknown"

          MAN="$(find "${TARGET_DIR}" -maxdepth 1 -type f -name '*.manifest' 2>/dev/null | head -n1)"
          LUCILIST=""
          if [ -n "${MAN}" ]; then
            LUCILIST="$(grep -E '^luci' "${MAN}" | sed -E 's/ - .*//' | sort -u)"
          fi
          if [ -z "${LUCILIST}" ]; then
            LUCILIST="$(grep -oE '^CONFIG_PACKAGE_\(luci[A-Za-z0-9_+.-]*\)=y' "${CFG}" 2>/dev/null | sed -E 's/^CONFIG_PACKAGE_//; s/=y$//' | sort -u)"
          fi

          TPLIST="$(ls -1 /mnt/ci/openwrt/packages/*.apk 2>/dev/null | xargs -r -n1 basename | sed -E 's/\.apk$//' | sort -u)"
          FILES="$(cd out 2>/dev/null && ls -1 || true)"

          # ---- 新增 1/3：docker 采集（N1 是【编译进 rootfs】、不走 apk 通道 → 只能从 .config 取）----
          DOCKER_SYMS="$(grep -E '^CONFIG_PACKAGE_(docker|dockerd|containerd|runc|docker-compose|luci-app-dockerman|luci-i18n-dockerman-zh-cn)=y$' "${CFG}" 2>/dev/null | sed -e 's/^CONFIG_PACKAGE_//' -e 's/=y$//' | sort -u || true)"
          DOCKER_FW="no"; [ -f /mnt/ci/openwrt/files/etc/init.d/docker-firewall ] && DOCKER_FW="yes"
          DOCKER_EN="no"; [ -f /mnt/ci/openwrt/files/etc/uci-defaults/99-docker-enable ] && DOCKER_EN="yes"

          {
            echo "ImmortalWrt automated build release (N1 官方源)"
            echo ""
            echo "Device:"
            echo ""
            echo "PHICOMM-N1 (Amlogic S905D)"
            echo ""
            echo "Source:"
            echo ""
            echo "https://github.com/immortalwrt/immortalwrt"
            echo "tag ${IMM_TAG} commit ${COMMIT}"
            echo "target armsr/armv8 profile generic"
            echo "kernel ${KVER_PIN} vermagic ${VG}"
            echo ""
            echo "Kernel source:"
            echo ""
            echo "https://github.com/ffuqiangg/kernel_6.12.y"
            echo "tag kernel_${KVER_PIN}"
            echo ""
            echo "Run ID:"
            echo ""
            echo "${{ github.run_id }}"
            echo ""
            echo "Firmware:"
            echo ""
            printf '%s\n' "${FILES}" | sed 's/^/- /'
            echo ""
            echo "LuCI package list"
            echo ""
            echo "PHICOMM-N1"
            echo ""
            printf '%s\n' "${LUCILIST}" | sed 's/^/- /'
            echo ""
            echo "Third-Party package list"
            echo ""
            if [ -n "${TPLIST}" ]; then printf '%s\n' "${TPLIST}" | sed 's/^/- /'; else echo "- (未集成)"; fi

            # ---- 新增 2/3：docker 段落（只有 WANT_DOCKER=yes 才输出）----
            if [ "${WANT_DOCKER:-no}" = "yes" ]; then
              echo ""
              echo "Docker（编译进 rootfs）"
              echo ""
              echo "开关：include_docker=yes"
              echo "docker-firewall 脚本：${DOCKER_FW}"
              echo ""
              if [ -n "${DOCKER_SYMS}" ]; then printf '%s\n' "${DOCKER_SYMS}" | sed 's/^/- /'; else echo "- (未检测到 docker 符号)"; fi
            fi

            echo ""
            echo "刷机提示："
            echo ""
            echo "1. 用 Amlogic 烧录工具写入 U 盘/SD 卡或 emmc"
            echo "2. 首次启动约 2~3 分钟，默认 IP ${N1_LAN_IP}"
            echo "3. 核验内核：uname -r 应为 ${KVER_PIN}"
          } > release_body.md
          echo ">>> release_body.md 已生成（$(wc -l < release_body.md) 行）"

          # ---- 新增 3/3：CI 侧警示（放行了 docker 却什么都没落地）----
          if [ "${WANT_DOCKER:-no}" = "yes" ] && [ -z "${DOCKER_SYMS}" ]; then
            echo "::warning::WANT_DOCKER=yes 但 .config 里没有任何 docker 符号（release notes 已标注）"
          fi

          head -n 20 release_body.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: N1-ImmortalWrt${{ steps.switches.outputs.docker_suffix }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: N1 ImmortalWrt ${{ env.IMM_TAG }} build ${{ github.run_number }}${{ steps.switches.outputs.docker_name }}
          body_path: release_body.md          # ← 新增：用我们生成的正文
          files: out/*
          fail_on_unmatched_files: false
