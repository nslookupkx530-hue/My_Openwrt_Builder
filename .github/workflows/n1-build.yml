name: Build PHICOMM-N1 (ImmortalWrt + Amlogic pack)

on:
  workflow_dispatch:
    inputs:
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-n1
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 释放磁盘空间
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true
          remove-large-packages: true
          remove-cached-tools: true
          remove-swapfile: true

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 前置检查
        # 外部依赖，10 秒；失败就别浪费 3 小时
        shell: bash
        run: |
          set -uo pipefail
          # 从 prepare.sh 读 IMM_TAG，避免两处维护
          IMM="$(sed -n 's/^IMM_TAG="\([^"]*\)".*/\1/p' scripts/n1/prepare.sh | head -1)"
          [ -n "${IMM}" ] || { echo "::error::读不到 scripts/n1/prepare.sh 里的 IMM_TAG"; exit 1; }
          V="${IMM#v}"
          B="https://downloads.immortalwrt.org/releases/${V}/targets/armsr/armv8"
          FAIL=0

          chk() {
            code="$(curl -s -o /dev/null -m 20 -w '%{http_code}' -L "$1" || echo 000)"
            printf '%s  %s\n' "${code}" "$2"
            [ "${code}" = "200" ] || FAIL=1
          }

          echo "immortalwrt ${IMM} / armsr-armv8"
          chk "${B}/profiles.json" "profiles.json"

          # ★ 新增①：profiles.json 拿不到就当场说清楚，别让 jq 抛一堆看不懂的错误
          if [ "${FAIL}" != "0" ]; then
            echo "::error::profiles.json 拿不到 —— IMM_TAG（${IMM}）这个版本在 immortalwrt 不存在"
            echo ">>> immortalwrt 现有的 25.12 版本："
            git ls-remote --tags https://github.com/immortalwrt/immortalwrt.git 2>/dev/null \
              | awk '{print $2}' | sed 's|refs/tags/||' | grep -E '^v25\.12\.[0-9]+$' | sort -uV | tr '\n' ' ' || true
            echo
            exit 1
          fi

          KJSON="$(curl -s "${B}/profiles.json")"
          VER="$(printf '%s' "${KJSON}" | jq -r '.linux_kernel.version')"
          REL="$(printf '%s' "${KJSON}" | jq -r '.linux_kernel.release')"
          VMG="$(printf '%s' "${KJSON}" | jq -r '.linux_kernel.vermagic')"
          KM="${VER}-${REL}-${VMG}"
          echo "kernel=${VER}  release=${REL}  vermagic=${VMG}"
          chk "${B}/kmods/${KM}/packages.adb" "官方 kmods 索引"

          echo "-- kernel_${VER%.*}.y 里 ${VER} 的资产："
          curl -s "https://api.github.com/repos/ffuqiangg/kernel_${VER%.*}.y/releases?per_page=100" \
            | jq -r '.[].assets[].name' 2>/dev/null | grep -F "${VER}" || { echo "  (没有！打包会失败)"; FAIL=1; }

          # ★ 新增②：kmods 索引失败时，把目录实况打出来（判断是否目录名形态变了）
          if [ "${FAIL}" != "0" ]; then
            echo "-- 诊断：kmods 目录实况"
            curl -fsSL "${B}/kmods/" 2>/dev/null | grep -oE '6\.[0-9]+\.[0-9]+[^"<>]*' | sort -u | tail -5 || echo "  (拿不到目录列表)"
          fi

          {
            echo "### N1 前置检查"
            echo "- immortalwrt \`${IMM}\` / armsr-armv8"
            echo "- kernel \`${VER}\`，vermagic \`${VMG}\`，kmods 目录 \`${KM}\`"
            echo "- 结果: $([ "${FAIL}" = "0" ] && echo "✅ 通过" || echo "❌ 失败")"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "${FAIL}" = "0" ] || { echo "::error::外部依赖不可用，先解决再构建"; exit 1; }
          echo ">>> 前置检查通过"

      - name: 上游版本监视
        # 只提示，不影响构建
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          # 三个 pin 全部从实际文件里读 → 永远不会出现"两处写的不一致"
          PIN_ACTION="$(grep -oE 'amlogic-s9xxx-openwrt@[0-9a-f]{40}' .github/workflows/n1-build.yml | head -1 | cut -d@ -f2 || true)"
          PIN_AMLOGIC="$(sed -n 's/^AMLOGIC_PIN="\([^"]*\)".*/\1/p' scripts/n1/prepare.sh | head -1 || true)"
          PIN_IMM="$(sed -n 's/^IMM_TAG="\([^"]*\)".*/\1/p' scripts/n1/prepare.sh | head -1 || true)"

          NOW_ACTION="$(git ls-remote https://github.com/ffuqiangg/amlogic-s9xxx-openwrt.git HEAD 2>/dev/null | awk '{print $1}' || true)"
          NOW_AMLOGIC="$(git ls-remote --tags https://github.com/ophub/luci-app-amlogic.git 2>/dev/null | awk '{print $2}' | sed 's|refs/tags/||' | grep -v '\^{}' | sort -V | tail -1 || true)"
          NOW_IMM="$(git ls-remote --tags https://github.com/immortalwrt/immortalwrt.git 2>/dev/null | awk '{print $2}' | sed 's|refs/tags/||' | grep -E '^v25\.12\.[0-9]+$' | sort -V | tail -1 || true)"

          st() { [ -n "$1" ] && [ "$1" = "$2" ] && echo "✅ 一致" || echo "⬆️ 上游有更新"; }

          {
            echo "### N1 上游版本监视（仅提示）"
            echo ""
            echo "| 项目 | 你 pin 的 | 上游当前 | 状态 |"
            echo "|---|---|---|---|"
            echo "| amlogic-s9xxx-openwrt (HEAD) | \`${PIN_ACTION:0:12}\` | \`${NOW_ACTION:0:12}\` | $(st "$NOW_ACTION" "$PIN_ACTION") |"
            echo "| luci-app-amlogic (最新 tag) | \`${PIN_AMLOGIC}\` | \`${NOW_AMLOGIC}\` | $(st "$NOW_AMLOGIC" "$PIN_AMLOGIC") |"
            echo "| immortalwrt (最新 25.12 tag) | \`${PIN_IMM}\` | \`${NOW_IMM}\` | $(st "$NOW_IMM" "$PIN_IMM") |"
            echo ""
            echo "> 看到 ⬆️：跑一轮构建验证 → 通过就把 pin 改成"上游当前"那一列的值 → 在 VERSIONS.md 记一行。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo ">>> 版本监视完成（详见 Summary；不影响构建）"

      - name: 准备容器
        run: bash scripts/n1/init.sh

      - name: 准备源码与补丁
        run: d "cd \${ffdir} && bash scripts/n1/prepare.sh"

      - name: 构建缓存
        uses: HiGarfield/cachewrtbuild@main
        with:
          mixkey: n1
          prefix: ${{ env.workdir_host }}/openwrt

      - name: 展开种子
        run: |
          d '
            cd ${wrtdir}
            cp ${ffdir}/configs/DSF/n1/phicomm-n1.config .config
            make defconfig
            p "关键项自检:"
            grep -E "^CONFIG_TARGET_armsr_armv8_DEVICE_generic=y|^CONFIG_TARGET_ARCH_PACKAGES=|^CONFIG_TARGET_ROOTFS_TARGZ=" .config || true
          '

      - name: 应用可选插件
        run: |
          d '
            cd ${wrtdir}
            if [ "${DOCKER}" = "yes" ]; then
              p "启用 Docker 插件"
              echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
              echo "CONFIG_PACKAGE_dockerd=y" >> .config
              make defconfig
            fi
          '
        env:
          DOCKER: ${{ inputs.include_docker }}

      - name: 包清单自检
        run: |
          d '
            cd ${wrtdir}
            p "=== 期望包是否都在 .config ==="
            for k in luci-app-amlogic luci-theme-argon luci-app-argon-config luci-i18n-argon-config-zh-cn \
                     luci-app-diskman luci-i18n-diskman-zh-cn luci-app-autoreboot luci-i18n-autoreboot-zh-cn \
                     luci-app-ramfree luci-i18n-ramfree-zh-cn filebrowser luci-app-filebrowser-go \
                     luci-i18n-filebrowser-go-zh-cn luci-app-samba4 luci-app-hd-idle luci-app-upnp luci-app-ttyd ; do
              if grep -qx "CONFIG_PACKAGE_${k}=y" .config; then
                p "  OK   ${k}"
              else
                p "  MISS ${k}   ← 大概率缺对应的 feed"
              fi
            done
          '

      - name: 开始编译
        run: |
          d '
            cd ${wrtdir}
            p "下载"
            make download -j$(nproc)
            p "编译"
            make -j$(($(nproc)+1)) || make -j1 V=s
            p "打包日志"
            tar -cf - logs/ 2>/dev/null | zstd -19 -T0 > "${workdir}/logs_n1.tar.zst" || true
          '

      - name: 上传日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-n1-${{ github.run_id }}
          path: ${{ env.workdir_host }}/logs_n1.tar.zst
          if-no-files-found: ignore
          retention-days: 7

      - name: 打包 Amlogic 镜像
        # ← 拿到 SHA 后 @ 替换
        uses: ffuqiangg/amlogic-s9xxx-openwrt@6a10e4a4a4d7ade41b87fad44e6b1be0b981743a
        with:
          openwrt_path: ${{ env.workdir_host }}/openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: s905d
          kernel_repo: ffuqiangg/kernel_${{ env.current_version }}.y
          openwrt_kernel: ${{ env.kernel_version }}
          kernel_usage: stable
          auto_kernel: false
          openwrt_ip: 192.168.100.1
          build_date: ${{ env.build_date }}

      - name: 收集产物 + 校验
        if: success()
        env:
          OUT: ${{ env.PACKAGED_OUTPUTPATH }}
        run: |
          set -uxo pipefail
          HOST="${workdir_host:-/mnt/ci}"
          if [ -z "${OUT:-}" ] || [ ! -d "${OUT}" ]; then
            echo "::error::PACKAGED_OUTPUTPATH 无效: '${OUT:-<空>}'（打包步骤可能失败了）"
            exit 1
          fi
          mkdir -p "${HOST}/artifact"
          cp -f "${OUT}"/*.img.gz "${HOST}/artifact/" || true
          ls -lh "${HOST}/artifact/"
          sha256sum "${HOST}/artifact/"*.img.gz > "${HOST}/artifact/sha256sums" 2>/dev/null || true
          {
            echo "### N1 产物"
            echo '```'
            ls -lh "${HOST}/artifact/"
            echo "-- 固件包数:"
            wc -l "${HOST}/openwrt/bin/targets/armsr/armv8/"*.manifest 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布 Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: N1-immortalwrt-${{ env.build_date }}-${{ github.run_id }}
          name: N1-immortalwrt-${{ env.build_date }}-${{ github.run_id }}
          files: |
            ${{ env.workdir_host }}/artifact/*.img.gz
            ${{ env.workdir_host }}/artifact/sha256sums
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
