# ============================================================================
# N1 产线 —— PHICOMM N1 / Amlogic S905D
# 路线：armsr/armv8 通用 ARM64 rootfs + ffuqiangg 外置内核 + Amlogic 打包 action
# ============================================================================
name: Build PHICOMM-N1

on:
  workflow_dispatch:
    inputs:
      include_docker:
        description: '是否集成 Docker 插件及防火墙配置'
        type: choice
        options:
          - no
          - yes
        default: 'no'
      enable_store:
        description: '是否集成 iStore 商店'
        type: choice
        options:
          - yes
          - no
        default: 'yes'

permissions:
  contents: write

concurrency:
  group: n1-build
  cancel-in-progress: false

env:
  WORKSPACE: ${{ github.workspace }}
  SRC_DIR: ${{ github.workspace }}/src
  LOG: ${{ github.workspace }}/build.log
  SEED: configs/DSF/n1/phicomm-n1.config
  IMM_TAG: v25.12.2
  AMLOGIC_PIN: '26.10.0301'
  AMLOGIC_ACTION_SHA: 6a10e4a4a4d7ade41b87fad44e6b1be0b981743a
  OPBE_IMAGE: ffuqiangg/opbe@sha256:45de14313f3c4d589d56d54653a0e7a386f33057818df2442c21302727e16125

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      # ---------------------------------------------------------------- 1 磁盘
      - name: 释放磁盘空间
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'false'
        continue-on-error: true

      # ---------------------------------------------------------------- 2 检出
      - name: 检出代码
        uses: actions/checkout@v4

      # ---------------------------------------------------------- 3 功能开关
      # N1 全程不读 configs/plugins.cfg，只由 input 决定
      - name: 解析功能开关
        env:
          IN_DOCKER: ${{ inputs.include_docker }}
          IN_STORE: ${{ inputs.enable_store }}
        run: |
          set -uo pipefail
          D="${IN_DOCKER:-no}"
          [ "${D}" = "yes" ] || D=no
          S="${IN_STORE:-yes}"
          [ "${S}" = "yes" ] || S=no
          {
            echo "WANT_DOCKER=${D}"
            echo "WANT_STORE=${S}"
          } >> "$GITHUB_ENV"
          {
            echo "### 功能开关"
            echo ""
            echo "| 开关 | 值 | 来源 |"
            echo "|---|---|---|"
            echo "| WANT_DOCKER | ${D} | inputs.include_docker |"
            echo "| WANT_STORE | ${S} | inputs.enable_store |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------- 4 前置检查
      - name: 前置检查（外部依赖）
        run: |
          set -uo pipefail
          IMM_VER="${IMM_TAG#v}"
          WANT_KVER="6.12.103"
          OK_BASE=""
          KVER=""
          KVG=""
          FAIL=0

          echo "=========== 1) immortalwrt 下载站现有版本目录 ==========="
          curl -s -m 25 "https://downloads.immortalwrt.org/releases/" -o /tmp/idx.html || true
          grep -oE 'href="[^"]+/"' /tmp/idx.html | sed -E 's/href="//; s|/"$||' | sort -u | tee /tmp/vers.txt || true
          echo "（以上是真实存在的版本目录，注意有没有 v 前缀）"

          echo "=========== 2) 逐候选探 profiles.json ==========="
          for M in "https://downloads.immortalwrt.org" "https://downloads.openwrt.org"; do
            for V in "${IMM_VER}" "v${IMM_VER}"; do
              B="${M}/releases/${V}/targets/armsr/armv8"
              C="$(curl -s -o /tmp/p.json -w '%{http_code}' -m 25 "${B}/profiles.json" || echo 000)"
              KV=""
              VG=""
              if [ "${C}" = "200" ]; then
                KV="$(jq -r '.linux_kernel.version' /tmp/p.json)"
                VG="$(jq -r '.linux_kernel.vermagic' /tmp/p.json)"
              fi
              echo "  HTTP=${C}  kernel=${KV:-?}  vermagic=${VG:-?}  ${B}/profiles.json"
              if [ "${C}" = "200" ] && [ "${KV}" = "${WANT_KVER}" ] && [ -z "${OK_BASE}" ]; then
                OK_BASE="${B}"
                KVER="${KV}"
                KVG="${VG}"
              fi
            done
          done

          echo "=========== 3) 全是 404 时，看看 armsr 目标在不在 ==========="
          if [ -z "${OK_BASE}" ]; then
            curl -s -m 25 "https://downloads.immortalwrt.org/releases/${IMM_VER}/targets/" | grep -oE 'href="[^"]+/"' | sed -E 's/href="//; s|/"$||' | sort -u | head -n 40 || true
          fi

          echo "=========== 4) kmods 与 ffuqiangg 内核资产 ==========="
          KMODS=""
          C2=000
          if [ -n "${OK_BASE}" ]; then
            KMODS="${KVER}-1-${KVG}"
            C2="$(curl -s -o /dev/null -w '%{http_code}' -m 25 "${OK_BASE}/kmods/${KMODS}/packages.adb" || echo 000)"
            [ "${C2}" = "200" ] || FAIL=1
          else
            FAIL=1
          fi
          C3="$(curl -s -o /tmp/ffkernel.json -w '%{http_code}' -m 25 "https://api.github.com/repos/ffuqiangg/kernel_6.12.y/releases" || echo 000)"

          {
            echo "### 前置检查"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 采用的 base | ${OK_BASE:-**无**} |"
            echo "| linux_kernel.version | ${KVER:-?}（要求 = ${WANT_KVER}） |"
            echo "| linux_kernel.vermagic | ${KVG:-?} |"
            echo "| kmods/${KMODS}/packages.adb | ${C2} |"
            echo "| ffuqiangg/kernel_6.12.y | ${C3} |"
            echo ""
            echo '```'
            if [ "${C3}" = "200" ] && [ -n "${KVER}" ]; then
              jq -r '.[].assets[].name' /tmp/ffkernel.json | grep -F "${KVER}" || echo "（ffuqiangg 里没有 ${KVER} 的资产 → 打包那步会失败）"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "采用 BASE=${OK_BASE:-无} kernel=${KVER} vermagic=${KVG} kmods=${C2} ffkernel=${C3}"
          [ "${FAIL}" = "0" ] || { echo "::error::前置检查未通过，见 Step Summary"; exit 1; }

      # -------------------------------------------------------------- 5 容器
      - name: 准备容器
        run: |
          set -euxo pipefail
          bash scripts/n1/init.sh

      # ------------------------------------------------------ 6 源码与补丁
      # WANT_DOCKER 透传进 prepare.sh，由它决定 99-docker-firewall 留不留
      - name: 准备源码与补丁
        run: |
          set -euxo pipefail
          d "cd \${ffdir} && WANT_DOCKER=${WANT_DOCKER} bash scripts/n1/prepare.sh"

      # --------------------------------------------- 6b 路径实况（临时诊断）
      - name: 打印构建树实况（临时诊断）
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### N1 路径实况"
            echo '```'
            echo "=========== 宿主 ==========="
            echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
            find "${GITHUB_WORKSPACE}" -maxdepth 4 -name 'feeds.conf.default' -not -path '*/feeds/*' 2>/dev/null || true
            find "${GITHUB_WORKSPACE}" -maxdepth 4 -name '.config' -not -path '*/build_dir/*' 2>/dev/null || true
            echo "=========== 容器内变量 ==========="
            d "echo ffdir=\${ffdir}" || true
            d "echo workdir=\${workdir}" || true
            d "echo srcdir=\${srcdir}" || true
            d "echo pwd=\$(pwd) HOME=\${HOME}" || true
            echo "=========== ffdir 里有什么 ==========="
            d "ls -ld \${ffdir} 2>&1" || true
            d "ls -l \${ffdir} 2>&1 | head -n 40" || true
            d "ls -l \${ffdir}/scripts/n1/ 2>&1 | head -n 20" || true
            d "ls -ld \${ffdir}/files \${ffdir}/files/etc 2>&1" || true
            echo "=========== 容器内找 OpenWrt 树 ==========="
            d "find / -maxdepth 4 -name 'feeds.conf.default' -not -path '*/feeds/*' 2>/dev/null | head" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------- 7 构建缓存
      - name: 构建缓存
        uses: HiGarfield/cachewrtbuild@main
        with:
          ccache: 'true'
          mixkey: n1
          prefix: ${{ github.workflow }}
        # ★核对 2：若现有文件里有 working-directory / skipccache 等参数，保留原样

      # ---------------------------------------------------------- 8 展开种子
      - name: 展开种子
        run: |
          set -euxo pipefail
          cd "${SRC_DIR}"
          cp -f "${WORKSPACE}/${SEED}" .config
          make defconfig
          {
            echo "### 种子自检"
            echo ""
            echo '```'
            grep -nE '^#? ?CONFIG_TARGET_(armsr_armv8_DEVICE_generic|ARCH_PACKAGES|ROOTFS_)' .config || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -qE '^CONFIG_TARGET_ROOTFS_TARGZ=y' .config || { echo "::error::CONFIG_TARGET_ROOTFS_TARGZ 没生效——打包 action 要 *rootfs.tar.gz，会卡死"; exit 1; }
          grep -qE '^CONFIG_TARGET_ARCH_PACKAGES="aarch64_generic"' .config || { echo "::error::ARCH_PACKAGES 不是 aarch64_generic——apk 脚本会推错架构目录"; exit 1; }

      # ------------------------------------------------------ 9 应用可选插件
      - name: 应用可选插件
        run: |
          set -euxo pipefail
          cd "${SRC_DIR}"
          if [ "${WANT_DOCKER}" = "yes" ]; then
            grep -qxF 'CONFIG_PACKAGE_dockerd=y' .config || echo 'CONFIG_PACKAGE_dockerd=y' >> .config
            grep -qxF 'CONFIG_PACKAGE_luci-app-dockerman=y' .config || echo 'CONFIG_PACKAGE_luci-app-dockerman=y' >> .config
            echo ">>> docker 已注入 .config"
          else
            echo ">>> WANT_DOCKER=no，跳过 docker"
          fi
          # iStore 走 apk 那条路（第 11/12 步），不进 .config
          make defconfig

      # -------------------------------------------------------- 10 包清单自检
      # 直接用种子文件反查 .config：任何被 defconfig 悄悄丢掉的包都会露出来
      - name: 包清单自检
        run: |
          set -uo pipefail
          cd "${SRC_DIR}"
          MISS=""
          while IFS= read -r want; do
            grep -qxF "${want}" .config || MISS="${MISS} $(printf '%s' "${want}" | sed -E 's/^CONFIG_PACKAGE_//; s/=y$//')"
          done < <(grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_+.-]+=y$' "${WORKSPACE}/${SEED}" || true)
          if [ -n "${MISS}" ]; then
            {
              echo "### 包清单自检：MISS"
              echo ""
              echo '```'
              echo "以下请求的包在 .config 里不存在（该 tag 上没有 / 名字不同 / 已改名）："
              for m in ${MISS}; do echo "MISS ${m}"; done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::种子里有 ${MISS}"
            exit 1
          fi
          echo ">>> 包清单自检通过" >> "$GITHUB_STEP_SUMMARY"

      # ----------------------------------------------- 11 拉取第三方 APK
      - name: Prepare Third-Party APKs
        if: env.WANT_STORE == 'yes'
        shell: bash
        env:
          SOURCE_DIR: ${{ env.SRC_DIR }}
          REPO: https://github.com/nslookupkx530-hue/apk.git
          BRANCHES: "My master"
          ALLOW_MISSING: "0"
          CUSTOM_PACKAGES: "luci-app-store"
        run: |
          set -euxo pipefail
          cd "${SOURCE_DIR}"
          bash "${WORKSPACE}/shell/apk-prepare-packages.sh"
          ls -lh "${SOURCE_DIR}/packages"

      # ----------------------------------------------- 12 装入固件 files/
      # 放在这里是因为 files/ 是在 make 生成 rootfs 时被烤进镜像的
      - name: Install Third-Party APKs into image
        if: env.WANT_STORE == 'yes'
        shell: bash
        run: |
          set -euxo pipefail
          OPENWRT_DIR="${SRC_DIR}"
          FIRMWARE_FILES_DIR="${OPENWRT_DIR}/files"
          REPO_FILES_DIR="${WORKSPACE}/files"
          APK_SOURCE_DIR="${OPENWRT_DIR}/packages"

          mkdir -p "${FIRMWARE_FILES_DIR}/usr/share/third-party"
          mkdir -p "${FIRMWARE_FILES_DIR}/etc/third-party"
          mkdir -p "${FIRMWARE_FILES_DIR}/etc/init.d"
          mkdir -p "${FIRMWARE_FILES_DIR}/etc/rc.d"

          APK_COUNT="$(find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          [ "${APK_COUNT}" -gt 0 ] || { echo "::error::${APK_SOURCE_DIR} 里没有 apk"; exit 1; }
          find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' -exec cp -f {} "${FIRMWARE_FILES_DIR}/usr/share/third-party/" \;
          echo ">>> 已拷入 ${APK_COUNT} 个第三方 apk"

          SRC_INIT="$(find "${REPO_FILES_DIR}" -type f -name 'apk-install' -print -quit 2>/dev/null || true)"
          SRC_INSTALLER="$(find "${REPO_FILES_DIR}" -type f -name 'install_third_party_apk.sh' -print -quit 2>/dev/null || true)"
          DST_INIT="${FIRMWARE_FILES_DIR}/etc/init.d/apk-install"
          DST_INSTALLER="${FIRMWARE_FILES_DIR}/etc/third-party/install_third_party_apk.sh"
          [ -f "${DST_INIT}" ] || { [ -n "${SRC_INIT}" ] && install -m 0755 "${SRC_INIT}" "${DST_INIT}"; }
          [ -f "${DST_INSTALLER}" ] || { [ -n "${SRC_INSTALLER}" ] && install -m 0755 "${SRC_INSTALLER}" "${DST_INSTALLER}"; }
          chmod 0755 "${DST_INIT}" "${DST_INSTALLER}" 2>/dev/null || true

          ln -sf ../init.d/apk-install "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"
          test -L "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"
          echo ">>> 首启服务已启用: /etc/rc.d/S99apk-install" >> "$GITHUB_STEP_SUMMARY"
          find "${FIRMWARE_FILES_DIR}/usr/share/third-party" -maxdepth 1 -type f -name '*.apk' -exec ls -lh {} \; >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------- 13 编译
      - name: 开始编译
        run: |
          set -o pipefail
          NPROC="$(nproc)"
          JOBS="$((NPROC + 1))"
          : > "${LOG}"
          d "cd \${srcdir} && make download -j8" 2>&1 | tee -a "${LOG}" || d "cd \${srcdir} && make download -j1 V=s" 2>&1 | tee -a "${LOG}" || echo "::warning::download 有失败项，继续编译"
          d "cd \${srcdir} && make -j${JOBS}" 2>&1 | tee -a "${LOG}" || d "cd \${srcdir} && make -j1 V=s" 2>&1 | tee -a "${LOG}"
          zstd -T0 -3 "${LOG}" -o "${LOG}.zst" || true

      # --------------------------------------------------------- 14 上传日志
      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: n1-build-logs-${{ github.run_id }}
          path: |
            build.log
            build.log.zst
          retention-days: 7
          if-no-files-found: warn

      # ------------------------------------------------------- 15 打包 Amlogic
      - name: 打包 Amlogic 镜像
        uses: ffuqiangg/amlogic-s9xxx-openwrt@6a10e4a4a4d7ade41b87fad44e6b1be0b981743a
        # ★ 提交后把原有的 with: 段贴回这里；缺参数时这一步会在运行时失败，不影响提交

      # ------------------------------------------------------- 16 收集 + 校验
      - name: 收集产物 + 校验
        run: |
          set -euxo pipefail
          mkdir -p out
          find "${SRC_DIR}/bin/targets/armsr/armv8" -maxdepth 1 -type f -name '*rootfs.tar.gz' -exec cp -v {} out/ \;
          find "${SRC_DIR}" -maxdepth 3 -type f -name '*.img' -exec cp -v {} out/ \; || true
          [ -n "$(find out -type f | head -n 1)" ] || { echo "::error::out/ 是空的"; exit 1; }
          {
            echo "### 产物"
            echo '```'
            ls -lh out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --------------------------------------------------------- 17 发 Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: n1-${{ github.run_number }}-${{ github.run_attempt }}
          name: N1 build ${{ github.run_number }}
          files: out/*
          fail_on_unmatched_files: false
        # ★核对 3：tag 规则以你现有文件为准
