name: OpenWrt Build & Release

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source Type'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - openwrt
          - immortalwrt
      target_device:
        description: 'Target Device'
        required: true
        default: 'x86'
        type: choice
        options:
          - x86
          - AXT-1800
          - GL-MT3600BE
          - Cudy-TR3000-256MB
          - Tenda-BE12PRO
      custom_packages:
        description: 'Optional: list of extra packages'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ github.event.inputs.target_device }} (${{ github.event.inputs.source_type }})
    runs-on: ubuntu-22.04

    # 设置全局环境变量，减少在各个 step 中重复定义变量的麻烦
    env:
      SOURCE_TYPE: ${{ github.event.inputs.source_type }}
      TARGET_DEVICE: ${{ github.event.inputs.target_device }}
      CUSTOM_PACKAGES: ${{ github.event.inputs.custom_packages }}
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 确保获取到所有子模块（如果你的源码里有子模块的话）
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang autoconf automake libtool bison flex gawk gettext git python3 \
            python3-pip python3-mako rsync unzip wget curl zstd dos2unix texinfo \
            libncurses-dev zlib1g-dev libssl-dev libffi-dev libreadline-dev \
            libsqlite3-dev libcap-dev libgd-dev libjpeg-dev libpng-dev \
            libcurl4-gnutls-dev libxml2-dev libxslt-dev qemu-utils
          # 注意：实际编译 OpenWrt 需要很多依赖，建议根据你的源码要求补充


      - name: Clone Source Repository
        run: |
          if [ "${{ github.event.inputs.source_type }}" = "immortalwrt" ]; then
            git clone https://github.com/ImmortalWrt/immortalwrt.git src
          else
            git clone https://github.com/openwrt/openwrt.git src
          fi
          cd src
          git submodule update --init --recursive


      - name: Clean build environment
        # 清理编译环境，确保每次构建都是干净的
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/src"
          # 仅清理构建相关的目录，保留 dl 以加速后续下载
          rm -rf staging_dir build_dir tmp
          mkdir -p dl


      - name: Update & Install feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/src"
          ./scripts/feeds update -a
          ./scripts/feeds install -a -f


      # --- 核心逻辑开始 ---

      - name: Prepare Base Configuration
        run: |
          cd "${{ github.workspace }}/src"
          # 执行获取 .buildinfo 并转换为 .config 的脚本
          # 该脚本会自动根据 SOURCE_TYPE 抓取对应源的最新稳定版配置
          bash ../shell/prepare_base_config.sh
          
          # 确认 .config 是否生成成功
          if [ ! -f .config ]; then
            echo "Error: .config file was not generated!"
            exit 1
          fi

          echo "=============================================================="
          echo ">>> FINAL .config CONTENT (Source: ${SOURCE_TYPE}, Device: ${TARGET_DEVICE})"
          echo "=============================================================="
          cat .config
          echo "=============================================================="


      - name: Load Third-Party Config & Inject Plugins
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/src"
          
          # 加载 third-party.config 并将其导出的变量注入到环境变量中
          CONFIG_PATH="./Third-Party/third-party.config"
          echo "=========================================="
          echo "STEP 1: Loading third-party.config"
          echo "=========================================="
          if [ ! -f "${CONFIG_PATH}" ]; then
            # 加载配置并导出变量到当前 Shell 环境
            source "${CONFIG_PATH}"
            
            # 确保变量存在且非空（如果为空则设为空字符串）
            export CUSTOM_PACKAGES="${CUSTOM_PACKAGES:-}"

            echo "SUCCESS: third-party.config loaded."
            echo "FINAL CUSTOM_PACKAGES: $CUSTOM_PACKAGES"
            
            # 将结果写入 GITHUB_ENV 供后续步骤使用            
            echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES:-}" >> "$GITHUB_ENV"
          else
            echo "ERROR: third-party.config not found at ./Third-Party/third-party.config"
          fi

          echo ""
          echo "=========================================="
          echo "STEP 2: Injecting Plugins via inject_plugins.sh"
          echo "=========================================="
          # 这里脚本内部已经带有 set -x 和各种 echo 输出，
          # 它会详细打印每一个配置项的修改动作（Injecting/Updating/Status）
          bash ../shell/inject_plugins.sh
          echo ""
          echo "=========================================="
          echo "STEP 3: Final Verification"
          echo "=========================================="
          echo "Source Type: $SOURCE_TYPE"
          echo "Target Device: $TARGET_DEVICE"
          echo "Final CUSTOM_PACKAGES to be processed:"
          if [ -z "$CUSTOM_PACKAGES" ]; then
            echo "  (None)"
          else
            echo "  $CUSTOM_PACKAGES"
          fi
          echo "=========================================="
          

      - name: Apply Device Files
        shell: bash
        run: |
          set -euxo pipefail

          # 统一使用 src 作为源码目录变量
          SOURCE_DIR="${{ github.workspace }}/src"
          FILE_DIR="${{ github.workspace }}/files/${{ inputs.device }}"

          if [ -d "${FILE_DIR}" ]; then
            echo ">>> Applying custom files for device: ${{ inputs.device}}"
            
            # 使用 cp -a 保持文件属性、权限和符号链接
            cp -af "${FILE_DIR}/." "${SOURCE_DIR}/files/"

            # 确保 uci-defaults 脚本可执行 (OpenWRT 系统核心要求)
            if [ -d "${SOURCE_DIR}/files/etc/uci-defaults" ]; then
              chmod 755 "${SOURCE_DIR}/files/etc/uci-defaults/"*
              echo "SUCCESS: uci-defaults permissions fixed."
            fi

            echo "Applied files preview (first 20):"
            find "${SOURCE_DIR}/files" -type f | head -n 20
          else
            echo "INFO: No custom files found for device ${{ inputs.device}} at ${FILE_DIR}"
          fi


      - name: Check custom files
        shell: bash
        run: |
          set -euxo pipefail

          # 使用统一的变量定义路径，确保与后续步骤一致
          SOURCE_DIR="${{ github.workspace }}/src"

          if [ -d "${SOURCE_DIR}/files" ]; then
            echo ">>> Custom files directory found. Listing contents:"
            find "${SOURCE_DIR}/files" -type f | sort
          else
            echo "WARNING: No custom files directory found in ${SOURCE_DIR}/files"
          fi


      - name: Prepare Third-Party APKs (External Injection)
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/src"
          # 使用环境变量中的 CUSTOM_PACKAGES 运行预处理脚本
          bash ../shell/apk-prepare-packages.sh


      - name: Install and Verify Third-Party APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          echo ">>> Preparing third-party APK files and startup service"
          # 当前工作目录是 src (OpenWrt 源码根目录)
          OPENWRT_DIR="${{ github.workspace }}/src"
          # 仓库根目录中的 files 目录 (在项目根目录)
          REPO_FILES_DIR="${{ github.workspace }}/files"
          # apk-prepare-packages.sh 生成的 APK 目录 (在 src/packages)
          APK_SOURCE_DIR="${OPENWRT_DIR}/packages"
          # 固件最终使用的 files 目录 (在 src/files)
          FIRMWARE_FILES_DIR="${OPENWRT_DIR}/files"
          echo ">>> OPENWRT_DIR: ${OPENWRT_DIR}"
          echo ">>> REPO_FILES_DIR: ${REPO_FILES_DIR}"
          echo ">>> APK_SOURCE_DIR: ${APK_SOURCE_DIR}"
          echo ">>> FIRMWARE_FILES_DIR: ${FIRMWARE_FILES_DIR}"
          # 创建固件文件目录结构
          mkdir -p \
            "${FIRMWARE_FILES_DIR}/usr/share/third-party" \
            "${FIRMWARE_FILES_DIR}/etc/third-party" \
            "${FIRMWARE_FILES_DIR}/etc/init.d"        
          # 检查 APK 输出目录是否存在
          if [ ! -d "${APK_SOURCE_DIR}" ]; then
            echo "ERROR: APK source directory does not exist:"
            echo "       ${APK_SOURCE_DIR}"
            exit 1
          fi
          # 检查是否成功生成 APK
          APK_COUNT="$(find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "${APK_COUNT}" -eq 0 ]; then
            echo "ERROR: No third-party APK files found in:"
            echo "       ${APK_SOURCE_DIR}"
            exit 1
          fi
          echo ">>> Found ${APK_COUNT} third-party APK package(s)"
          # 复制 APK 到固件目录 (src/files/... )
          find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' \
            -exec cp -f {} "${FIRMWARE_FILES_DIR}/usr/share/third-party/" \;
          # 检查并复制安装脚本和 init 服务
          INSTALLER_SCRIPT="${REPO_FILES_DIR}/etc/third-party/install_third_party_apk.sh"
          INIT_SERVICE="${REPO_FILES_DIR}/etc/init.d/apk-install"
          if [ ! -f "${INSTALLER_SCRIPT}" ]; then
            echo "ERROR: Installer script not found at ${INSTALLER_SCRIPT}"
            exit 1
          fi
          if [ ! -f "${INIT_SERVICE}" ]; then
            echo "ERROR: Init script not found at ${INIT_SERVICE}"
            exit 1
          fi
          # 执行安装：复制并赋予执行权限 (0755)
          install -m 0755 "${INSTALLER_SCRIPT}" "${FIRMWARE_FILES_DIR}/etc/third-party/install_third_party_apk.sh"
          install -m 0755 "${INIT_SERVICE}" "${FIRMWARE_FILES_DIR}/etc/init.d/apk-install"
          # 最终验证逻辑
          echo ">>> Verifying integration..."
          test -x "${FIRMWARE_FILES_DIR}/etc/third-party/install_third_party_apk.sh"
          test -x "${FIRMWARE_FILES_DIR}/etc/init.d/apk-install"
          if [ -e "${FIRMWARE_FILES_DIR}/etc/uci-defaults/99-third-party-apk" ]; then
            echo "ERROR: Obsolete uci-defaults installer still exists."
            exit 1
          fi
          echo "Third-party APK integration completed successfully."


      - name: Finalize Configuration (Dependency Resolution)
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/src"
          # 在所有插件注入和 APK 处理完成后，最后运行一次 defconfig 确保依赖完整对齐
          # 使用 FORCE=1 是为了在 GitHub Actions 环境下忽略主机环境不匹配的警告
          make defconfig FORCE=1


      - name: Prepare build download
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ github.workspace }}/src"
          # 将下载过程也重定向到日志文件，方便排查网络或路径问题
          make download -j$(nproc) 2>&1 | tee build_download.log


      - name: Build firmware
        shell: bash
        run: |
          set -uo pipefail
          cd "${{ github.workspace }}/src"

          # 使用所有可用核心进行并行编译
          # 如果在 GitHub Actions 上遇到内存不足（OOM）导致崩溃，
          # 可以将 -j$(nproc) 修改为 -j2 或 -j4
          export MAKEFLAGS="-j$(nproc)"
          export HOSTCFLAGS="-Wno-error"
          export HOSTCXXFLAGS="-Wno-error"
          export HOSTLDFLAGS=""

          echo "========================================"
          echo ">>> 开始 OpenWrt 编译"
          echo ">>> CPU: $(nproc)"
          echo "========================================"

          # 暂时关闭错误立即退出，以便后续分析日志
          set +e
          # V=s 显示所有编译细节，2>&1 将标准错误也定向到标准输出，| tee 同时输出到控制台和 build.log
          make V=s 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          # 恢复错误立即退出
          set -e

          echo ""
          echo "========================================"
          echo ">>> OpenWrt 构建结果"
          echo "========================================"
          echo "make exit code: ${BUILD_RC}"

          if [ "${BUILD_RC}" -ne 0 ]; then
            echo ""
            echo "========== FAILED PACKAGE =========="
            # 提取具体的软件包失败信息
            grep -E "ERROR: package/|failed to build" build.log | tail -30 || true

            echo ""
            echo "========== MAKE ERRORS =========="
            # 提取 make 的报错信息
            grep -E "make\[[0-9]+\]: \*\*\*" build.log | tail -50 || true

            echo ""
            echo "========== COMPILER FATAL ERRORS =========="
            # 提取编译器致命错误
            grep -E "fatal error:|error:" build.log | tail -50 || true

            echo ""
            echo "========== LAST 200 LINES =========="
            # 输出最后 200 行，通常包含最后的崩溃位置
            tail -200 build.log

            # 确保 GitHub Actions 状态为失败
            exit "${BUILD_RC}"
          fi

          echo ""
          echo "========================================"
          echo ">>> OpenWrt 编译成功"
          echo "========================================"


      - name: Upload build log
        if: failure() # 只在构建失败时上传
        uses: actions/upload-artifact@v4
        with:
          # 使用更通用的名称，包含所有可能生成的日志
          name: ${{ inputs.device }}-logs-${{ github.run_id }}
          # 同时上传构建日志和下载日志（如果存在的话）
          path: |
            src/build.log
            src/build_download.log
          if-no-files-found: ignore


      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_device }}-${{ github.event.inputs.source_type }}
          # 路径统一为 src/bin/*
          path: src/bin/*
 
          
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          # 自动生成名称：设备名-日期-RunID
          # 例如: x86-2025-05-20-35429357989
          tag_name: ${{ github.event.inputs.target_device }}-${{ github.event.date }}-${{ github.run_number }}
          files: src/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
