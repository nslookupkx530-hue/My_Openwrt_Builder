name: OpenWrt Build & Release

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source Type'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - openwrt
          - immortalwrt
      target_device:
        description: 'Target Device'
        required: true
        default: 'x86'
        type: choice
        options:
          - x86
          - AXT-1800
          - GL-MT3600BE
          - Cudy-TR3000-256MB
          - Tenda-BE12PRO
      custom_packages:
        description: 'Optional: list of extra packages'
        required: false
        default: ''

jobs:
  build:
    name: Build ${{ github.event.inputs.target_device }} (${{ github.event.inputs.source_type }})
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 确保获取到所有子模块（如果你的源码里有子模块的话）
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc \
            g++ \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            zstd \
            curl \
            dos2unix \
            qemu-utils \
            libxml2-dev \
            libxslt-dev \
            libcurl4-gnutls-dev \
            libgd-dev \
            libjpeg-dev \
            libpng-dev
          # 注意：实际编译 OpenWrt 需要很多依赖，建议根据你的源码要求补充


      - name: Clone Source Repository
        run: |
          if [ "${{ github.event.inputs.source_type }}" = "immortalwrt" ]; then
            git clone https://github.com/ImmortalWrt/immortalwrt.git src
          else
            git clone https://github.com/openwrt/openwrt.git src
          fi
          cd src
          git submodule update --init --recursive


      - name: Clean build environment
        # 清理编译环境
        run: |
          set -euxo pipefail
          rm -rf src/staging_dir src/build_dir src/tmp
          mkdir -p src/dl


      - name: Prepare Base Configuration
        env:
          SOURCE_TYPE: ${{ github.event.inputs.source_type }}
          TARGET_DEVICE: ${{ github.event.inputs.target_device }}
        run: |
          # 进入 src 目录确保 .config 生成在正确位置
          cd src
          # 执行获取 .buildinfo 并转换为 .config 的脚本
          # 该脚本会自动根据 SOURCE_TYPE 抓取对应源的最新稳定版配置
          bash ../shell/prepare_base_config.sh
          
          # 确认 .config 是否生成成功
          if [ ! -f .config ]; then
            echo "Error: .config file was not generated!"
            exit 1
          fi

          echo "=============================================================="
          echo ">>> FINAL .config CONTENT (Source: ${SOURCE_TYPE}, Device: ${TARGET_DEVICE})"
          echo "=============================================================="
          cat .config
          echo "=============================================================="


      - name: Load third-party config
        shell: bash
        run: |
          set -euxo pipefail
          CONFIG_PATH="./Third-Party/third-party.config"
          
          if [ ! -f "${CONFIG_PATH}" ]; then
            echo "Missing third-party config at ${CONFIG_PATH}"
            exit 1
          fi

          # 加载配置
          source "${CONFIG_PATH}"
          
          # 将从配置文件中读取到的 CUSTOM_PACKAGES 写入到 GitHub Environment 变量中
          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES:-}" >> "$GITHUB_ENV"
          echo "=========================================="
          echo "Third-party CUSTOM_PACKAGES:"
          echo "${CUSTOM_PACKAGES:-}"
          echo "=========================================="


      - name: Inject Plugins
        run: |
          # 进入 src 目录并执行插件注入脚本
          cd src
          # 执行插件注入脚本
          # 它会根据 configs/plugins.cfg 修改 .config 中的用户态软件
          bash ../shell/inject_plugins.sh


      - name: Prepare Third-Party APKs
        env:
          SOURCE_DIR: ./
          CUSTOM_PACKAGES: "${{ env.CUSTOM_PACKAGES }}"
        run: |
          # 这里的 SOURCE_DIR 指向当前 src 目录，确保脚本能找到正确的路径
          # 如果你在 GitHub Actions 界面手动输入了插件列表，它会从环境变量获取
          cd src
          bash ../shell/apk-prepare-packages.sh


      - name: Finalize Configuration
        run: |
          # 确保在 src 目录下执行
          cd src
          # 重新执行一次 defconfig 是为了确保 inject_plugins.sh 注入的配置 
          # 被构建系统正确解析并补全依赖，这是修改 .config 后的标准操作
          # 使用 FORCE=1 是为了在 GitHub Actions 环境下忽略主机环境不匹配的警告
          make defconfig FORCE=1


      - name: Build firmware
        shell: bash
        run: |
          set -uo pipefail

          # 注意：这里路径改为 src，对应你之前的 Clone 步骤
          cd "${{ github.workspace }}/src"

          # 使用所有可用核心进行并行编译
          # 如果在 GitHub Actions 上遇到内存不足（OOM）导致崩溃，
          # 可以将 -j$(nproc) 修改为 -j2 或 -j4
          export MAKEFLAGS="-j$(nproc)"
          export HOSTCFLAGS="-Wno-error"
          export HOSTCXXFLAGS="-Wno-error"
          export HOSTLDFLAGS=""

          echo "========================================"
          echo ">>> 开始 OpenWrt 编译"
          echo ">>> CPU: $(nproc)"
          echo "========================================"

          # 暂时关闭错误立即退出，以便后续分析日志
          set +e
          # V=s 显示所有编译细节，2>&1 将标准错误也定向到标准输出，| tee 同时输出到控制台和 build.log
          make V=s 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          # 恢复错误立即退出
          set -e

          echo ""
          echo "========================================"
          echo ">>> OpenWrt 构建结果"
          echo "========================================"
          echo "make exit code: ${BUILD_RC}"

          if [ "${BUILD_RC}" -ne 0 ]; then
            echo ""
            echo "========== FAILED PACKAGE =========="
            # 提取具体的软件包失败信息
            grep -E "ERROR: package/|failed to build" build.log | tail -30 || true

            echo ""
            echo "========== MAKE ERRORS =========="
            # 提取 make 的报错信息
            grep -E "make\[[0-9]+\]: \*\*\*" build.log | tail -50 || true

            echo ""
            echo "========== COMPILER FATAL ERRORS =========="
            # 提取编译器致命错误
            grep -E "fatal error:|error:" build.log | tail -50 || true

            echo ""
            echo "========== LAST 200 LINES =========="
            # 输出最后 200 行，通常包含最后的崩溃位置
            tail -200 build.log

            # 确保 GitHub Actions 状态为失败
            exit "${BUILD_RC}"
          fi

          echo ""
          echo "========================================"
          echo ">>> OpenWrt 编译成功"
          echo "========================================"


      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_device }}-${{ github.event.inputs.source_type }}
          # 路径统一为 src/bin/*
          path: src/bin/*
 
          
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          # 自动生成名称：设备名-日期-RunID
          # 例如: x86-2025-05-20-35429357989
          tag_name: ${{ github.event.inputs.target_device }}-${{ github.event.date }}-${{ github.run_number }}
          files: src/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
