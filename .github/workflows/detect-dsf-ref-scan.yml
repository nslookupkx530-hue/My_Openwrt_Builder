name: DSF Ref Scanner (查该用哪个分支)
run-name: "DSF Ref Scanner (查该用哪个分支): ${{ inputs.device }}"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备"
        required: true
        default: 'JDC-AX6600'
        type: choice
        options: [JDC-AX6600, GL-MT5000]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Scan all refs
        shell: bash
        run: |
          set -euxo pipefail
          MAP=configs/DSF/device_mapping.conf
          DEV='${{ github.event.inputs.device }}'
          LINE="$(grep -E "^[[:space:]]*${DEV}=" "${MAP}" | head -n1)"
          REPO="$(printf '%s' "${LINE#*=}" | cut -d'|' -f1 | xargs)"
          SEED="$(printf '%s' "${LINE#*=}" | cut -d'|' -f3 | xargs)"
          echo ">>> device=${DEV}  repo=${REPO}  seed=${SEED}"
          echo ">>> 种子声明包数: $(grep -cE '^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$' "${SEED}" || true)"

          # 只取 commit/tree、不取 blob（快，且后续 git show 按需拉取）
          rm -rf repo
          git clone --filter=blob:none --no-checkout "${REPO}" repo >/dev/null 2>&1
          cd repo

          REFS="$( { git branch -r --format='%(refname:short)' | grep -v HEAD; git tag; } | head -40 )"
          {
            echo "## ${DEV} ref 扫描"
            echo ""
            echo "| ref | 最后提交 | 有 feeds.conf | feed 行数 |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for r in ${REFS}; do
            D="$(git log -1 --format=%ci "${r}" 2>/dev/null || echo '?')"
            F="feeds.conf"; git cat-file -e "${r}:${F}" 2>/dev/null || F="feeds.conf.default"
            BODY="$(git show "${r}:${F}" 2>/dev/null || echo '(无 feeds.conf)')"
            N="$(printf '%s\n' "${BODY}" | grep -cE '^[[:space:]]*src-' || true)"

            echo "=============================================================="
            echo "### ${r}   (${D})"
            echo "--- ${F}  (${N} 行 src-*) ---"
            printf '%s\n' "${BODY}"

            # 分支里"额外挂 feed / 改 feeds.conf"的脚本或 CI
            echo "--- 提到 src-git/src-link 的脚本/CI ---"
            git ls-tree -r --name-only "${r}" 2>/dev/null \
              | grep -E '^\.github/workflows/|feeds\.conf|(^|/)[A-Za-z0-9_.-]*(build|compile|feeds|diy)[A-Za-z0-9_.-]*\.sh$' \
              | head -30 \
              | while read -r f; do
                  if git show "${r}:${f}" 2>/dev/null | grep -qE 'src-git|src-link|feeds\.conf'; then echo "  HIT ${f}"; fi
                done | head -6

            printf '| `%s` | %s | %s | %s |\n' "${r}" "${D%% *}" "${F}" "${N}" >> "$GITHUB_STEP_SUMMARY"
          done
