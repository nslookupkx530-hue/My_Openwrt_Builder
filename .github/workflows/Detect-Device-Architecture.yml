name: Detect Device Architecture
run-name: Detect Device Architecture - ${{ inputs.device }}

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备型号（configs/device_mapping.conf 里的键，如 AXT-1800）"
        required: true
        default: "x86"
        type: string
      target_path:
        description: "直接指定 target 路径（如 qualcommax/ipq60xx）；留空则从 device_mapping.conf 查"
        required: false
        default: ""
        type: string
      arch_override:
        description: "强制指定架构（如 aarch64_cortex-a53）；留空则自动推导"
        required: false
        default: ""
        type: string
      profile_keyword:
        description: "【可选】手工指定 key 匹配串（如 MT3600）；留空=用设备名自动解析（推荐留空）"
        required: false
        default: ""
        type: string
      source_type:
        description: "要编译的源码类型（决定优先用哪个源的 profiles.json）"
        required: true
        default: "immortalwrt"
        type: choice
        options:
          - immortalwrt
          - openwrt
      immortalwrt_version:
        description: "immortalwrt 版本（第三方 apk 的来源，决定 BASE）；填 snapshot 表示快照通道"
        required: true
        default: "25.12.2"
        type: string
      openwrt_version:
        description: "openwrt 版本（交叉核对用）；填 snapshot 表示快照通道"
        required: false
        default: "25.12.5"
        type: string
      repo_prefix:
        description: "apk 仓库里架构目录之前的前缀，如 openwrt；没有就留空"
        required: false
        default: ""
        type: string
      verify_mirror:
        description: "是否探活镜像 luci 目录并逐个核对清单里的包"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  detect:
    name: Detect ${{ github.event.inputs.device }}
    runs-on: ubuntu-22.04

    env:
      MIRROR_IMM: https://mirror.nju.edu.cn/immortalwrt
      MIRROR_OWRT: https://mirror.nju.edu.cn/openwrt
      SUBDIR: luci-third-party-openwrt
      PKG_LIST: configs/third-party-openwrt.config

      IN_DEVICE: ${{ github.event.inputs.device }}
      IN_TARGET_PATH: ${{ github.event.inputs.target_path }}
      IN_ARCH_OVERRIDE: ${{ github.event.inputs.arch_override }}
      IN_PROFILE_KEYWORD: ${{ github.event.inputs.profile_keyword }}
      IN_SOURCE_TYPE: ${{ github.event.inputs.source_type }}
      IN_IMM_VER: ${{ github.event.inputs.immortalwrt_version }}
      IN_OWRT_VER: ${{ github.event.inputs.openwrt_version }}
      IN_REPO_PREFIX: ${{ github.event.inputs.repo_prefix }}
      IN_VERIFY: ${{ github.event.inputs.verify_mirror }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect architecture
        shell: bash
        run: |
          set -euo pipefail

          die() { echo "::error::$*" >&2; exit 1; }
          hdr() { echo; echo "======== $* ========"; }

          DEVICE="${IN_DEVICE:-x86}"
          TP_IN="${IN_TARGET_PATH:-}"
          ARCH_OVERRIDE="${IN_ARCH_OVERRIDE:-}"
          PROFILE_KEYWORD="${IN_PROFILE_KEYWORD:-}"
          SOURCE_TYPE="${IN_SOURCE_TYPE:-immortalwrt}"
          REPO_PREFIX="${IN_REPO_PREFIX:-}"
          REPO_PREFIX="${REPO_PREFIX#/}"; REPO_PREFIX="${REPO_PREFIX%/}"
          IMM_VER="${IN_IMM_VER:-25.12.2}"
          OWRT_VER="${IN_OWRT_VER:-25.12.5}"
          VERIFY="${IN_VERIFY:-true}"

          # ================= 工具函数 =================
          probe() {   # $1=url → 打印 http code
            curl -s -o /dev/null -w '%{http_code}' -L --retry 2 --connect-timeout 15 --max-time 45 "$1" 2>/dev/null || echo 000
          }

          # 候选 URL：先 releases/<ver>，再 snapshots/（新设备常常只在 snapshot 里）
          target_urls() {   # $1=mirror $2=version $3=文件名
            if [ -n "$2" ] && [ "$2" != "snapshot" ]; then
              printf '%s\n' "${1}/releases/${2}/targets/${TARGET_PATH}/$3"
            fi
            printf '%s\n' "${1}/snapshots/targets/${TARGET_PATH}/$3"
          }

          # 来源①：profiles.json 的 arch_packages（权威）
          arch_from_profiles() {   # $1=mirror $2=version
            local u out
            while IFS= read -r u; do
              out="$(curl -fsSL --retry 2 --connect-timeout 20 --max-time 60 "$u" 2>/dev/null || true)"
              if [ -n "${out}" ]; then
                printf '%s' "${out}" \
                  | grep -oE '"arch_packages"[[:space:]]*:[[:space:]]*"[^"]+"' \
                  | sed -E 's/.*:[[:space:]]*"([^"]+)"$/\1/' | head -n1
                return 0
              fi
            done < <(target_urls "$1" "$2" "profiles.json")
            return 1
          }

          # 来源②：config.buildinfo（精简文件，可能没有该符号）
          arch_from_buildinfo() {  # $1=mirror $2=version
            local u out
            while IFS= read -r u; do
              out="$(curl -fsSL --retry 2 --connect-timeout 20 --max-time 60 "$u" 2>/dev/null || true)"
              if [ -n "${out}" ]; then
                printf '%s' "${out}" \
                  | sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' | head -n1
                return 0
              fi
            done < <(target_urls "$1" "$2" "config.buildinfo")
            return 1
          }

          # 来源③：内置兜底表（务必与 fetch-openwrt-third-party.sh 的 exact_arch_dir 保持一致）
          fallback_arch() {
            case "$1" in
              x86|"x86/64")         echo "x86_64" ;;
              qualcommax/ipq60xx)   echo "aarch64_cortex-a53" ;;
              qualcommax/ipq807x)   echo "aarch64_cortex-a53" ;;
              qualcommax/ipq50xx)   echo "aarch64_cortex-a53" ;;
              mediatek/filogic)     echo "aarch64_cortex-a53" ;;
              mediatek/mt7622)      echo "aarch64_cortex-a53" ;;
              mediatek/mt7623)      echo "aarch64_cortex-a53" ;;
              *)                    echo "" ;;
            esac
          }

          # 架构名 → apk 仓库目录名（改这里必须同步 fetch-openwrt-third-party.sh）
          repo_arch_dir() {
            case "$1" in
              x86_64|x86_64_*)                          echo "x86_64" ;;
              aarch64_cortex-a53|aarch64_cortex-a53_*)   echo "arm64-a53" ;;
              aarch64*|arm64*)                          echo "arm64" ;;
              *)                                        echo "" ;;
            esac
          }

          # 列出某页面下的子目录名
          list_dirs() {   # $1=url
            curl -fsSL --retry 2 --connect-timeout 15 --max-time 45 "$1" 2>/dev/null \
              | grep -oE 'href="[^"]+/"' | sed 's/href="//;s|/"||' \
              | grep -vE '^\.|^/' | sort -u | sed 's/^/        /'
          }

          # 抓某源某通道的 key 表（channel: release | snapshot）
          fetch_keys_chan() {   # $1=mirror  $2=版本(填 snapshot 表示快照)  $3=输出 TSV
            : > "$3"
            local u="${1}/snapshots/targets/${TARGET_PATH}/profiles.json"
            if [ -n "$2" ] && [ "$2" != "snapshot" ]; then
              u="${1}/releases/${2}/targets/${TARGET_PATH}/profiles.json"
            fi
            local json
            json="$(curl -fsSL --retry 2 --connect-timeout 20 --max-time 60 "$u" 2>/dev/null || true)"
            if [ -z "${json}" ]; then return 0; fi
            printf '%s' "${json}" | python3 -c '
          import json,sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          prof = d.get("profiles") or {}
          for k in sorted(prof):
              v = prof.get(k) or {}
              ts = v.get("titles") or []
              t = (ts[0].get("title","") if ts else "")
              print("%s\t%s" % (k, t))
          ' > "$3" 2>/dev/null || true
          }

          # 把同一源的两个通道合并成 "key <TAB> 标题 <TAB> 通道标记"
          merge_chan() {   # $1=输出  其余="标签:文件"
            local out="$1"; shift
            local spec ch kf
            for spec in "$@"; do
              ch="${spec%%:*}"; kf="${spec#*:}"
              if [ -s "${kf}" ]; then
                awk -F'\t' -v ch="${ch}" '{print $1"\t"$2"\t"ch}' "${kf}"
              fi
            done | awk -F'\t' '
              { k=$1
                if (!(k in t)) t[k]=$2
                if (c[k] !~ $3) c[k]=(c[k]=="" ? $3 : c[k]","$3) }
              END { for (k in t) printf "%s\t%s\t%s\n", k, t[k], c[k] }
            ' | sort > "${out}"
          }

          # 归一化：去掉 - _ . 空格等非字母数字，再转大写
          #   AXT-1800 → AXT1800，与标题 "GL.iNet GL-AXT1800" / key glinet_gl-axt1800 都能对上
          norm() { printf '%s' "$1" | LC_ALL=C tr -cd 'A-Za-z0-9' | LC_ALL=C tr 'a-z' 'A-Z'; }

          # 按归一化子串匹配，输出 "分数<TAB>key<TAB>标题<TAB>通道"，分数降序
          #   输入表格式：key<TAB>标题<TAB>通道
          match_keys() {   # $1=合并表  $2=归一化后的匹配串
            awk -F'\t' -v n="$2" '
              function norm(s){ gsub(/[^A-Za-z0-9]/,"",s); return toupper(s) }
              {
                nk = norm($1); nt = norm($2); sc = 0
                if (nt == n || nk == n)    sc = 100
                else if (index(nt, n) > 0) sc = 90 - length(nt)/1000
                else if (index(nk, n) > 0) sc = 80 - length(nk)/1000
                if (sc > 0) printf "%.3f\t%s\t%s\t%s\n", sc, $1, $2, $3
              }
            ' "$1" | sort -rn -k1,1
          }

          # ================================================================
          # 1) 解析 target 路径
          # ================================================================
          TARGET_PATH="${TP_IN}"
          if [ -z "${TARGET_PATH}" ]; then
            MAP="configs/device_mapping.conf"
            [ -f "${MAP}" ] || die "找不到 ${MAP}"
            LINE="$(grep -E "^[[:space:]]*${DEVICE}=" "${MAP}" | head -n1 || true)"
            if [ -n "${LINE}" ]; then
              TARGET_PATH="${LINE#*=}"; TARGET_PATH="${TARGET_PATH%%|*}"
              TARGET_PATH="$(printf '%s' "${TARGET_PATH}" | tr -d '[:space:]')"
              TARGET_PATH="${TARGET_PATH%/}"; TARGET_PATH="${TARGET_PATH#targets/}"
              echo ">>> 从 ${MAP} 解析: ${DEVICE} → ${TARGET_PATH}"
            else
              echo ">>> ${MAP} 里没有 '${DEVICE}'，可用键:"
              grep -oE '^[[:space:]]*[^#=[:space:]]+' "${MAP}" | tr -d '[:space:]' | sort -u | sed 's/^/        /' || true
              die "无法定位 ${DEVICE} 的 target 路径；请用 target_path 输入直接指定"
            fi
          else
            echo ">>> 使用输入指定的 target 路径: ${TARGET_PATH}"
          fi
          TARGET_PATH="${TARGET_PATH#targets/}"; TARGET_PATH="${TARGET_PATH%/}"
          [ -n "${TARGET_PATH}" ] || die "target 路径为空"
          GROUP="${TARGET_PATH%%/*}"

          # ================================================================
          # 2) 两源 profile key 交叉核对 + 自动解析本设备的 key
          #    同时抓 release 与 snapshot 两个通道（新设备往往只在 snapshot 里）
          # ================================================================
          hdr "两源 profile key 交叉核对：${TARGET_PATH}"
          N_IMM=0; N_OWRT=0; N_BOTH=0; N_OI=0; N_OO=0
          KEY_HIT=""; KEY_CHAN=""
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::warning::runner 上没有 python3，跳过 key 交叉核对"
          else
            echo "  profiles.json 可达性（release / snapshot）："
            echo "    immortalwrt: [$(probe "${MIRROR_IMM}/releases/${IMM_VER}/targets/${TARGET_PATH}/profiles.json")] / [$(probe "${MIRROR_IMM}/snapshots/targets/${TARGET_PATH}/profiles.json")]"
            echo "    openwrt    : [$(probe "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${TARGET_PATH}/profiles.json")] / [$(probe "${MIRROR_OWRT}/snapshots/targets/${TARGET_PATH}/profiles.json")]"

            fetch_keys_chan "${MIRROR_IMM}"  "${IMM_VER}"  /tmp/k-ir.tsv
            fetch_keys_chan "${MIRROR_IMM}"  "snapshot"    /tmp/k-is.tsv
            fetch_keys_chan "${MIRROR_OWRT}" "${OWRT_VER}" /tmp/k-or.tsv
            fetch_keys_chan "${MIRROR_OWRT}" "snapshot"    /tmp/k-os.tsv
            echo "  通道 key 数：imm-release=$(wc -l < /tmp/k-ir.tsv)  imm-snapshot=$(wc -l < /tmp/k-is.tsv)  owrt-release=$(wc -l < /tmp/k-or.tsv)  owrt-snapshot=$(wc -l < /tmp/k-os.tsv)"

            merge_chan /tmp/k-imm.tsv  "release:/tmp/k-ir.tsv" "snapshot:/tmp/k-is.tsv"
            merge_chan /tmp/k-owrt.tsv "release:/tmp/k-or.tsv" "snapshot:/tmp/k-os.tsv"
            cut -f1 /tmp/k-imm.tsv  | sort -u > /tmp/keys-imm.txt
            cut -f1 /tmp/k-owrt.tsv | sort -u > /tmp/keys-owrt.txt
            N_IMM="$(wc -l < /tmp/keys-imm.txt)"
            N_OWRT="$(wc -l < /tmp/keys-owrt.txt)"
            comm -12 /tmp/keys-imm.txt /tmp/keys-owrt.txt > /tmp/keys-both.txt
            comm -23 /tmp/keys-imm.txt /tmp/keys-owrt.txt > /tmp/keys-only-imm.txt
            comm -13 /tmp/keys-imm.txt /tmp/keys-owrt.txt > /tmp/keys-only-owrt.txt
            N_BOTH="$(wc -l < /tmp/keys-both.txt)"
            N_OI="$(wc -l < /tmp/keys-only-imm.txt)"
            N_OO="$(wc -l < /tmp/keys-only-owrt.txt)"

            if [ "${N_IMM}" = "0" ] && [ "${N_OWRT}" = "0" ]; then
              echo "::warning::两源都取不到 profiles.json（target=${TARGET_PATH}），跳过 key 核对与自动解析"
            else
              echo "  immortalwrt（release ∪ snapshot）: ${N_IMM} 个 key"
              echo "  openwrt    （release ∪ snapshot）: ${N_OWRT} 个 key"
              echo "  两边都有: ${N_BOTH}    仅 immortalwrt: ${N_OI}    仅 openwrt: ${N_OO}"
              if [ "${N_OI}" -gt 0 ]; then
                echo ">>> 只在 immortalwrt 存在的 key："
                head -n 40 /tmp/keys-only-imm.txt | sed 's/^/    /'
                if [ "${N_OI}" -gt 40 ]; then echo "    ...（共 ${N_OI} 个）"; fi
              fi
              if [ "${N_OO}" -gt 0 ]; then
                echo ">>> 只在 openwrt 存在的 key："
                head -n 40 /tmp/keys-only-owrt.txt | sed 's/^/    /'
                if [ "${N_OO}" -gt 40 ]; then echo "    ...（共 ${N_OO} 个）"; fi
              fi

              NEEDLE_SRC="${PROFILE_KEYWORD}"
              [ -n "${NEEDLE_SRC}" ] || NEEDLE_SRC="${DEVICE}"
              NEEDLE="$(norm "${NEEDLE_SRC}")"

              if [ "${DEVICE}" = "x86" ] && [ -z "${PROFILE_KEYWORD}" ]; then
                echo
                echo ">>> 设备是 x86（设备数少，不强制收窄）→ 跳过 key 自动解析"
              else
                echo
                echo ">>> key 自动解析：'${NEEDLE_SRC}' → 归一化 '${NEEDLE}'"

                HITS_IMM="$(match_keys  /tmp/k-imm.tsv  "${NEEDLE}" || true)"
                HITS_OWRT="$(match_keys /tmp/k-owrt.tsv "${NEEDLE}" || true)"
                C_IMM="$(printf '%s\n' "${HITS_IMM}"   | grep -c . || true)"
                C_OWRT="$(printf '%s\n' "${HITS_OWRT}" | grep -c . || true)"

                echo "  ---- immortalwrt：命中 ${C_IMM} 个 ----"
                if [ "${C_IMM}" -gt 0 ]; then
                  printf '%s\n' "${HITS_IMM}" | awk -F'\t' '{printf "    %-42s %-26s [%s]\n",$2,$3,$4}' | head -n 5
                fi
                echo "  ---- openwrt：命中 ${C_OWRT} 个 ----"
                if [ "${C_OWRT}" -gt 0 ]; then
                  printf '%s\n' "${HITS_OWRT}" | awk -F'\t' '{printf "    %-42s %-26s [%s]\n",$2,$3,$4}' | head -n 5
                fi

                KEY_IMM="$(printf '%s\n' "${HITS_IMM}"   | sed -n '1p' | cut -f2)"
                KEY_OWRT="$(printf '%s\n' "${HITS_OWRT}" | sed -n '1p' | cut -f2)"
                CH_IMM="$(printf '%s\n' "${HITS_IMM}"    | sed -n '1p' | cut -f4)"
                CH_OWRT="$(printf '%s\n' "${HITS_OWRT}"  | sed -n '1p' | cut -f4)"

                if [ "${C_IMM}" = "1" ] && [ "${C_OWRT}" = "1" ] && [ "${KEY_IMM}" = "${KEY_OWRT}" ]; then
                  echo "  >>> 自动解析成功，两源一致 → 可以共用同一个 key"
                  KEY_HIT="${KEY_IMM}"; KEY_CHAN="${CH_IMM}"
                elif [ "${C_IMM}" = "1" ] && [ "${C_OWRT}" = "0" ]; then
                  echo "::warning::解析到 ${KEY_IMM}，但它只在 immortalwrt 有 → 只能用 immortalwrt 源编"
                  KEY_HIT="${KEY_IMM}"; KEY_CHAN="${CH_IMM}"
                elif [ "${C_IMM}" = "0" ] && [ "${C_OWRT}" = "1" ]; then
                  echo "::warning::解析到 ${KEY_OWRT}，但它只在 openwrt 有 → 只能用 openwrt 源编"
                  KEY_HIT="${KEY_OWRT}"; KEY_CHAN="${CH_OWRT}"
                elif [ "${C_IMM}" = "0" ] && [ "${C_OWRT}" = "0" ]; then
                  echo "::warning::自动解析没命中 —— 该版本可能还没支持这台设备，或官方写法差异较大"
                  echo ">>> 兜底：按设备名里的各段再试一次（哪段命中就把哪段手工填进 profile_keyword）"
                  for tok in $(printf '%s' "${NEEDLE_SRC}" | LC_ALL=C tr -cs 'A-Za-z0-9' '\n'); do
                    NT="$(norm "${tok}")"
                    if [ "${#NT}" -lt 3 ]; then continue; fi
                    echo "    片段 '${NT}'："
                    for pair in "immortalwrt:/tmp/k-imm.tsv" "openwrt:/tmp/k-owrt.tsv"; do
                      lbl="${pair%%:*}"; kf="${pair#*:}"
                      cnt="$(match_keys "$kf" "${NT}" | grep -c . || true)"
                      if [ "${cnt}" -gt 0 ]; then
                        printf '      [%s] 命中 %s 个：\n' "${lbl}" "${cnt}"
                        match_keys "$kf" "${NT}" | awk -F'\t' '{printf "          %-42s %-26s [%s]\n",$2,$3,$4}' | head -n 8
                      fi
                    done
                  done
                else
                  echo "::warning::命中多个 → 请从上面人工挑一个，或填 profile_keyword 收窄"
                fi

                if [ -n "${KEY_HIT}" ]; then
                  echo "  >>> 该 key 所在通道: [${KEY_CHAN}]"
                  case "${KEY_CHAN}" in
                    snapshot)
                      echo "::warning::这台设备【只在 snapshot 通道存在】→ release/稳定版源码里没有它！"
                      echo "          编它必须：① source_ref 填主分支（openwrt=main / immortalwrt=master）"
                      echo "                    ② version 填 snapshot"
                      ;;
                    release)
                      echo "  >>> 该设备在 release 通道里 → 按稳定版编即可"
                      ;;
                    *)
                      echo "  >>> 该设备 release 与 snapshot 都有 → release tag 也能编"
                      ;;
                  esac
                fi
              fi
            fi
          fi

          # ================================================================
          # 3) 查询架构（两源、release/snapshot 都试）
          # ================================================================
          hdr "查询 ${TARGET_PATH} 的架构"
          A_IMM_P="$(arch_from_profiles   "${MIRROR_IMM}"  "${IMM_VER}"  || true)"
          A_IMM_B="$(arch_from_buildinfo  "${MIRROR_IMM}"  "${IMM_VER}"  || true)"
          A_OW_P="$(arch_from_profiles    "${MIRROR_OWRT}" "${OWRT_VER}" || true)"
          A_OW_B="$(arch_from_buildinfo   "${MIRROR_OWRT}" "${OWRT_VER}" || true)"
          echo "  immortalwrt ${IMM_VER} : profiles.json=${A_IMM_P:-<无>}   config.buildinfo=${A_IMM_B:-<无>}"
          echo "  openwrt     ${OWRT_VER} : profiles.json=${A_OW_P:-<无>}   config.buildinfo=${A_OW_B:-<无>}"

          IMM_ARCH="${A_IMM_P:-${A_IMM_B}}"
          OWRT_ARCH="${A_OW_P:-${A_OW_B}}"

          if [ -n "${IMM_ARCH}" ] && [ -n "${OWRT_ARCH}" ] && [ "${IMM_ARCH}" != "${OWRT_ARCH}" ]; then
            echo "::warning::两源架构不一致：immortalwrt=${IMM_ARCH}  openwrt=${OWRT_ARCH}（BASE 以 immortalwrt 侧为准）"
          fi

          # ================================================================
          # 4) 定最终架构：覆盖 > profiles > buildinfo > 兜底表
          # ================================================================
          MIRROR_ARCH=""; ARCH_SRC=""
          if [ -n "${ARCH_OVERRIDE}" ]; then
            MIRROR_ARCH="${ARCH_OVERRIDE}"; ARCH_SRC="输入指定(arch_override)"
          elif [ "${SOURCE_TYPE}" = "immortalwrt" ]; then
            if [ -n "${IMM_ARCH}" ]; then
              MIRROR_ARCH="${IMM_ARCH}"; ARCH_SRC="immortalwrt profiles/buildinfo"
            elif [ -n "${OWRT_ARCH}" ]; then
              echo "::warning::immortalwrt 上没有 ${TARGET_PATH}；改用 openwrt 侧的架构"
              MIRROR_ARCH="${OWRT_ARCH}"; ARCH_SRC="openwrt profiles/buildinfo（回退）"
            fi
          else
            if [ -n "${OWRT_ARCH}" ]; then
              MIRROR_ARCH="${OWRT_ARCH}"; ARCH_SRC="openwrt profiles/buildinfo"
            elif [ -n "${IMM_ARCH}" ]; then
              MIRROR_ARCH="${IMM_ARCH}"; ARCH_SRC="immortalwrt profiles/buildinfo（回退）"
            fi
          fi

          if [ -z "${MIRROR_ARCH}" ]; then
            F="$(fallback_arch "${TARGET_PATH}")"
            if [ -n "${F}" ]; then
              echo "::warning::镜像上取不到架构信息，使用内置兜底表: ${TARGET_PATH} → ${F}（请人工确认）"
              MIRROR_ARCH="${F}"; ARCH_SRC="内置兜底表"
            fi
          fi

          # ================================================================
          # 5) 失败 → 打完整诊断再退出
          # ================================================================
          if [ -z "${MIRROR_ARCH}" ]; then
            hdr "诊断：各 URL 的 HTTP 状态"
            echo "  [$(probe "${MIRROR_IMM}/releases/${IMM_VER}/targets/${TARGET_PATH}/profiles.json")]     immortalwrt profiles.json (release)"
            echo "  [$(probe "${MIRROR_IMM}/snapshots/targets/${TARGET_PATH}/profiles.json")]               immortalwrt profiles.json (snapshot)"
            echo "  [$(probe "${MIRROR_IMM}/releases/${IMM_VER}/targets/${TARGET_PATH}/config.buildinfo")] immortalwrt config.buildinfo (release)"
            echo "  [$(probe "${MIRROR_IMM}/snapshots/targets/${TARGET_PATH}/config.buildinfo")]           immortalwrt config.buildinfo (snapshot)"
            echo "  [$(probe "${MIRROR_IMM}/releases/${IMM_VER}/targets/${TARGET_PATH}/")]                  immortalwrt target 目录 (release)"
            echo "  [$(probe "${MIRROR_IMM}/snapshots/targets/${TARGET_PATH}/")]                            immortalwrt target 目录 (snapshot)"
            echo "  [$(probe "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${TARGET_PATH}/profiles.json")]     openwrt profiles.json (release)"
            echo "  [$(probe "${MIRROR_OWRT}/snapshots/targets/${TARGET_PATH}/profiles.json")]               openwrt profiles.json (snapshot)"
            echo "  [$(probe "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${TARGET_PATH}/")]                  openwrt target 目录 (release)"
            echo "  [$(probe "${MIRROR_OWRT}/snapshots/targets/${TARGET_PATH}/")]                            openwrt target 目录 (snapshot)"

            hdr "immortalwrt / targets/${GROUP}/ 下实际有哪些 subtarget（release）"
            list_dirs "${MIRROR_IMM}/releases/${IMM_VER}/targets/${GROUP}/" || echo "        <列不出来>"
            hdr "immortalwrt / targets/${GROUP}/ 下实际有哪些 subtarget（snapshot）"
            list_dirs "${MIRROR_IMM}/snapshots/targets/${GROUP}/" || echo "        <列不出来>"
            hdr "openwrt / targets/${GROUP}/ 下实际有哪些 subtarget（release）"
            list_dirs "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${GROUP}/" || echo "        <列不出来>"
            hdr "openwrt / targets/${GROUP}/ 下实际有哪些 subtarget（snapshot）"
            list_dirs "${MIRROR_OWRT}/snapshots/targets/${GROUP}/" || echo "        <列不出来>"

            die "无法推导 ARCH_PACKAGES。请用 arch_override 手动指定（如 aarch64_cortex-a53），并把映射补进 fallback_arch()"
          fi

          echo ">>> ARCH_PACKAGES = ${MIRROR_ARCH}   （来源: ${ARCH_SRC}）"

          # ================================================================
          # 6) 映射到仓库目录 + 拼 BASE（BASE 只依赖架构，不依赖 target 是否被支持）
          # ================================================================
          ARCH_DIR="$(repo_arch_dir "${MIRROR_ARCH}")"
          [ -n "${ARCH_DIR}" ] || die "未映射的架构 ${MIRROR_ARCH}：请补 repo_arch_dir()，并同步 fetch-openwrt-third-party.sh 的 exact_arch_dir()"

          DEST="${REPO_PREFIX:+${REPO_PREFIX}/}${ARCH_DIR}/${SUBDIR}"
          LUCI_BASE="${MIRROR_IMM}/releases/${IMM_VER}/packages/${MIRROR_ARCH}/luci"
          PKG_ROOT="${MIRROR_IMM}/releases/${IMM_VER}/packages/${MIRROR_ARCH}"

          hdr "结果（可直接粘贴到下包脚本）"
          {
            echo "# ---- 场景 A：抓 luci feed 的包（luci-app-* / luci-i18n-* / 主题）----"
            echo "MIRROR_ARCH=\"${MIRROR_ARCH}\""
            echo "DEST=\"${DEST}\""
            echo "BASE=\"${MIRROR_IMM}/releases/${IMM_VER}/packages/\${MIRROR_ARCH}/luci\""
            echo
            echo "# ---- 场景 B：抓 packages feed 的包（filebrowser 这类依赖）----"
            echo "ARCH=\"${MIRROR_ARCH}\""
            echo "BASE=\"${MIRROR_IMM}/releases/${IMM_VER}/packages/\${ARCH}\""
            echo
            echo "# 注意：两段的 BASE 同名，复制时一次只复制一段，别连着一起跑"
          } | tee /tmp/detect-result.txt

          hdr "展开后的实际值"
          echo "设备型号      : ${DEVICE}"
          echo "target 路径   : ${TARGET_PATH}（group=${GROUP}）"
          echo "source_type   : ${SOURCE_TYPE}"
          echo "ARCH_PACKAGES : ${MIRROR_ARCH}"
          echo "仓库目录名    : ${ARCH_DIR}"
          if [ -n "${REPO_PREFIX}" ]; then echo "仓库前缀      : ${REPO_PREFIX}"; fi
          echo "DEST          : ${DEST}"
          echo "BASE(luci)    : ${LUCI_BASE}"
          echo "BASE(架构根)  : ${PKG_ROOT}     ← 各 feed 子目录在这一层里面"
          echo "  -> luci feed     : ${PKG_ROOT}/luci"
          echo "  -> packages feed : ${PKG_ROOT}/packages   ← filebrowser 在这"
          if [ -n "${KEY_HIT}" ]; then
            echo "建议 mapping  : ${DEVICE}=targets/${TARGET_PATH}|${KEY_HIT}"
            echo "key 通道      : [${KEY_CHAN}]"
          fi
          echo ">>> 该架构根目录下实际存在的 feed 子目录："
          list_dirs "${PKG_ROOT}/" || echo "        <列不出来>"

          # ================================================================
          # 7) 探活 luci 目录 + 逐包核对
          # ================================================================
          if [ "${VERIFY}" = "true" ]; then
            hdr "探活 ${LUCI_BASE}/"
            CODE="$(probe "${LUCI_BASE}/")"
            if [ "${CODE}" = "200" ]; then
              echo "OK   [200] ${LUCI_BASE}/"
            else
              echo "FAIL [${CODE}] ${LUCI_BASE}/"
              hdr "immortalwrt 上实际存在的架构目录（release）"
              list_dirs "${MIRROR_IMM}/releases/${IMM_VER}/packages/" || echo "        <列不出来>"
              die "镜像上没有 ${MIRROR_ARCH} 的 luci 目录 —— 这批 apk 取不到，请核对架构名 / 版本号"
            fi

            if [ -f "${PKG_LIST}" ]; then
              hdr "逐个核对 ${PKG_LIST} 里的包"
              curl -fsSL --retry 3 --max-time 60 "${LUCI_BASE}/" -o /tmp/luci-index.html 2>/dev/null || true
              MISS=""
              while IFS= read -r p; do
                [ -n "${p}" ] || continue
                p="${p%%=*}"
                if grep -qE "${p}[-_][^\"/]*\.apk" /tmp/luci-index.html; then
                  echo "  有   ${p}"
                else
                  echo "  缺   ${p}"
                  MISS="${MISS} ${p}"
                fi
              done < <(grep -vE '^[[:space:]]*(#|$)' "${PKG_LIST}" | tr -d '\r' || true)
              [ -z "${MISS}" ] || die "镜像上缺少这些包:${MISS}"
              echo ">>> 清单里的包在该架构下齐全"
            else
              echo "::warning::找不到 ${PKG_LIST}，跳过逐包核对"
            fi
          else
            echo ">>> verify_mirror=false，跳过探活"
          fi

          # ================================================================
          # 8) Job Summary
          # ================================================================
          {
            echo "### 架构检测：\`${DEVICE}\`"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| target 路径 | \`${TARGET_PATH}\` |"
            echo "| source_type | \`${SOURCE_TYPE}\` |"
            echo "| ARCH_PACKAGES | \`${MIRROR_ARCH}\` |"
            echo "| 仓库目录 | \`${DEST}\` |"
            echo "| BASE (luci) | ${LUCI_BASE} |"
            echo "| BASE (架构根) | ${PKG_ROOT} |"
            echo "| ARCH 来源 | ${ARCH_SRC} |"
            echo "| key 通道 | \`${KEY_CHAN}\` |"
            echo "| 两源 key 数（含 snapshot） | immortalwrt ${N_IMM:-0} / openwrt ${N_OWRT:-0}（共有 ${N_BOTH:-0}） |"
            echo "| 仅一边有的 key | immortalwrt ${N_OI:-0} / openwrt ${N_OO:-0} |"
            echo ""
            if [ -n "${KEY_HIT}" ]; then
              echo "**建议写进 \`configs/device_mapping.conf\`：**"
              echo ""
              echo '```'
              echo "${DEVICE}=targets/${TARGET_PATH}|${KEY_HIT}"
              echo '```'
              echo ""
            fi
            if [ -s /tmp/keys-only-imm.txt ] || [ -s /tmp/keys-only-owrt.txt ]; then
              echo "<details><summary>只在一边存在的 key（点开）</summary>"
              echo ""
              echo '```'
              if [ -s /tmp/keys-only-imm.txt ]; then echo "[仅 immortalwrt]"; cat /tmp/keys-only-imm.txt; fi
              if [ -s /tmp/keys-only-owrt.txt ]; then echo "[仅 openwrt]";     cat /tmp/keys-only-owrt.txt; fi
              echo '```'
              echo "</details>"
              echo ""
            fi
            echo '```'
            cat /tmp/detect-result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo ">>> 检测完成"
