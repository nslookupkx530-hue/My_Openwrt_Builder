name: Detect Device Architecture

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备型号（configs/device_mapping.conf 里的键）"
        required: true
        default: "x86"
        type: string
      target_path:
        description: "直接指定 target 路径（如 qualcommax/ipq60xx）；留空则从 device_mapping.conf 查"
        required: false
        default: ""
        type: string
      arch_override:
        description: "强制指定架构（如 aarch64_cortex-a53）；留空则自动推导"
        required: false
        default: ""
        type: string
      profile_keyword:
        description: "【新】查 key 用的型号关键词（如 MT3600 / TR3000 / BE12PRO / AXT1800）；留空只做两源 key 数量对比"
        required: false
        default: ""
        type: string
      source_type:
        description: "要编译的源码类型（决定优先用哪个源的 profiles.json）"
        required: true
        default: "immortalwrt"
        type: choice
        options:
          - immortalwrt
          - openwrt
      immortalwrt_version:
        description: "immortalwrt 版本（第三方 apk 的来源，决定 BASE）"
        required: true
        default: "25.12.2"
        type: string
      openwrt_version:
        description: "openwrt 版本（交叉核对用）"
        required: false
        default: "25.12.5"
        type: string
      repo_prefix:
        description: "apk 仓库里架构目录之前的前缀，如 openwrt；没有就留空"
        required: false
        default: ""
        type: string
      verify_mirror:
        description: "是否探活镜像 luci 目录并逐个核对清单里的包"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  detect:
    name: Detect ${{ github.event.inputs.device }}
    runs-on: ubuntu-22.04

    env:
      MIRROR_IMM: https://mirror.nju.edu.cn/immortalwrt
      MIRROR_OWRT: https://mirror.nju.edu.cn/openwrt
      SUBDIR: luci-third-party-openwrt
      PKG_LIST: configs/third-party-openwrt.config

      IN_DEVICE: ${{ github.event.inputs.device }}
      IN_TARGET_PATH: ${{ github.event.inputs.target_path }}
      IN_ARCH_OVERRIDE: ${{ github.event.inputs.arch_override }}
      IN_PROFILE_KEYWORD: ${{ github.event.inputs.profile_keyword }}
      IN_SOURCE_TYPE: ${{ github.event.inputs.source_type }}
      IN_IMM_VER: ${{ github.event.inputs.immortalwrt_version }}
      IN_OWRT_VER: ${{ github.event.inputs.openwrt_version }}
      IN_REPO_PREFIX: ${{ github.event.inputs.repo_prefix }}
      IN_VERIFY: ${{ github.event.inputs.verify_mirror }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect architecture
        shell: bash
        run: |
          set -euo pipefail

          die() { echo "::error::$*" >&2; exit 1; }
          hdr() { echo; echo "======== $* ========"; }

          DEVICE="${IN_DEVICE:-x86}"
          TP_IN="${IN_TARGET_PATH:-}"
          ARCH_OVERRIDE="${IN_ARCH_OVERRIDE:-}"
          PROFILE_KEYWORD="${IN_PROFILE_KEYWORD:-}"
          SOURCE_TYPE="${IN_SOURCE_TYPE:-immortalwrt}"
          REPO_PREFIX="${IN_REPO_PREFIX:-}"
          REPO_PREFIX="${REPO_PREFIX#/}"; REPO_PREFIX="${REPO_PREFIX%/}"
          IMM_VER="${IN_IMM_VER:-25.12.2}"
          OWRT_VER="${IN_OWRT_VER:-25.12.5}"
          VERIFY="${IN_VERIFY:-true}"

          probe() {   # $1=url → 打印 http code
            curl -s -o /dev/null -w '%{http_code}' -L --retry 2 --connect-timeout 15 --max-time 45 "$1" 2>/dev/null || echo 000
          }
          # ---- 权威来源①：profiles.json 的 arch_packages 字段 ----
          arch_from_profiles() {   # $1=mirror $2=version
            curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 \
                 "${1}/releases/${2}/targets/${TARGET_PATH}/profiles.json" 2>/dev/null \
              | grep -oE '"arch_packages"[[:space:]]*:[[:space:]]*"[^"]+"' \
              | sed -E 's/.*:[[:space:]]*"([^"]+)"$/\1/' | head -n1
          }
          # ---- 来源②：config.buildinfo（精简文件，可能没有该符号） ----
          arch_from_buildinfo() {  # $1=mirror $2=version
            curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 \
                 "${1}/releases/${2}/targets/${TARGET_PATH}/config.buildinfo" 2>/dev/null \
              | sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' | head -n1
          }
          # ---- 来源③：内置兜底表（务必与 fetch-openwrt-third-party.sh 的 exact_arch_dir 保持一致） ----
          fallback_arch() {
            case "$1" in
              x86|"x86/64")         echo "x86_64" ;;
              qualcommax/ipq60xx)   echo "aarch64_cortex-a53" ;;
              qualcommax/ipq807x)   echo "aarch64_cortex-a53" ;;
              qualcommax/ipq50xx)   echo "aarch64_cortex-a53" ;;
              mediatek/filogic)     echo "aarch64_cortex-a53" ;;
              mediatek/mt7622)      echo "aarch64_cortex-a53" ;;
              mediatek/mt7623)      echo "aarch64_cortex-a53" ;;
              *)                    echo "" ;;
            esac
          }
          # ---- 架构名 → apk 仓库目录名（改这里必须同步 fetch-openwrt-third-party.sh） ----
          repo_arch_dir() {
            case "$1" in
              x86_64|x86_64_*)                          echo "x86_64" ;;
              aarch64_cortex-a53|aarch64_cortex-a53_*)   echo "arm64-a53" ;;
              aarch64*|arm64*)                          echo "arm64" ;;
              *)                                        echo "" ;;
            esac
          }
          list_dirs() {   # $1=url → 列出该页面的子目录名
            curl -fsSL --retry 2 --connect-timeout 15 --max-time 45 "$1" 2>/dev/null \
              | grep -oE 'href="[^"]+/"' | sed 's/href="//;s|/"||' \
              | grep -vE '^\.|^/' | sort -u | sed 's/^/        /'
          }
          # 【新】从 profiles.json 抽取 "key <TAB> 标题"
          fetch_keys() {   # $1=profiles.json URL  $2=输出 TSV
            curl -fsSL --retry 3 --connect-timeout 20 --max-time 60 "$1" 2>/dev/null \
              | python3 -c '
          import json,sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(1)
          prof = d.get("profiles") or {}
          for k in sorted(prof):
              v = prof.get(k) or {}
              ts = v.get("titles") or []
              t = (ts[0].get("title","") if ts else "")
              print("%s\t%s" % (k, t))
          ' > "$2" 2>/dev/null || true
          }
          # 【新】在 TSV 里按关键词（不分大小写、固定字符串）过滤
          hit_keys() {   # $1=TSV $2=关键词
            awk -F'\t' -v k="$2" 'BEGIN{k=toupper(k)} index(toupper($0),k)>0 {print $1}' "$1" | sort -u
          }

          # ================================================================
          # 1) 解析 target 路径
          # ================================================================
          TARGET_PATH="${TP_IN}"
          if [ -z "${TARGET_PATH}" ]; then
            MAP="configs/device_mapping.conf"
            [ -f "${MAP}" ] || die "找不到 ${MAP}"
            LINE="$(grep -E "^[[:space:]]*${DEVICE}=" "${MAP}" | head -n1 || true)"
            if [ -n "${LINE}" ]; then
              TARGET_PATH="${LINE#*=}"; TARGET_PATH="${TARGET_PATH%%|*}"
              TARGET_PATH="$(printf '%s' "${TARGET_PATH}" | tr -d '[:space:]')"
              TARGET_PATH="${TARGET_PATH%/}"; TARGET_PATH="${TARGET_PATH#targets/}"
              echo ">>> 从 ${MAP} 解析: ${DEVICE} → ${TARGET_PATH}"
            else
              echo ">>> ${MAP} 里没有 '${DEVICE}'，可用键:"
              grep -oE '^[[:space:]]*[^#=[:space:]]+' "${MAP}" | tr -d '[:space:]' | sort -u | sed 's/^/        /' || true
              die "无法定位 ${DEVICE} 的 target 路径；请用 target_path 输入直接指定"
            fi
          else
            echo ">>> 使用输入指定的 target 路径: ${TARGET_PATH}"
          fi
          TARGET_PATH="${TARGET_PATH#targets/}"; TARGET_PATH="${TARGET_PATH%/}"
          [ -n "${TARGET_PATH}" ] || die "target 路径为空"
          GROUP="${TARGET_PATH%%/*}"

          # ================================================================
          # 2) 【新】两源 profile key 交叉核对
          #    答两个问题：① 同一台设备的 key 在两源里一样吗？
          #                ② 某台设备应该填什么 key
          # ================================================================
          hdr "两源 profile key 交叉核对：${TARGET_PATH}"
          N_IMM=0; N_OWRT=0; N_BOTH=0; N_OI=0; N_OO=0
          KEY_HIT=""
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::warning::runner 上没有 python3，跳过 key 交叉核对"
          else
            fetch_keys "${MIRROR_IMM}/releases/${IMM_VER}/targets/${TARGET_PATH}/profiles.json"    /tmp/keys-imm.tsv
            fetch_keys "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${TARGET_PATH}/profiles.json"  /tmp/keys-owrt.tsv
            cut -f1 /tmp/keys-imm.tsv  | sort -u > /tmp/keys-imm.txt
            cut -f1 /tmp/keys-owrt.tsv | sort -u > /tmp/keys-owrt.txt

            N_IMM="$(wc -l < /tmp/keys-imm.txt)"
            N_OWRT="$(wc -l < /tmp/keys-owrt.txt)"
            comm -12 /tmp/keys-imm.txt /tmp/keys-owrt.txt  > /tmp/keys-both.txt
            comm -23 /tmp/keys-imm.txt /tmp/keys-owrt.txt  > /tmp/keys-only-imm.txt
            comm -13 /tmp/keys-imm.txt /tmp/keys-owrt.txt  > /tmp/keys-only-owrt.txt
            N_BOTH="$(wc -l < /tmp/keys-both.txt)"
            N_OI="$(wc -l < /tmp/keys-only-imm.txt)"
            N_OO="$(wc -l < /tmp/keys-only-owrt.txt)"

            if [ "${N_IMM}" = "0" ] && [ "${N_OWRT}" = "0" ]; then
              echo "::warning::两源的 profiles.json 都取不到（target=${TARGET_PATH}），跳过 key 核对"
            else
              echo "  immortalwrt ${IMM_VER} : ${N_IMM} 个 key"
              echo "  openwrt     ${OWRT_VER} : ${N_OWRT} 个 key"
              echo "  两边都有               : ${N_BOTH} 个   ← 这些 key 可以两源共用"
              echo "  仅 immortalwrt         : ${N_OI} 个"
              echo "  仅 openwrt             : ${N_OO} 个"
              if [ "${N_OI}" -gt 0 ]; then
                echo ">>> 只在 immortalwrt 存在的 key："
                head -n 40 /tmp/keys-only-imm.txt | sed 's/^/    /'
                [ "${N_OI}" -le 40 ] || echo "    ...（共 ${N_OI} 个，上面只列 40 个）"
              fi
              if [ "${N_OO}" -gt 0 ]; then
                echo ">>> 只在 openwrt 存在的 key："
                head -n 40 /tmp/keys-only-owrt.txt | sed 's/^/    /'
                [ "${N_OO}" -le 40 ] || echo "    ...（共 ${N_OO} 个，上面只列 40 个）"
              fi
            fi

            # ---- 关键词过滤：给某台设备找 key ----
            if [ -n "${PROFILE_KEYWORD}" ]; then
              hdr "关键词 '${PROFILE_KEYWORD}' 的命中"
              echo "  ---- immortalwrt ${IMM_VER} ----"
              awk -F'\t' -v k="${PROFILE_KEYWORD}" 'BEGIN{k=toupper(k)} index(toupper($0),k)>0 {printf "    %-44s %s\n",$1,$2}' /tmp/keys-imm.tsv || true
              echo "  ---- openwrt ${OWRT_VER} ----"
              awk -F'\t' -v k="${PROFILE_KEYWORD}" 'BEGIN{k=toupper(k)} index(toupper($0),k)>0 {printf "    %-44s %s\n",$1,$2}' /tmp/keys-owrt.tsv || true

              HIT_IMM="$(hit_keys /tmp/keys-imm.tsv  "${PROFILE_KEYWORD}")"
              HIT_OWRT="$(hit_keys /tmp/keys-owrt.tsv "${PROFILE_KEYWORD}")"
              C_IMM="$(printf '%s\n' "${HIT_IMM}"  | grep -c . || true)"
              C_OWRT="$(printf '%s\n' "${HIT_OWRT}" | grep -c . || true)"
              echo "  >>> 命中数：immortalwrt=${C_IMM}  openwrt=${C_OWRT}"

              if [ "${C_IMM}" = "1" ] && [ "${C_OWRT}" = "1" ] && [ "${HIT_IMM}" = "${HIT_OWRT}" ]; then
                echo "  >>> 两源一致 ✅ 可以共用同一个 key"
                KEY_HIT="${HIT_IMM}"
              elif [ "${C_IMM}" = "1" ] && [ "${C_OWRT}" = "0" ]; then
                echo "::warning::该 key 只在 immortalwrt 有 → 这台只能用 immortalwrt 源编"
                KEY_HIT="${HIT_IMM}"
              elif [ "${C_IMM}" = "0" ] && [ "${C_OWRT}" = "1" ]; then
                echo "::warning::该 key 只在 openwrt 有 → 这台只能用 openwrt 源编"
                KEY_HIT="${HIT_OWRT}"
              elif [ "${C_IMM}" -eq 0 ] && [ "${C_OWRT}" -eq 0 ]; then
                echo "::warning::两源都没命中 → 换关键词（用型号里的数字串），或该版本还没支持这台设备"
              else
                echo "::warning::命中多个，请换更精确的关键词（用型号里的数字串，如 MT3600 而不是 GL-）"
              fi
            else
              echo ">>> 未指定 profile_keyword：想查某台设备该填什么 key，重跑时填关键词（MT3600 / TR3000 / BE12PRO / AXT1800）"
            fi
          fi

          # ================================================================
          # 3) 查询架构（两源四种来源全查一遍）
          # ================================================================
          hdr "查询 ${TARGET_PATH} 的架构"
          A_IMM_P="$(arch_from_profiles   "${MIRROR_IMM}"  "${IMM_VER}"  || true)"
          A_IMM_B="$(arch_from_buildinfo  "${MIRROR_IMM}"  "${IMM_VER}"  || true)"
          A_OW_P="$(arch_from_profiles    "${MIRROR_OWRT}" "${OWRT_VER}" || true)"
          A_OW_B="$(arch_from_buildinfo   "${MIRROR_OWRT}" "${OWRT_VER}" || true)"
          echo "  immortalwrt ${IMM_VER} : profiles.json=${A_IMM_P:-<无>}   config.buildinfo=${A_IMM_B:-<无>}"
          echo "  openwrt     ${OWRT_VER} : profiles.json=${A_OW_P:-<无>}   config.buildinfo=${A_OW_B:-<无>}"

          IMM_ARCH="${A_IMM_P:-${A_IMM_B}}"
          OWRT_ARCH="${A_OW_P:-${A_OW_B}}"

          if [ -n "${IMM_ARCH}" ] && [ -n "${OWRT_ARCH}" ] && [ "${IMM_ARCH}" != "${OWRT_ARCH}" ]; then
            echo "::warning::两源架构不一致：immortalwrt=${IMM_ARCH}  openwrt=${OWRT_ARCH}（BASE 以 immortalwrt 侧为准）"
          fi

          # ================================================================
          # 4) 定最终架构：覆盖 > profiles > buildinfo > 兜底表
          # ================================================================
          MIRROR_ARCH=""; ARCH_SRC=""
          if [ -n "${ARCH_OVERRIDE}" ]; then
            MIRROR_ARCH="${ARCH_OVERRIDE}"; ARCH_SRC="输入指定(arch_override)"
          elif [ "${SOURCE_TYPE}" = "immortalwrt" ]; then
            if [ -n "${IMM_ARCH}" ]; then MIRROR_ARCH="${IMM_ARCH}"; ARCH_SRC="immortalwrt profiles/buildinfo"
            elif [ -n "${OWRT_ARCH}" ]; then
              echo "::warning::immortalwrt ${IMM_VER} 上没有 ${TARGET_PATH}（该源不支持此设备）；改用 openwrt 侧的架构"
              MIRROR_ARCH="${OWRT_ARCH}"; ARCH_SRC="openwrt profiles/buildinfo（回退）"
            fi
          else
            if [ -n "${OWRT_ARCH}" ]; then MIRROR_ARCH="${OWRT_ARCH}"; ARCH_SRC="openwrt profiles/buildinfo"
            elif [ -n "${IMM_ARCH}" ]; then MIRROR_ARCH="${IMM_ARCH}"; ARCH_SRC="immortalwrt profiles/buildinfo（回退）"
            fi
          fi

          if [ -z "${MIRROR_ARCH}" ]; then
            F="$(fallback_arch "${TARGET_PATH}")"
            if [ -n "${F}" ]; then
              echo "::warning::镜像上取不到架构信息，使用内置兜底表: ${TARGET_PATH} → ${F}（请人工确认）"
              MIRROR_ARCH="${F}"; ARCH_SRC="内置兜底表"
            fi
          fi

          # ================================================================
          # 5) 失败 → 打完整诊断再退出
          # ================================================================
          if [ -z "${MIRROR_ARCH}" ]; then
            hdr "诊断：各 URL 的 HTTP 状态"
            echo "  [$(probe "${MIRROR_IMM}/releases/${IMM_VER}/targets/${TARGET_PATH}/profiles.json")]     immortalwrt profiles.json"
            echo "  [$(probe "${MIRROR_IMM}/releases/${IMM_VER}/targets/${TARGET_PATH}/config.buildinfo")] immortalwrt config.buildinfo"
            echo "  [$(probe "${MIRROR_IMM}/releases/${IMM_VER}/targets/${TARGET_PATH}/")]                  immortalwrt target 目录"
            echo "  [$(probe "${MIRROR_IMM}/releases/${IMM_VER}/targets/${GROUP}/")]                        immortalwrt group 目录"
            echo "  [$(probe "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${TARGET_PATH}/profiles.json")]     openwrt profiles.json"
            echo "  [$(probe "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${TARGET_PATH}/")]                  openwrt target 目录"
            echo "  [$(probe "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${GROUP}/")]                        openwrt group 目录"

            hdr "immortalwrt ${IMM_VER} / targets/${GROUP}/ 下实际有哪些 subtarget"
            list_dirs "${MIRROR_IMM}/releases/${IMM_VER}/targets/${GROUP}/" || echo "        <列不出来>"
            hdr "openwrt ${OWRT_VER} / targets/${GROUP}/ 下实际有哪些 subtarget"
            list_dirs "${MIRROR_OWRT}/releases/${OWRT_VER}/targets/${GROUP}/" || echo "        <列不出来>"

            die "无法推导 ARCH_PACKAGES。请用 arch_override 手动指定（如 aarch64_cortex-a53），并把映射补进 fallback_arch()"
          fi

          echo ">>> ARCH_PACKAGES = ${MIRROR_ARCH}   （来源: ${ARCH_SRC}）"

          # ================================================================
          # 6) 映射到仓库目录 + 拼 BASE
          # ================================================================
          ARCH_DIR="$(repo_arch_dir "${MIRROR_ARCH}")"
          [ -n "${ARCH_DIR}" ] || die "未映射的架构 ${MIRROR_ARCH}：请补 repo_arch_dir()，并同步 fetch-openwrt-third-party.sh 的 exact_arch_dir()"

          DEST="${REPO_PREFIX:+${REPO_PREFIX}/}${ARCH_DIR}/${SUBDIR}"
          LUCI_BASE="${MIRROR_IMM}/releases/${IMM_VER}/packages/${MIRROR_ARCH}/luci"
          PKG_ROOT="${MIRROR_IMM}/releases/${IMM_VER}/packages/${MIRROR_ARCH}"

          hdr "结果（可直接粘贴到下包脚本）"
          {
            echo "# ---- 场景 A：抓 luci feed 的包（luci-app-* / luci-i18n-* / 主题）----"
            echo "MIRROR_ARCH=\"${MIRROR_ARCH}\""
            echo "DEST=\"${DEST}\""
            echo "BASE=\"${MIRROR_IMM}/releases/${IMM_VER}/packages/\${MIRROR_ARCH}/luci\""
            echo
            echo "# ---- 场景 B：抓 packages feed 的包（filebrowser 这类依赖）----"
            echo "ARCH=\"${MIRROR_ARCH}\""
            echo "BASE=\"${MIRROR_IMM}/releases/${IMM_VER}/packages/\${ARCH}\""
            echo
            echo "# 注意：两段的 BASE 同名，复制时一次只复制一段，别连着一起跑"
          } | tee /tmp/detect-result.txt

          hdr "展开后的实际值"
          echo "设备型号      : ${DEVICE}"
          echo "target 路径   : ${TARGET_PATH}（group=${GROUP}）"
          echo "source_type   : ${SOURCE_TYPE}"
          echo "ARCH_PACKAGES : ${MIRROR_ARCH}"
          echo "仓库目录名    : ${ARCH_DIR}"
          [ -n "${REPO_PREFIX}" ] && echo "仓库前缀      : ${REPO_PREFIX}"
          echo "DEST          : ${DEST}"
          echo "BASE(luci)    : ${LUCI_BASE}"
          echo "BASE(packages): ${PKG_ROOT}"
          [ -n "${KEY_HIT}" ] && echo "建议 mapping  : ${DEVICE}=targets/${TARGET_PATH}|${KEY_HIT}"

          # ================================================================
          # 7) 探活 luci 目录 + 逐包核对
          # ================================================================
          if [ "${VERIFY}" = "true" ]; then
            hdr "探活 ${LUCI_BASE}/"
            CODE="$(probe "${LUCI_BASE}/")"
            if [ "${CODE}" = "200" ]; then
              echo "OK   [200] ${LUCI_BASE}/"
            else
              echo "FAIL [${CODE}] ${LUCI_BASE}/"
              hdr "immortalwrt ${IMM_VER} 上实际存在的架构目录"
              list_dirs "${MIRROR_IMM}/releases/${IMM_VER}/packages/" || echo "        <列不出来>"
              die "镜像上没有 ${MIRROR_ARCH} 的 luci 目录 —— 这批 apk 取不到，请核对架构名 / 版本号"
            fi

            if [ -f "${PKG_LIST}" ]; then
              hdr "逐个核对 ${PKG_LIST} 里的包"
              curl -fsSL --retry 3 --max-time 60 "${LUCI_BASE}/" -o /tmp/luci-index.html 2>/dev/null || true
              MISS=""
              while IFS= read -r p; do
                [ -n "${p}" ] || continue
                p="${p%%=*}"
                if grep -qE "${p}[-_][^\"/]*\.apk" /tmp/luci-index.html; then
                  echo "  有   ${p}"
                else
                  echo "  缺   ${p}"
                  MISS="${MISS} ${p}"
                fi
              done < <(grep -vE '^[[:space:]]*(#|$)' "${PKG_LIST}" | tr -d '\r' || true)
              [ -z "${MISS}" ] || die "镜像上缺少这些包:${MISS}"
              echo ">>> 清单里的包在该架构下齐全"
            else
              echo "::warning::找不到 ${PKG_LIST}，跳过逐包核对"
            fi
          else
            echo ">>> verify_mirror=false，跳过探活"
          fi

          # ================================================================
          # 8) Job Summary
          # ================================================================
          {
            echo "### 架构检测：\`${DEVICE}\`"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| target 路径 | \`${TARGET_PATH}\` |"
            echo "| source_type | \`${SOURCE_TYPE}\` |"
            echo "| ARCH_PACKAGES | \`${MIRROR_ARCH}\` |"
            echo "| 仓库目录 | \`${DEST}\` |"
            echo "| BASE (luci) | ${LUCI_BASE} |"
            echo "| BASE (packages) | ${PKG_ROOT} |"
            echo "| ARCH 来源 | ${ARCH_SRC} |"
            echo "| 两源 key 数 | immortalwrt ${N_IMM} / openwrt ${N_OWRT}（共有 ${N_BOTH}） |"
            echo "| 仅一边有的 key | immortalwrt ${N_OI} / openwrt ${N_OO} |"
            echo ""
            if [ -n "${KEY_HIT}" ]; then
              echo "**建议写进 \`configs/device_mapping.conf\`：**"
              echo ""
              echo '```'
              echo "${DEVICE}=targets/${TARGET_PATH}|${KEY_HIT}"
              echo '```'
              echo ""
            fi
            if [ "${N_OI:-0}" -gt 0 ] || [ "${N_OO:-0}" -gt 0 ]; then
              echo "<details><summary>只在一边存在的 key（点开）</summary>"
              echo ""
              echo '```'
              [ "${N_OI:-0}" -gt 0 ] && { echo "[仅 immortalwrt]"; cat /tmp/keys-only-imm.txt; }
              [ "${N_OO:-0}" -gt 0 ] && { echo "[仅 openwrt]"; cat /tmp/keys-only-owrt.txt; }
              echo '```'
              echo "</details>"
              echo ""
            fi
            echo '```'
            cat /tmp/detect-result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo
          echo ">>> 检测完成"
