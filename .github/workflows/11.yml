name: Scan m0eak leftovers / probe MT5000 source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================================================
  # 1) 仓库内残留扫描
  # ==========================================================================
  scan-repo:
    name: 扫描 m0eak 残留
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: grep 关键字
        shell: bash
        run: |
          set -uo pipefail
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          OUT=/tmp/scan.txt
          : > "$OUT"
          for p in m0eak m0eakpatch fanchmwrt 99-docker-firewall; do
            echo "===== 关键字: $p =====" >> "$OUT"
            grep -rnI --exclude-dir=.git --exclude=scan-m0eak.yml "$p" \
              configs Third-Party shell files .github/workflows >> "$OUT" 2>&1 \
              || echo "  (无匹配)" >> "$OUT"
            echo "" >> "$OUT"
          done
          {
            echo "### m0eak / 老文件 残留扫描"
            echo ""
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$SUM"
          echo "--- 扫描结果 ---"
          cat "$OUT"

      - name: 打印 GL-MT5000 映射与种子
        shell: bash
        run: |
          set -uo pipefail
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          MAP=configs/DSF/device_mapping.conf
          LINE="$(grep -E '^GL-MT5000=' "${MAP}" || true)"
          SEED="$(printf '%s' "${LINE#*=}" | cut -d'|' -f3 | xargs)"
          {
            echo "### GL-MT5000 映射"
            echo ""
            echo '```'
            echo "mapping: ${LINE:-<没找到 GL-MT5000 这一行>}"
            echo "seed   : ${SEED:-<空>}"
            if [ -n "${SEED}" ] && [ -f "${SEED}" ]; then
              echo "seed   : 存在（$(wc -l < "${SEED}") 行）"
            else
              echo "seed   : !! 不存在"
            fi
            echo '```'
          } >> "$SUM"

  # ==========================================================================
  # 2) 新树探测（GitHub API + raw，不 clone）
  # ==========================================================================
  probe-new-tree:
    name: 探测 GLiNet-Tech/openwrt@mt5000
    runs-on: ubuntu-22.04
    steps:
      - name: 分支 / 老仓库可达性
        shell: bash
        run: |
          set -uo pipefail
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          NEW=https://github.com/GLiNet-Tech/openwrt
          code() { curl -s -o /dev/null -L -w '%{http_code}' --max-time 30 "$1" || echo 000; }
          BR="$(git ls-remote --heads "${NEW}.git" mt5000 | head -n1 || true)"
          {
            echo "### 仓库可达性"
            echo ""
            echo "| 项 | 结果 |"
            echo "|---|---|"
            echo "| ${NEW} | HTTP $(code "$NEW") |"
            echo "| 分支 mt5000 | ${BR:-**未找到**} |"
            echo "| https://github.com/m0eak/fanchmwrt | HTTP $(code https://github.com/m0eak/fanchmwrt) |"
            echo "| https://github.com/m0eak/openwrt_patch | HTTP $(code https://github.com/m0eak/openwrt_patch) |"
          } >> "$SUM"

      - name: 新树关键事实
        shell: bash
        run: |
          set -uo pipefail
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          REF=mt5000
          RAW="https://raw.githubusercontent.com/GLiNet-Tech/openwrt/${REF}"
          API="https://api.github.com/repos/GLiNet-Tech/openwrt/contents"
          {
            echo "### 新树关键事实"
            echo ""
            echo "#### package/system 下有什么（apk / opkg）"
            echo '```'
            curl -s --max-time 30 "${API}/package/system?ref=${REF}" | jq -r '.[].name' | sort || echo '(取不到)'
            echo '```'
            echo ""
            echo "#### USE_APK 默认值"
            echo '```'
            curl -s --max-time 30 "${RAW}/config/Config-build.in" | grep -A4 'config USE_APK' || echo '(取不到)'
            echo '```'
            echo ""
            echo "#### 内核版本"
            echo '```'
            curl -s --max-time 30 "${RAW}/target/linux/mediatek/Makefile" | grep -E 'KERNEL_PATCHVER|SUBTARGETS' || echo '(取不到)'
            echo '```'
            echo ""
            echo "#### glinet_gl-mt5000 设备定义"
            echo '```'
            curl -s --max-time 30 "${RAW}/target/linux/mediatek/image/filogic.mk" | grep -A12 'Device/glinet_gl-mt5000' || echo '(取不到)'
            echo '```'
            echo ""
            echo "#### feeds.conf.default"
            echo '```'
            curl -s --max-time 30 "${RAW}/feeds.conf.default" || echo '(取不到)'
            echo '```'
            echo ""
            echo "#### config/mt5000.config 是否存在"
            echo '```'
            echo "HTTP $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${RAW}/config/mt5000.config")"
            echo '```'
          } >> "$SUM"
          echo ">>> 结果已写入 Step Summary"
