name: OpenWrt Build & Release

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: "源码类型"
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - openwrt
          - immortalwrt
      target_device:
        description: "目标设备"
        required: true
        default: 'x86'
        type: choice
        options:
          - x86
          - AXT-1800
          - GL-MT3600BE
          - Cudy-TR3000-256MB
          - Tenda-BE12PRO
      source_ref:
        description: "源码 ref / tag（留空 = 自动挑最新稳定版 tag）"
        required: false
        default: ""
        type: string
      version:
        description: "版本号（留空 = 自动探测最新稳定版；snapshot = 快照）"
        required: false
        default: ""
        type: string
      custom_packages:
        description: "额外第三方包（空格分隔，可选）"
        required: false
        default: ""
        type: string

permissions:
  contents: write        # 建 Release 必需，否则403

concurrency:
  group: build-${{ github.event.inputs.source_type }}-${{ github.event.inputs.target_device }}
  cancel-in-progress: false

env:
  WORKSPACE: ${{ github.workspace }}
  SOURCE_TYPE: ${{ github.event.inputs.source_type }}
  TARGET_DEVICE: ${{ github.event.inputs.target_device }}
  SOURCE_REF: ${{ github.event.inputs.source_ref }}
  INPUT_VERSION: ${{ github.event.inputs.version }}
  CUSTOM_PACKAGE_EXTRA: ${{ github.event.inputs.custom_packages }}

jobs:
  build:
    name: Build ${{ github.event.inputs.target_device }} (${{ github.event.inputs.source_type }})
    runs-on: ubuntu-22.04
    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Syntax check shell scripts
        shell: bash
        run: |
          set -euxo pipefail
          FAIL=0

          check() {                       # 不存在 = 本次构建用不到，直接跳过（不报噪音）
              [ -f "$1" ] || return 0
              if bash -n "$1" 2>/dev/null || sh -n "$1" 2>/dev/null; then
                  echo "OK   $1"
              else
                  echo "FAIL $1"
                  FAIL=1
              fi
          }

          # 1) 公共脚本
          for f in shell/*.sh; do check "$f"; done
          check "Third-Party/third-party.config"

          # 2) 本次设备专属（${TARGET_DEVICE} 来自 job env）
          for f in "files/${TARGET_DEVICE:-x86}/etc/uci-defaults/"*; do check "$f"; done

          # 3) 公共 overlay 里的首启脚本（在哪个路径就查哪个）
          check "files/etc/init.d/apk-install"
          check "files/etc/ithird-party/install_third_party_apk.sh"
          check "files/etc/third-party/install_third_party_apk.sh"

          # 4) 公共 overlay 的 uci-defaults（98-drop-kmods-repo 等）
          for f in files/etc/uci-defaults/*; do check "$f"; done

          [ "$FAIL" = "0" ] || { echo "存在语法错误，请先修复"; exit 1; }

      - name: Cache OpenWrt downloads (dl)
        uses: actions/cache@v4
        with:
          path: dl-cache
          key: dl-${{ github.event.inputs.source_type }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ github.event.inputs.source_type }}-

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang autoconf automake libtool bison flex gawk gettext git file swig \
            python3 python3-pip python3-mako rsync unzip wget curl zstd dos2unix texinfo \
            libncurses-dev zlib1g-dev libssl-dev libffi-dev libreadline-dev \
            libsqlite3-dev libcap-dev libgd-dev libjpeg-dev libpng-dev \
            libcurl4-gnutls-dev libxml2-dev libxslt-dev qemu-utils

      - name: Clone Source Repository
        shell: bash
        run: |
          set -euxo pipefail
          # ↓ 兜底：即使 env 里没定义也不会因 set -u 报错
          SOURCE_REF="${SOURCE_REF:-}"
          INPUT_VERSION="${INPUT_VERSION:-}"

          case "${SOURCE_TYPE}" in
            immortalwrt) SRC_URL="https://github.com/ImmortalWrt/immortalwrt.git"
                         SITE="https://downloads.immortalwrt.org" ;;
            openwrt)     SRC_URL="https://github.com/openwrt/openwrt.git"
                         SITE="https://downloads.openwrt.org" ;;
            *) echo "ERROR: unknown SOURCE_TYPE: ${SOURCE_TYPE}"; exit 1 ;;
          esac

          latest_stable() {
            curl -fsSL --retry 3 --connect-timeout 20 "${SITE}/releases/" \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -Vu | sed -n '$p' || true
          }
          release_in_series() {   # $1=24.10 → 取该系列里版本最高的
            curl -fsSL --retry 3 --connect-timeout 20 "${SITE}/releases/" \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -Vu \
              | grep -E "^$(printf '%s' "$1" | sed 's/[.]/\\./g')\." | sed -n '$p' || true
          }

          rm -rf src
          if [ -n "${SOURCE_REF}" ]; then
              MODE="指定 ref=${SOURCE_REF}"
              CANDIDATES="${SOURCE_REF}"
              case "${SOURCE_REF}" in
                openwrt-*) SERIES="$(printf '%s' "${SOURCE_REF}" | sed 's/^openwrt-//')"
                           VERSION="$(release_in_series "${SERIES}")" ;;
                *)         VERSION="$(printf '%s' "${SOURCE_REF}" | sed -E 's/^v//; s/-immortalwrt$//')" ;;
              esac
          elif [ -n "${INPUT_VERSION}" ]; then
              MODE="指定版本=${INPUT_VERSION}"
              VERSION="${INPUT_VERSION}"
              CANDIDATES="v${VERSION} openwrt-$(printf '%s' "${VERSION}" | cut -d. -f1,2)"
          else
              MODE="最新稳定版（tag 优先）"
              VERSION="$(latest_stable)"
              [ -n "${VERSION}" ] || { echo "ERROR: 无法识别最新稳定版本"; exit 1; }
              S="$(printf '%s' "${VERSION}" | cut -d. -f1,2)"
              CANDIDATES="v${VERSION} v${VERSION}-immortalwrt ${VERSION} openwrt-${S}"
          fi

          echo ">>> 模式: ${MODE}"
          echo ">>> 版本: ${VERSION:-<未知>}"
          echo ">>> 候选 ref: ${CANDIDATES}"

          OK=0
          for ref in ${CANDIDATES}; do
              echo ">>> 尝试 git clone --depth=1 -b ${ref}"
              if git clone --depth=1 -b "${ref}" "${SRC_URL}" src 2>/dev/null; then OK=1; break; fi
              rm -rf src
          done
          [ "${OK}" = "1" ] || {
              echo "ERROR: 候选 ref 全部克隆失败（${CANDIDATES}）"
              echo "       请用 workflow 的 source_ref 手动指定正确的分支或 tag"; exit 1; }

          git -C src log -1 --format='>>> 源码: %H  %cd  %s' --date=iso
          echo ">>> 当前分支: $(git -C src rev-parse --abbrev-ref HEAD)"
          echo ">>> git describe: $(git -C src describe --tags 2>/dev/null || echo '<无 tag>')"

          if [ -n "${VERSION}" ]; then
              echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
              echo ">>> 已导出 VERSION=${VERSION}（基线将用 releases/${VERSION}/ 的 buildinfo）"
          else
              echo "::warning::无法推导版本号，prepare_base_config 会自行取最新稳定版，可能与源码 ref 不配套"
          fi

      - name: Prepare dl cache link & clean build dirs
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          rm -rf staging_dir build_dir tmp dl
          mkdir -p "${GITHUB_WORKSPACE}/dl-cache"
          ln -sfn "${GITHUB_WORKSPACE}/dl-cache" dl
          ls -ld dl "${GITHUB_WORKSPACE}/dl-cache"

      - name: Update & Install feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          rm -rf ./feeds ./data/feeds-*.tmp ./package/feeds
          for i in 1 2 3; do
            ./scripts/feeds update -a && break || { echo "feeds update 失败，重试 ${i}/3"; sleep 5; }
          done
          ./scripts/feeds install -a
          # 清理已知会引发 WARNING 的冷门包（保留原有行为，可整段删掉）
          for p in package/feeds/luci/luci-app-bmx7 \
                   package/feeds/luci/luci-app-babeld \
                   package/feeds/luci/luci-app-librespeed \
                   package/feeds/packages/bmx7-dnsupdate \
                   package/feeds/packages/prometheus-node-exporter-lua \
                   package/boot/arm-trusted-firmware-microchipsw; do
            [ -e "$p" ] && rm -rf "$p"
          done
          ./scripts/feeds install -a

      - name: Prepare Base Configuration
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          bash ../shell/prepare_base_config.sh "${SOURCE_TYPE}" "${TARGET_DEVICE}"
          test -f .config || { echo "ERROR: .config 未生成"; exit 1; }

      - name: Modify APK/OPKG mirror
        # 按 SOURCE_TYPE 选镜像；并把仓库地址写进镜像（distfeeds.list 的来源）
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"

          SOURCE_TYPE="${SOURCE_TYPE:-immortalwrt}"
          VERSION="${VERSION:-}"

          # ===== 1) 按源区分镜像（唯一真源；下一步会做一致性断言）=====
          case "${SOURCE_TYPE}" in
            immortalwrt) MIRROR="https://mirror.nju.edu.cn/immortalwrt" ;;
            openwrt)     MIRROR="https://mirror.nju.edu.cn/openwrt" ;;
            *) echo "ERROR: 未知 SOURCE_TYPE: ${SOURCE_TYPE}"; exit 1 ;;
          esac
          echo ">>> source_type=${SOURCE_TYPE} version=${VERSION:-<auto>} mirror=${MIRROR}"

          # ===== 2) 推导 target 路径 / release 目录（本步与 Check 步共用）=====
          MAP="${WORKSPACE}/configs/device_mapping.conf"
          [ -f "${MAP}" ] || { echo "ERROR: 找不到 ${MAP}"; exit 1; }
          LINE="$(grep -E "^[[:space:]]*${TARGET_DEVICE}=" "${MAP}" | head -n1 || true)"
          [ -n "${LINE}" ] || { echo "ERROR: ${MAP} 里没有 ${TARGET_DEVICE}"; exit 1; }
          TARGET_PATH="${LINE#*=}"; TARGET_PATH="${TARGET_PATH%%|*}"
          TARGET_PATH="$(printf '%s' "${TARGET_PATH}" | tr -d '[:space:]')"
          TARGET_PATH="${TARGET_PATH%/}"
          case "${TARGET_PATH}" in
            ""|*/-) echo "ERROR: ${TARGET_DEVICE} 的 target 路径不合法: '${TARGET_PATH}'"; exit 1 ;;
          esac

          if [ -n "${VERSION}" ]; then REL_DIR="releases/${VERSION}"; else REL_DIR="snapshots"; fi
          RELEASE_BASE="${MIRROR}/${REL_DIR}/targets/${TARGET_PATH}"

          {
            echo "MIRROR=${MIRROR}"
            echo "TARGET_PATH=${TARGET_PATH}"
            echo "REL_DIR=${REL_DIR}"
            echo "RELEASE_BASE=${RELEASE_BASE}"
          } >> "$GITHUB_ENV"

          # ===== 3) CONFIG_VERSION_REPO 换主机、保留 releases 路径（两种源都试）=====
          #      immortalwrt 若没有该符号不算错误，其机制是第 4 步的 apk_mirror
          if grep -q '^CONFIG_VERSION_REPO=' .config; then
            OLD_LINE="$(grep -m1 '^CONFIG_VERSION_REPO=' .config)"
            OLD_PATH="$(printf '%s' "${OLD_LINE}" | sed -E 's#^CONFIG_VERSION_REPO="https?://[^/]+(/.*)"$#\1#')"
            case "${OLD_PATH}" in
              /*) : ;;
              *)  echo "::warning::无法从 ${OLD_LINE} 解析路径，改用 /${REL_DIR}"
                  OLD_PATH="/${REL_DIR}" ;;
            esac
            echo ">>> VERSION_REPO 原: ${OLD_LINE}"
            sed -i -E "s#^CONFIG_VERSION_REPO=.*#CONFIG_VERSION_REPO=\"${MIRROR}${OLD_PATH}\"#" .config
            echo ">>> VERSION_REPO 新: $(grep -m1 '^CONFIG_VERSION_REPO=' .config)"
            grep -qE "^CONFIG_VERSION_REPO=\"${MIRROR}" .config \
              || { echo "ERROR: CONFIG_VERSION_REPO 替换失败"; exit 1; }
          elif [ -f package/base-files/image-config.in ] && \
               grep -qE 'default "https?://downloads\.(openwrt|immortalwrt)\.org' package/base-files/image-config.in; then
            echo ">>> .config 无 CONFIG_VERSION_REPO，改 image-config.in 默认值兜底"
            sed -i -E "s#(default \")https?://downloads\.(openwrt|immortalwrt)\.org#\1${MIRROR}#" package/base-files/image-config.in
            grep -Fq "default \"${MIRROR}" package/base-files/image-config.in \
              || { echo "ERROR: image-config.in 兜底失败"; exit 1; }
          else
            echo "::warning::未找到 CONFIG_VERSION_REPO（.config / image-config.in），运行时由 apk_mirror 兜底"
          fi

          # ===== 4) immortalwrt：只改 apk_mirror 的"默认值"一行 =====
          if [ "${SOURCE_TYPE}" = "immortalwrt" ]; then
            F="package/emortal/default-settings/files/99-default-settings-chinese"
            [ -f "${F}" ] || { echo "ERROR: 找不到 ${F}"; exit 1; }

            echo ">>> 改前:"
            grep -nE 'apk_mirror=|s,https?://' "${F}" || true

            # 值部分必须是 http(s) 开头的"字面量"：
            #   ✔ 会匹配   apk_mirror="https://mirrors.vsean.net/openwrt"
            #   ✘ 不匹配   apk_mirror="$(uci -q get system.@imm_init[0].apk_mirror)"   ← 必须保持原样
            sed -i -E "s#^([[:space:]]*apk_mirror=)[\"']https?://[^\"']*[\"']#\1\"${MIRROR}\"#" "${F}"

            echo ">>> 改后:"
            grep -nE 'apk_mirror=|s,https?://' "${F}" || true

            # 三条断言：默认值已改 / uci 读取行完好 / distfeeds 的 sed 模式完好
            grep -qE "^[[:space:]]*apk_mirror=\"${MIRROR}\"$" "${F}" \
              || { echo "ERROR: apk_mirror 默认值未被替换"; exit 1; }
            grep -Fq 'apk_mirror="$(uci' "${F}" \
              || { echo "ERROR: uci 读取那一行被改坏了"; exit 1; }
            grep -Fq 's,https://downloads.immortalwrt.org,' "${F}" \
              || { echo "ERROR: distfeeds 的 sed 匹配模式被改坏了"; exit 1; }

            echo ">>> immortalwrt 镜像设置完成"
          fi

      - name: Check APK package mirror
        # 本地断言 + 远端真探活：所有 apk 源必须 200（一个源 404 → 整个 apk 事务失败）
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"

          # ---- 0) 与上一步一致性断言（防止两处 MIRROR 又写歪）----
          case "${SOURCE_TYPE}" in
            immortalwrt) EXPECT="https://mirror.nju.edu.cn/immortalwrt" ;;
            openwrt)     EXPECT="https://mirror.nju.edu.cn/openwrt" ;;
            *) echo "ERROR: 未知 SOURCE_TYPE: ${SOURCE_TYPE}"; exit 1 ;;
          esac
          MIRROR="${MIRROR:?MIRROR 未由 Modify APK/OPKG mirror 步骤导出}"
          [ "${MIRROR}" = "${EXPECT}" ] || {
            echo "ERROR: MIRROR(${MIRROR}) 与 SOURCE_TYPE=${SOURCE_TYPE} 期望值(${EXPECT}) 不一致"; exit 1; }
          REL_DIR="${REL_DIR:?}"; RELEASE_BASE="${RELEASE_BASE:?}"

          # ---- 1) 本地改写结果断言 ----
          if [ "${SOURCE_TYPE}" = "immortalwrt" ]; then
            F="package/emortal/default-settings/files/99-default-settings-chinese"
            echo ">>> ${F} 关键行:"
            grep -nE 'apk_mirror=|distfeeds' "${F}" || true
            grep -qE "^[[:space:]]*apk_mirror=\"${MIRROR}\"$" "${F}" \
              || { echo "ERROR: apk_mirror 默认值不是 ${MIRROR}"; exit 1; }
            grep -Fq 'apk_mirror="$(uci' "${F}" \
              || { echo "ERROR: uci 读取那一行被改坏了"; exit 1; }
            grep -Fq 's,https://downloads.immortalwrt.org,' "${F}" \
              || { echo "ERROR: distfeeds 的 sed 匹配模式被改坏了"; exit 1; }
          fi

          if grep -q '^CONFIG_VERSION_REPO=' .config; then
            echo ">>> CONFIG_VERSION_REPO: $(grep -m1 '^CONFIG_VERSION_REPO=' .config)"
            grep -qE "^CONFIG_VERSION_REPO=\"${MIRROR}" .config \
              || { echo "ERROR: CONFIG_VERSION_REPO 未指向镜像"; exit 1; }
          else
            echo "::warning::.config 无 CONFIG_VERSION_REPO（immortalwrt 常见），首启由 apk_mirror 兜底"
          fi

          echo ">>> 运行时源的生成位置（供排查）:"
          grep -nE 'FeedSourcesAppendAPK|repositories\.d' \
               package/base-files/Makefile package/system/apk/Makefile 2>/dev/null || true

          # ---- 2) 远端真探活 ----
          proberc=0
          probe() {
            url="$1"; label="$2"
            code="$(curl -s -o /dev/null -w '%{http_code}' -L --retry 3 --max-time 60 "${url}" || echo 000)"
            if [ "${code}" = "200" ]; then
              echo "OK   [${code}] ${label}: ${url}"
            else
              echo "FAIL [${code}] ${label}: ${url}"
              proberc=1
            fi
          }

          ARCH_PACKAGES="$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          echo ">>> CONFIG_TARGET_ARCH_PACKAGES=${ARCH_PACKAGES:-<none>}"

          probe "${RELEASE_BASE}/config.buildinfo"      "target 基线 buildinfo"
          probe "${RELEASE_BASE}/packages/packages.adb" "target 包索引"
          if [ -n "${ARCH_PACKAGES}" ]; then
            probe "${MIRROR}/${REL_DIR}/packages/${ARCH_PACKAGES}/packages.adb" \
                  "核心包索引 (${ARCH_PACKAGES})"
          fi

          KMODS_LIST="$(curl -fsSL --retry 3 --max-time 60 "${RELEASE_BASE}/kmods/" 2>/dev/null || true)"
          KMODS_DIR="$(printf '%s\n' "${KMODS_LIST}" \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9a-f]{32,}' | sort -u | tail -n1 || true)"
          if [ -n "${KMODS_DIR}" ]; then
            probe "${RELEASE_BASE}/kmods/${KMODS_DIR}/packages.adb" "kmods (${KMODS_DIR})"
            echo "KMODS_DIR=${KMODS_DIR}" >> "$GITHUB_ENV"
            echo ">>> 镜像内核 = ${KMODS_DIR%%-*}；设备 uname -r 应与此一致，否则 98-drop-kmods-repo 会删掉该源"
          else
            echo "::warning::未能从 ${RELEASE_BASE}/kmods/ 解析内核目录，跳过 kmods 探活"
          fi

          [ "${proberc}" = "0" ] || {
            echo "ERROR: 有源不可用 —— 一个 404 就会让整个 apk 安装事务失败"; exit 1; }
          echo ">>> 镜像检查通过"

      - name: Load Third-Party Config & Inject Plugins
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"

          echo "=== STEP 1: source Third-Party/third-party.config ==="
          CONFIG_PATH="${WORKSPACE}/Third-Party/third-party.config"
          [ -f "${CONFIG_PATH}" ] || { echo "ERROR: 找不到 ${CONFIG_PATH}"; exit 1; }
          source "${CONFIG_PATH}"
          CUSTOM_PACKAGE_EXTRA="${CUSTOM_PACKAGE_EXTRA:-}"
          CUSTOM_PACKAGES="$(printf '%s %s' "${CUSTOM_PACKAGES}" "${CUSTOM_PACKAGE_EXTRA}" | xargs)"
          echo "FINAL CUSTOM_PACKAGES: ${CUSTOM_PACKAGES:-<none>}"
          echo "CUSTOM_PACKAGES=${CUSTOM_PACKAGES}" >> "$GITHUB_ENV"

          echo "=== STEP 2: inject_plugins.sh ==="
          bash ../shell/inject_plugins.sh

          echo "=== STEP 3: trim_config.sh ==="
          bash ../shell/trim_config.sh

          echo "=== STEP 4: 汇总 ==="
          echo "Source Type: ${SOURCE_TYPE}"
          echo "Target Device: ${TARGET_DEVICE}"
          echo "FINAL CUSTOM_PACKAGES: ${CUSTOM_PACKAGES:-<none>}"

      - name: Apply custom files (common + device)
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_DIR="${WORKSPACE}/src"
          REPO_FILES_DIR="${WORKSPACE}/files"
          FIRMWARE_FILES_DIR="${SOURCE_DIR}/files"

          mkdir -p "${FIRMWARE_FILES_DIR}"

          if [ -d "${REPO_FILES_DIR}/etc" ]; then
            cp -af "${REPO_FILES_DIR}/etc" "${FIRMWARE_FILES_DIR}/"
            echo ">>> 已应用公共 overlay: files/etc"
          fi

          [ -d "${REPO_FILES_DIR}/${TARGET_DEVICE}" ] || {
            echo "ERROR: 找不到设备目录 files/${TARGET_DEVICE}"; exit 1; }
          cp -af "${REPO_FILES_DIR}/${TARGET_DEVICE}/." "${FIRMWARE_FILES_DIR}/"
          echo ">>> 已应用设备 overlay: files/${TARGET_DEVICE}"

          # 兼容旧目录名
          if [ -d "${FIRMWARE_FILES_DIR}/etc/ithird-party" ] && [ ! -d "${FIRMWARE_FILES_DIR}/etc/third-party" ]; then
            mv "${FIRMWARE_FILES_DIR}/etc/ithird-party" "${FIRMWARE_FILES_DIR}/etc/third-party"
            echo ">>> 已重命名 etc/ithird-party → etc/third-party"
          fi

          NET_CONF="${FIRMWARE_FILES_DIR}/etc/uci-defaults/99-custom-network"
          [ -f "${NET_CONF}" ] || {
            echo "ERROR: 缺少 ${NET_CONF}（应来自 files/${TARGET_DEVICE}/）"; exit 1; }
          chmod 755 "${FIRMWARE_FILES_DIR}/etc/uci-defaults/"* 2>/dev/null || true
          [ -f "${FIRMWARE_FILES_DIR}/etc/init.d/apk-install" ] && \
            chmod 755 "${FIRMWARE_FILES_DIR}/etc/init.d/apk-install" || true
          [ -d "${FIRMWARE_FILES_DIR}/etc/third-party" ] && \
            chmod 755 "${FIRMWARE_FILES_DIR}/etc/third-party/"* || true

          echo ">>> 网络配置预览:"
          cat "${NET_CONF}"
          echo ">>> overlay 结构:"
          find "${FIRMWARE_FILES_DIR}" -maxdepth 3 | sort

      - name: Prepare Third-Party APKs
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          bash ../shell/apk-prepare-packages.sh

      - name: Install Third-Party APKs into image
        shell: bash
        run: |
          set -euxo pipefail
          OPENWRT_DIR="${WORKSPACE}/src"
          FIRMWARE_FILES_DIR="${OPENWRT_DIR}/files"
          REPO_FILES_DIR="${WORKSPACE}/files"
          APK_SOURCE_DIR="${OPENWRT_DIR}/packages"

          mkdir -p "${FIRMWARE_FILES_DIR}/usr/share/third-party" \
                   "${FIRMWARE_FILES_DIR}/etc/third-party" \
                   "${FIRMWARE_FILES_DIR}/etc/init.d" \
                   "${FIRMWARE_FILES_DIR}/etc/rc.d"

          # ---- 1) 拷入第三方 apk ----
          APK_COUNT="$(find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          [ "${APK_COUNT}" -gt 0 ] || { echo "ERROR: ${APK_SOURCE_DIR} 里没有 apk"; exit 1; }
          find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' \
            -exec cp -f {} "${FIRMWARE_FILES_DIR}/usr/share/third-party/" \;
          echo ">>> 已拷入 ${APK_COUNT} 个第三方 apk"

          # ---- 2) 兼容旧目录名 ithird-party（如果公共 overlay 已经拷过）----
          if [ -d "${FIRMWARE_FILES_DIR}/etc/ithird-party" ]; then
            cp -af "${FIRMWARE_FILES_DIR}/etc/ithird-party/." "${FIRMWARE_FILES_DIR}/etc/third-party/"
            rm -rf "${FIRMWARE_FILES_DIR}/etc/ithird-party"
            echo ">>> etc/ithird-party → etc/third-party 已合并"
          fi

          # ---- 3) 兜底：脚本不在位就直接从仓库里找出来安装（不依赖上一步）----
          SRC_INIT="$(find "${REPO_FILES_DIR}" -type f -name 'apk-install' -print -quit 2>/dev/null || true)"
          SRC_INSTALLER="$(find "${REPO_FILES_DIR}" -type f -name 'install_third_party_apk.sh' -print -quit 2>/dev/null || true)"

          DST_INIT="${FIRMWARE_FILES_DIR}/etc/init.d/apk-install"
          DST_INSTALLER="${FIRMWARE_FILES_DIR}/etc/third-party/install_third_party_apk.sh"

          if [ ! -f "${DST_INIT}" ]; then
            [ -n "${SRC_INIT}" ] || { echo "ERROR: 在 ${REPO_FILES_DIR} 里找不到 apk-install"; exit 1; }
            install -m 0755 "${SRC_INIT}" "${DST_INIT}"
            echo ">>> 兜底安装 init: ${SRC_INIT} → ${DST_INIT}"
          fi
          if [ ! -f "${DST_INSTALLER}" ]; then
            [ -n "${SRC_INSTALLER}" ] || { echo "ERROR: 在 ${REPO_FILES_DIR} 里找不到 install_third_party_apk.sh"; exit 1; }
            install -m 0755 "${SRC_INSTALLER}" "${DST_INSTALLER}"
            echo ">>> 兜底安装 installer: ${SRC_INSTALLER} → ${DST_INSTALLER}"
          fi

          chmod 0755 "${DST_INIT}" "${DST_INSTALLER}"

          # ---- 4) 【关键】让首启服务真正被执行（rcS 只跑 /etc/rc.d/S*）----
          ln -sf ../init.d/apk-install "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"
          test -L "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"
          echo ">>> 首启服务已启用: /etc/rc.d/S99apk-install"

          # ---- 5) 结果自检 ----
          echo ">>> overlay 结构:"
          find "${FIRMWARE_FILES_DIR}" -maxdepth 4 | sort
          echo ">>> 待安装 apk:"
          find "${FIRMWARE_FILES_DIR}/usr/share/third-party" -maxdepth 1 -type f -name '*.apk' \
            -exec ls -lh {} \;
          echo ">>> init 服务链接:"
          ls -l "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"

      - name: Finalize Configuration (defconfig + 校验注入)
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          make defconfig

          echo ">>> CONFIG_VERSION_REPO: $(grep -m1 '^CONFIG_VERSION_REPO=' .config || echo '<无>')"
          echo ">>> ARCH_PACKAGES     : $(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"

          # 已启用包符号表（注意：只能用 [:blank:]，[:space:] 会把换行删掉导致符号粘连）
          awk '/^CONFIG_PACKAGE_[^=]*=y$/{sub(/=y$/,"");print}' .config \
            | tr -d '[:blank:]' | sort -u > tmp/enabled-symbols.txt
          echo ">>> 已启用 CONFIG_PACKAGE_* 数量: $(wc -l < tmp/enabled-symbols.txt)"

          # ---- 1) 注入的插件必须还在 ----
          MISSING_OPT=""
          if [ -s tmp/injected-plugins.txt ]; then
            while read -r opt; do
              [ -n "${opt}" ] || continue
              if grep -qxF "${opt}" tmp/enabled-symbols.txt; then
                echo "  OK   ${opt}"
              else
                echo "  MISS ${opt}"
                MISSING_OPT="${MISSING_OPT} ${opt}"
              fi
            done < tmp/injected-plugins.txt
          else
            echo "WARNING: 未找到 tmp/injected-plugins.txt"
          fi

          # ---- 2) 裁剪 / 强制项必须按要求落地 ----
          BAD_TRIM=""
          if [ -s tmp/trimmed-options.txt ]; then
            while read -r want sym; do
              [ -n "${sym:-}" ] || continue
              case "${want}" in
                ON)
                  if grep -qxF "${sym}" tmp/enabled-symbols.txt; then
                    echo "  OK   ${sym} 已启用"
                  else
                    echo "  FAIL ${sym} 未启用"
                    BAD_TRIM="${BAD_TRIM} ${sym}"
                  fi ;;
                OFF)
                  if grep -qxF "${sym}" tmp/enabled-symbols.txt; then
                    echo "  FAIL ${sym} 又被打开了"
                    BAD_TRIM="${BAD_TRIM} ${sym}"
                  else
                    echo "  OK   ${sym} 已关闭"
                  fi ;;
              esac
            done < tmp/trimmed-options.txt
          else
            echo "WARNING: 未找到 tmp/trimmed-options.txt"
          fi

          # ---- 3) ip 落点自查 ----
          echo ">>> ip 相关:"
          grep -E '^CONFIG_PACKAGE_ip-(full|tiny)=|^# CONFIG_PACKAGE_ip-(full|tiny) is not set' .config || true

          [ -z "${MISSING_OPT}" ] || {
            echo "ERROR: 以下插件没进固件，请核对 configs/plugins.cfg 里的包名:${MISSING_OPT}"; exit 1; }
          [ -z "${BAD_TRIM}" ] || {
            echo "ERROR: 以下裁剪项未生效（可能有别的包 select 了它）:${BAD_TRIM}"; exit 1; }
          echo ">>> 注入/裁剪校验通过"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"

          DATE_UTC="$(date -u +%F)"
          TAG="${TARGET_DEVICE}-${SOURCE_TYPE}-${DATE_UTC}-${{ github.run_id }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo ">>> tag=${TAG}"

          # ---------- 构建信息（作为 Release 附件，不放进正文）----------
          {
            echo "device      : ${TARGET_DEVICE}"
            echo "source_type : ${SOURCE_TYPE}"
            echo "version     : ${VERSION:-snapshot}"
            echo "src_branch  : $(git rev-parse --abbrev-ref HEAD)"
            echo "src_commit  : $(git rev-parse HEAD)"
            echo "src_date    : $(git log -1 --format=%cd --date=iso)"
            echo "build_time  : $(date -u '+%F %T UTC')"
            echo "run_id      : ${{ github.run_id }}"
            echo "mirror      : ${MIRROR:-<unknown>}"
            echo "kmods_dir   : ${KMODS_DIR:-<unknown>}"
            echo "config_md5  : $(md5sum .config | cut -d' ' -f1)"
          } > "${WORKSPACE}/BUILDINFO.txt"

          # ---------- Release 正文 ----------
          {
            echo "OpenWrt automated build release"
            echo
            echo "Device:"
            echo
            echo "${TARGET_DEVICE}"
            echo "${SOURCE_TYPE} ${VERSION:-snapshot}"
            echo
            echo "Run ID:"
            echo
            echo "${{ github.run_id }}"
            echo
            echo "LuCI package list"
            echo
            echo "${TARGET_DEVICE}"
            echo
            grep -E '^CONFIG_PACKAGE_luci[A-Za-z0-9._-]*=y$' .config \
              | sed -e 's/^CONFIG_PACKAGE_//' -e 's/=y$//' | sort | sed 's/^/- /' || true
            if [ -f tmp/injected-plugins.txt ]; then
              grep -v '^CONFIG_PACKAGE_luci' tmp/injected-plugins.txt \
                | sed 's/^CONFIG_PACKAGE_//' | sort | sed 's/^/- /' || true
            fi
            echo
            echo "Third-Party package list"
            echo
            printf '%s\n' "${CUSTOM_PACKAGES:-}" | tr ' ' '\n' | sed '/^$/d' | sort | sed 's/^/- /'
          } > "${WORKSPACE}/release-notes.md"

          echo ">>> release-notes.md 预览:"
          cat "${WORKSPACE}/release-notes.md"

      - name: Prepare build download
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          make download -j"$(nproc)" 2>&1 | tee build_download.log || {
            echo ">>> 并行下载失败，降级单线程重试一次"
            make download -j1 V=s 2>&1 | tee -a build_download.log
          }
          echo "=== 下载阶段 warning/error 汇总 ==="
          grep -Ei "error|warning" build_download.log || true

      - name: Build firmware
        shell: bash
        run: |
          set -uo pipefail
          cd "${WORKSPACE}/src"
          export MAKEFLAGS="-j$(nproc)"
          # 需要看完整编译细节时把下面的 make 换成 make V=s（日志会非常大）
          # 若 host 侧告警导致失败，可启用（OpenWrt 用的变量名是 HOST_CFLAGS）
          # export HOST_CFLAGS="-Wno-error"
          echo ">>> 开始编译 (CPU=$(nproc))"
          set +e
          make 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          echo "make exit code: ${BUILD_RC}"
          if [ "${BUILD_RC}" -ne 0 ]; then
            echo "========== FAILED PACKAGE =========="
            grep -E "ERROR: package/|failed to build" build.log | tail -30 || true
            echo "========== MAKE ERRORS =========="
            grep -E "make\[[0-9]+\]: \*\*\*" build.log | tail -50 || true
            echo "========== COMPILER FATAL =========="
            grep -E "fatal error:|error:" build.log | tail -50 || true
            echo "========== LAST 200 LINES =========="
            tail -200 build.log
            exit "${BUILD_RC}"
          fi
          echo ">>> 编译成功"

      - name: Verify Images
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          ls -lh bin/targets/*/*/ 2>/dev/null | sed -n '1,60p' || true
          IMG="$(find bin/targets -maxdepth 3 -type f \
                 \( -name '*.bin' -o -name '*.img.gz' -o -name '*.itb' -o -name '*.squashfs' \) \
                 -print -quit)"
          [ -n "${IMG}" ] || { echo "ERROR: bin/targets 下没有找到固件镜像"; exit 1; }
          echo ">>> 生成镜像示例: ${IMG}"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_device }}-logs-${{ github.run_id }}
          path: |
            src/build.log
            src/build_download.log
            src/.config
            src/tmp/injected-plugins.txt
            src/tmp/trimmed-options.txt
            src/tmp/enabled-symbols.txt
          if-no-files-found: ignore

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_device }}-${{ github.event.inputs.source_type }}-${{ github.run_id }}
          path: |
            src/bin/targets/*
            !src/bin/targets/**/packages/**
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}      # ← 形如 x86-immortalwrt-2026-09-23-35429357989
          name: ${{ steps.notes.outputs.tag }}          # 标题同一个（截图里标题=tag）
          body_path: release-notes.md                   # ← 正文用上面生成的文件
          files: |
            BUILDINFO.txt
            src/bin/targets/*/*/*.bin
            src/bin/targets/*/*/*.img.gz
            src/bin/targets/*/*/*.itb
            src/bin/targets/*/*/*.squashfs
            src/bin/targets/*/*/sha256sums
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
