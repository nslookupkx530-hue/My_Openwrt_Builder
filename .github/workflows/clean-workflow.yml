name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "删除早于多少天前的已完成运行（默认 7，最小 1，最大 90）"
        required: false
        default: "7"
      keep_latest:
        description: "每个 workflow 至少保留最近多少次运行（默认 20）"
        required: false
        default: "20"
      dry_run:
        description: "只列出不删除（true/false）"
        required: false
        default: "false"
  # 想自动跑就打开（例：每周日 20:00 UTC）
  # schedule:
  #   - cron: "0 20 * * 0"

concurrency:
  group: cleanup-old-runs
  cancel-in-progress: false

permissions:
  actions: write          # 删除 run / 日志 / artifact 必需

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 删除过期运行
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ github.event.inputs.keep_days }}
          KEEP_LATEST: ${{ github.event.inputs.keep_latest }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -uo pipefail
          KEEP_DAYS="${KEEP_DAYS:-7}"
          KEEP_LATEST="${KEEP_LATEST:-20}"
          DRY_RUN="${DRY_RUN:-false}"

          # ---- 参数守卫（删 run 不可逆，宁可不干也不能乱删）----
          case "${KEEP_DAYS}" in ''|*[!0-9]*) echo "keep_days 非法: ${KEEP_DAYS}"; exit 1 ;; esac
          [ "${KEEP_DAYS}" -ge 1 ]  || { echo "keep_days 必须 >= 1"; exit 1; }
          [ "${KEEP_DAYS}" -le 90 ] || { echo "keep_days 过大（<=90）"; exit 1; }
          case "${KEEP_LATEST}" in ''|*[!0-9]*) KEEP_LATEST=20 ;; esac

          THRESHOLD="$(date -u -d "${KEEP_DAYS} days ago" '+%Y-%m-%dT%H:%M:%SZ')"
          echo ">>> 阈值        : created_at < ${THRESHOLD}"
          echo ">>> 每个 workflow 至少保留最近 ${KEEP_LATEST} 次"
          echo ">>> dry_run     : ${DRY_RUN}"

          WORKLIST="$(mktemp)"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100" \
            --jq '.workflow_runs[]
                  | select(.status == "completed")
                  | select(.created_at < "'"${THRESHOLD}"'")
                  | [.workflow_id, .id, .created_at] | @tsv' \
            | sort -k1,1n -k3,3r \
            | awk -v keep="${KEEP_LATEST}" '{ n[$1]++; if (n[$1] > keep) print $2 }' \
            > "${WORKLIST}" || true

          COUNT="$(wc -l < "${WORKLIST}" | tr -d ' ')"
          echo ">>> 待删除运行数: ${COUNT}"
          if [ "${COUNT}" = "0" ]; then echo "✅ 没有需要清理的运行"; rm -f "${WORKLIST}"; exit 0; fi
          echo ">>> 前 20 条预览:"
          head -20 "${WORKLIST}" | sed 's/^/    run id: /'

          if [ "${DRY_RUN}" = "true" ]; then
            echo ">>> dry_run=true，未执行删除"; rm -f "${WORKLIST}"; exit 0
          fi

          DELETED=0; FAILED=0
          while read -r id; do
            [ -n "${id}" ] || continue
            ok=0
            for attempt in 1 2 3; do
              if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" >/dev/null 2>&1; then
                ok=1; break
              fi
              sleep $((attempt * 2))      # 撞限流就退避重试
            done
            if [ "${ok}" = "1" ]; then
              DELETED=$((DELETED + 1)); echo "🗑 已删除 ${id}"
            else
              FAILED=$((FAILED + 1));  echo "⚠️ 删除失败 ${id}（已重试 3 次）"
            fi
            sleep 0.3
          done < "${WORKLIST}"
          rm -f "${WORKLIST}"

          {
            echo "## 清理结果"
            echo "- 阈值: created_at < ${THRESHOLD}（保留 ${KEEP_DAYS} 天）"
            echo "- 每个 workflow 至少保留最近 ${KEEP_LATEST} 次"
            echo "- 成功删除: ${DELETED}"
            echo "- 失败: ${FAILED}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "🎉 清理完成（删除 ${DELETED}，失败 ${FAILED}）"
