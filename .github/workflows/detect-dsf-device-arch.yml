name: Detect Device Arch (DSF 第三方源)
run-name: "Detect Device Arch (DSF 第三方源): ${{ inputs.device }}"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "要检测的设备"
        required: true
        default: all
        type: choice
        options: [all, GL-MT5000, JDC-AX6600]

permissions:
  contents: read

jobs:
  # ======================================================================
  # 从 configs/DSF/device_mapping.conf 生成矩阵
  #   格式: 设备名=源URL|分支或tag|种子配置|target路径[|profile]
  # ======================================================================
  discover:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          MAP=configs/DSF/device_mapping.conf
          SEL='${{ github.event.inputs.device }}'
          [ -f "${MAP}" ] || { echo "ERROR: 找不到 ${MAP}"; exit 1; }

          ITEMS=""
          while IFS= read -r line; do
            line="$(printf '%s' "${line}" | tr -d '\r')"
            case "${line}" in ''|'#'*) continue ;; esac
            name="$(printf '%s' "${line%%=*}" | xargs)"
            val="$(printf '%s' "${line#*=}"  | xargs)"
            [ -n "${name}" ] || continue
            if [ "${SEL}" != "all" ] && [ "${name}" != "${SEL}" ]; then continue; fi

            repo="$(printf '%s'    "${val}" | cut -d'|' -f1 | xargs)"
            branch="$(printf '%s'  "${val}" | cut -d'|' -f2 | xargs)"
            seed="$(printf '%s'    "${val}" | cut -d'|' -f3 | xargs)"
            target="$(printf '%s'  "${val}" | cut -d'|' -f4 | xargs)"
            profile="$(printf '%s' "${val}" | cut -d'|' -f5 | xargs)"

            if [ -z "${profile}" ]; then
              PREFIX="CONFIG_TARGET_$(printf '%s' "${target}" | sed 's#^targets/##' | tr '/' '_')_DEVICE_"
              if [ -f "${seed}" ]; then
                SYM="$(grep -oE "^${PREFIX}[A-Za-z0-9_.-]+=y" "${seed}" | head -n1 || true)"
                profile="${SYM#"${PREFIX}"}"; profile="${profile%=y}"
              fi
              echo ">>> ${name}: 映射表未写 profile → 从种子推导 = '${profile}'"
            fi

            [ -n "${repo}" ] && [ -n "${branch}" ] && [ -n "${seed}" ] && [ -n "${profile}" ] \
              || { echo "ERROR: ${name} 字段不全 repo='${repo}' branch='${branch}' seed='${seed}' profile='${profile}'"; exit 1; }

            echo ">>> ${name}: repo=${repo} ref=${branch} seed=${seed} target=${target} profile=${profile}"
            ITEMS="${ITEMS}${ITEMS:+,}{\"device\":\"${name}\",\"repo\":\"${repo}\",\"branch\":\"${branch}\",\"seed\":\"${seed}\",\"target\":\"${target}\",\"profile\":\"${profile}\"}"
          done < "${MAP}"

          [ -n "${ITEMS}" ] || { echo "ERROR: 没解析出任何设备（检查 ${MAP} 格式）"; exit 1; }
          echo ">>> matrix={\"include\":[${ITEMS}]}"
          echo "matrix={\"include\":[${ITEMS}]}" >> "$GITHUB_OUTPUT"

  # ======================================================================
  # ref 扫描：所有 head/tag 的日期 + feeds.conf 内容 + 与基准 ref 的差异
  # ======================================================================
  scanrefs:
    needs: discover
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Scan refs ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Scan all refs
        shell: bash
        run: |
          set -euxo pipefail
          DEVICE='${{ matrix.device }}'
          REPO='${{ matrix.repo }}'
          BASE_BRANCH='${{ matrix.branch }}'

          rm -rf repo
          git clone --filter=blob:none --no-checkout "${REPO}" repo >/dev/null 2>&1

          resolve_ref() {
            for c in "origin/$1" "$1" "refs/tags/$1"; do
              if git -C repo rev-parse --verify --quiet "${c}^{commit}" >/dev/null 2>&1; then
                printf '%s' "$c"; return 0
              fi
            done
            return 1
          }
          feeds_file_of() {
            if [ -n "$(git -C repo ls-tree "$1" -- feeds.conf 2>/dev/null)" ]; then
              echo feeds.conf
            else
              echo feeds.conf.default
            fi
          }
          norm_feeds() {
            awk '/^[[:space:]]*src-/{u=$3; sub(/\^.*$/,"",u); print $2, u}'
          }

          BASE_REF="$(resolve_ref "${BASE_BRANCH}")" || { echo "::error::解析不到 ref: ${BASE_BRANCH}"; exit 1; }
          BASE_F="$(feeds_file_of "${BASE_REF}")"
          echo ">>> ${DEVICE} repo=${REPO} 映射 ref=${BASE_BRANCH} → 实际 ${BASE_REF} 文件=${BASE_F}"
          git -C repo show "${BASE_REF}:${BASE_F}" 2>/dev/null > /tmp/base-feeds.raw || true
          norm_feeds < /tmp/base-feeds.raw > /tmp/base-feeds.norm || true
          echo ">>> 基准 feed:"; sed 's/^/    /' /tmp/base-feeds.norm

          {
            echo "## ${DEVICE} — ref 扫描（${REPO}）"
            echo ""
            echo "基准 ref：\`${BASE_BRANCH}\`（实际 \`${BASE_REF}\`，文件 \`${BASE_F}\`）"
            echo ""
            echo '```'
            cat /tmp/base-feeds.norm
            echo '```'
            echo ""
            echo "| ref | 最后提交 | feed 数 | 新增的 feed | URL 变了的 feed |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          # 基准 ref 必须进列表（之前 head -40 可能把它挤掉）
          OTHERS="$( { git -C repo branch -r --format='%(refname:short)' | grep -v 'HEAD'; git -C repo tag; } | sort -u | head -40 )"
          REFS="$(printf '%s\n%s\n' "${BASE_REF}" "${OTHERS}" | awk 'NF && !seen[$0]++')"

          for r in ${REFS}; do
            D="$(git -C repo log -1 --format=%ci "${r}" 2>/dev/null || echo '?')"
            F="$(feeds_file_of "${r}")"
            git -C repo show "${r}:${F}" 2>/dev/null > /tmp/ref-feeds.raw || true
            norm_feeds < /tmp/ref-feeds.raw > /tmp/ref-feeds.norm || true
            N="$(grep -c . /tmp/ref-feeds.norm || true)"

            NEW="$(comm -23 <(cut -d' ' -f1 /tmp/ref-feeds.norm | sort -u) <(cut -d' ' -f1 /tmp/base-feeds.norm | sort -u) 2>/dev/null | paste -sd, - || true)"
            CHG="$(awk 'NR==FNR{a[$1]=$2; next} { if ($1 in a && a[$1]!=$2) printf "%s(%s→%s) ", $1, a[$1], $2 }' /tmp/base-feeds.norm /tmp/ref-feeds.norm 2>/dev/null || true)"
            CAND="$(git -C repo ls-tree -r --name-only "${r}" 2>/dev/null | grep -E '^\.github/workflows/.*\.ya?ml$|^feeds\.conf$|(^|/)(build|diy|feeds|compile)[A-Za-z0-9_.-]*\.sh$' | head -8 | paste -sd' ' - || true)"

            echo "=============================================================="
            echo "### ${r}   (${D})   ${F}  feed=${N}   NEW=${NEW:-无}   CHANGED=${CHG:-无}"
            sed 's/^/    /' /tmp/ref-feeds.norm
            echo "    candidate scripts: ${CAND:-无}"
            printf '| `%s` | %s | %s | %s | %s |\n' "${r}" "${D%% *}" "${N}" "${NEW:-—}" "${CHG:-—}" >> "$GITHUB_STEP_SUMMARY"
          done
          rm -f /tmp/*-feeds.norm /tmp/*-feeds.raw

  # ======================================================================
  # 事实收集：包体系 / 内核 / feed 体检 / 种子差异 / 缺包溯源
  # ======================================================================
  detect:
    needs: discover
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Detect ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Collect facts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          DEVICE='${{ matrix.device }}'
          REPO='${{ matrix.repo }}'
          BRANCH='${{ matrix.branch }}'
          SEED='${{ matrix.seed }}'
          PROFILE='${{ matrix.profile }}'

          # ---------------- 字段自检 ----------------
          case "${REPO}" in
            http*|git@*) : ;;
            *) echo "::error::repo 字段不合法: '${REPO}'"; exit 1 ;;
          esac
          case "${BRANCH}" in
            ""|*.config) echo "::error::branch 字段不合法: '${BRANCH}'"; exit 1 ;;
          esac
          case "${SEED}" in
            *.config) : ;;
            *) echo "::error::seed 字段不合法: '${SEED}'"; exit 1 ;;
          esac
          case "${PROFILE}" in
            ""|*/*|*.config) echo "::error::profile 字段不合法: '${PROFILE}'"; exit 1 ;;
          esac
          echo ">>> device=${DEVICE} repo=${REPO} ref=${BRANCH} seed=${SEED} profile=${PROFILE}"

          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc make perl python3 unzip file wget curl libncurses-dev zlib1g-dev libssl-dev 2>/dev/null || true

          rm -rf src
          if ! git clone --depth=1 -b "${BRANCH}" "${REPO}" src >/dev/null 2>&1; then
            echo "## ${DEVICE}：克隆失败（${BRANCH}）" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::克隆失败: ${REPO} @ ${BRANCH}"; exit 1
          fi
          cd src
          COMMIT="$(git rev-parse HEAD)"
          CDATE="$(git log -1 --format=%cd --date=iso)"
          echo ">>> commit=${COMMIT} date=${CDATE}"

          echo "--- feeds 文件 ---"
          if [ -f feeds.conf ]; then cat feeds.conf; else echo "[只有 feeds.conf.default]"; fi
          echo "--- 包体系 ---"
          ls -d package/system/apk package/system/opkg 2>/dev/null || echo "(都无)"
          echo "--- USE_APK 默认 ---"
          grep -A4 'config USE_APK' config/Config-build.in 2>/dev/null || echo "(无 config/Config-build.in)"
          echo "--- 版本线索 ---"
          grep -m3 -E 'RELEASE|VERSION_NUMBER|VERSION_CODE' include/version.mk 2>/dev/null || true
          echo "--- 内核 ---"
          grep -rhE '^KERNEL_PATCHVER|^LINUX_VERSION' target/linux/*/Makefile target/linux/*/*/target.mk 2>/dev/null | head -5

          # ---------------- feeds ----------------
          ./scripts/feeds update -a > /tmp/feeds.log 2>&1 || { tail -40 /tmp/feeds.log; echo "!! feeds update 失败"; exit 1; }
          ./scripts/feeds install -a >> /tmp/feeds.log 2>&1 || { tail -40 /tmp/feeds.log; echo "!! feeds install 失败"; exit 1; }
          echo ">>> feed 目录: $(ls -d feeds/*/ 2>/dev/null | wc -l) 个"

          awk '/^[[:space:]]*src-git[[:space:]]+/{print $2, $3}' feeds.conf.default 2>/dev/null | tr -d '\r' > /tmp/feeds.list

          {
            echo "### feeds 体检"
            echo ""
            echo "| feed | 实际 HEAD | 提交日期 | Makefile 数 | 与 pin 一致 |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r nm u; do
            [ -n "${nm:-}" ] || continue
            d="feeds/${nm}"
            if [ ! -d "${d}" ]; then
              echo "  ${nm}: <feed 目录不存在！>"
              printf '| %s | — | — | — | **目录不存在** |\n' "${nm}" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            h="$(git -C "${d}" rev-parse HEAD 2>/dev/null || echo '?')"
            hs="$(git -C "${d}" rev-parse --short HEAD 2>/dev/null || echo '?')"
            dt="$(git -C "${d}" log -1 --format=%ci 2>/dev/null || echo '?')"
            cnt="$(find "${d}" -name Makefile 2>/dev/null | wc -l)"
            case "${u}" in
              *^*) pin="${u##*^}"
                   if [ "${pin}" = "${h}" ]; then ok="OK"; else ok="**不一致**"; fi ;;
              *)   pin="未 pin"; ok="—" ;;
            esac
            echo "  ${nm}: HEAD=${hs} (${dt%% *}) Makefile数=${cnt} pin=${pin} ${ok}"
            printf '| %s | `%s` | %s | %s | %s |\n' "${nm}" "${hs}" "${dt%% *}" "${cnt}" "${ok}" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/feeds.list

          # ---------------- 种子 → defconfig ----------------
          SEED_FILE="${GITHUB_WORKSPACE}/${SEED}"
          [ -f "${SEED_FILE}" ] || { echo "!! 种子不存在: ${SEED}"; exit 1; }
          cp -f "${SEED_FILE}" .config
          make defconfig > /tmp/defconfig.log 2>&1 || { tail -40 /tmp/defconfig.log; echo "!! make defconfig 失败"; exit 1; }

          BOARD="$(sed -n 's/^CONFIG_TARGET_BOARD="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          SUB="$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          ARCH="$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          PROF="$(sed -n 's/^CONFIG_TARGET_PROFILE="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          USE_APK="$(sed -n 's/^CONFIG_USE_APK=y$/y/p' .config | head -n1)"
          SYM="CONFIG_TARGET_${BOARD}_${SUB}_DEVICE_${PROFILE}"
          DEV_ALL="$(grep -cE '^CONFIG_(TARGET_DEVICE_|TARGET_).*_DEVICE_[A-Za-z0-9_.-]+=y$' .config || true)"
          SYM_OK="$(grep -c "^${SYM}=y" .config || true)"
          ZHCN_SEED="$(grep -cE '^CONFIG_PACKAGE_luci-i18n-.*-zh-cn=y' "${SEED_FILE}" || true)"
          ZHCN="$(grep -cE '^CONFIG_PACKAGE_luci-i18n-.*-zh-cn=y' .config || true)"
          SEL="$(grep -cE '^CONFIG_PACKAGE_.*=y$' .config || true)"

          awk '/^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$/{sub(/^CONFIG_PACKAGE_/,"");sub(/=y$/,"");print}' "${SEED_FILE}" | sort -u > /tmp/seed.txt
          grep -oE '^[[:space:]]*config[[:space:]]+PACKAGE_[A-Za-z0-9_.+-]+' tmp/.config-package.in | sed -E 's/^[[:space:]]*config[[:space:]]+PACKAGE_//' | sort -u > /tmp/tree.txt
          awk '/^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$/{sub(/^CONFIG_PACKAGE_/,"");sub(/=y$/,"");print}' .config | sort -u > /tmp/now.txt

          echo ">>> 种子声明 $(wc -l < /tmp/seed.txt) / 本树可见 $(wc -l < /tmp/tree.txt) / defconfig 后启用 $(wc -l < /tmp/now.txt)"
          comm -23 /tmp/seed.txt /tmp/now.txt > /tmp/lost.txt
          comm -23 /tmp/lost.txt /tmp/tree.txt > /tmp/notfound.txt
          comm -12 /tmp/lost.txt /tmp/tree.txt > /tmp/dropped.txt

          # ---------------- 本地实测：丢掉的包在 feeds/ 里到底有没有 ----------------
          #   不再写死旧仓库的包名，直接从 lost.txt 派生（最多 40 个）
          find feeds -maxdepth 5 -type d 2>/dev/null | sort > /tmp/feeds-dirs.txt || true
          awk 'NR<=40' /tmp/lost.txt > /tmp/lost-cap.txt
          : > /tmp/where-local.txt
          while IFS= read -r p; do
            [ -n "${p}" ] || continue
            hit="$(awk -v n="${p}" -F/ '$NF==n' /tmp/feeds-dirs.txt | head -3 | paste -sd' ' - || true)"
            printf '  %-40s %s\n' "${p}" "${hit:-<feeds 里没有>}"
            printf '| `%s` | %s |\n' "${p}" "${hit:-**没有**}" >> /tmp/where-local.txt
          done < /tmp/lost-cap.txt

          # ---------------- 官方快照 feed 探活（决定 distfeeds 会不会有死链）----------------
          DL="https://downloads.openwrt.org/snapshots"
          {
            echo "### 官方快照 feed 探活"
            echo ""
            echo "ARCH_PACKAGES=\`${ARCH}\` → 探测 \`${DL}/packages/${ARCH}/<feed>/\`"
            echo ""
            echo "| feed | packages.adb | index.json |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ARCH}" ]; then
            while read -r nm u; do
              [ -n "${nm:-}" ] || continue
              c1="$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "${DL}/packages/${ARCH}/${nm}/packages.adb" || echo 000)"
              c2="$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "${DL}/packages/${ARCH}/${nm}/index.json" || echo 000)"
              echo "  ${nm}: packages.adb=${c1} index.json=${c2}"
              printf '| %s | %s | %s |\n' "${nm}" "${c1}" "${c2}" >> "$GITHUB_STEP_SUMMARY"
            done < /tmp/feeds.list
          else
            echo "  !! ARCH_PACKAGES 为空，跳过"
          fi
          PJ="$(curl -s --max-time 25 "${DL}/targets/${BOARD}/${SUB}/profiles.json" || true)"
          KVER_DL="$(printf '%s' "${PJ}" | jq -r '.linux_kernel.version // "?"' 2>/dev/null || echo '?')"
          KVG_DL="$(printf '%s' "${PJ}" | jq -r '.linux_kernel.vermagic // "?"' 2>/dev/null || echo '?')"
          echo ">>> 官方快照 targets/${BOARD}/${SUB} 内核=${KVER_DL} vermagic=${KVG_DL}（仅供参考，构建以本树为准）"

          # ---------------- API 溯源：缺包在哪个 feed 的上游 ----------------
          fetch_tree() {
            curl -sSL --max-time 60 -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$1/git/trees/$2?recursive=1" 2>/dev/null \
              | grep -oE '"path"[[:space:]]*:[[:space:]]*"[^"]+"' \
              | sed -E 's/.*"([^"]+)"[[:space:]]*$/\1/' || true
          }
          rm -f /tmp/tree-*.txt
          while read -r nm u; do
            [ -n "${nm:-}" ] || continue
            url="${u%%^*}"; ref="${u##*^}"; [ "${ref}" = "${u}" ] && ref="HEAD"
            case "${url}" in
              *github.com[:/]*) : ;;
              *) echo "  [${nm}] 非 GitHub，跳过: ${url}"; continue ;;
            esac
            slug="$(printf '%s' "${url}" | sed -E 's#^https?://github\.com/##; s#^git@github\.com:##; s#\.git$##; s#/$##')"
            tree="$(fetch_tree "${slug}" "${ref}")"
            if [ -z "${tree}" ] && [ "${ref}" != "HEAD" ]; then
              echo "  [${nm}] pin ${ref} 取不到 → 退回 HEAD"
              tree="$(fetch_tree "${slug}" "HEAD")"
            fi
            [ -n "${tree}" ] || { echo "  [${nm}] ${slug} 取不到 tree，跳过"; continue; }
            printf '%s\n' "${tree}" > "/tmp/tree-${nm}.txt"
            echo "  [${nm}] ${slug}@${ref} 文件数=$(wc -l < "/tmp/tree-${nm}.txt")"
          done < /tmp/feeds.list

          : > /tmp/where.txt
          awk 'NR<=40' /tmp/notfound.txt > /tmp/notfound-cap.txt
          while IFS= read -r p; do
            [ -n "${p}" ] || continue
            hit=""
            for f in /tmp/tree-*.txt; do
              [ -f "${f}" ] || continue
              if grep -qF "/${p}/" "${f}" || grep -qF "${p}/Makefile" "${f}"; then
                hit="${hit} $(basename "${f}" .txt | sed 's/^tree-//')"
              fi
            done
            printf '  %-44s %s\n' "${p}" "${hit:-<上游也没有>}"
            printf '| `%s` | %s |\n' "${p}" "${hit:-**上游也没有**}" >> /tmp/where.txt
          done < /tmp/notfound-cap.txt

          # ---------------- Job Summary ----------------
          {
            echo "## ${DEVICE}"
            echo ""
            echo "- 源: \`${REPO}@${BRANCH}\`  commit \`${COMMIT}\` (${CDATE})"
            echo "- 包体系: USE_APK=\`${USE_APK:-no}\`（package/system: $(ls -d package/system/apk package/system/opkg 2>/dev/null | xargs -r -n1 basename | paste -sd, -)）"
            echo "- target: \`targets/${BOARD}/${SUB}\`  ARCH_PACKAGES: \`${ARCH}\`"
            echo "- profile: \`${PROFILE}\`  符号 \`${SYM}\` = $([ "${SYM_OK}" = 1 ] && echo OK || echo '**不匹配**')"
            echo "- CONFIG_TARGET_PROFILE: \`${PROF:-<无>}\`"
            echo "- 收窄前 device 选项数: **${DEV_ALL}**   已选包数: **${SEL}**   zh-cn: 种子 ${ZHCN_SEED} → **${ZHCN}**"
            echo "- 官方快照 targets 内核（参考）: ${KVER_DL} / ${KVG_DL}"
            echo ""
            echo "### ① 本源树根本没有 —— $(wc -l < /tmp/notfound.txt) 个"
            echo '```'; sed 's/^/  /' /tmp/notfound.txt; echo '```'
            echo "### ② 存在但没启用（依赖不满足）—— $(wc -l < /tmp/dropped.txt) 个"
            echo '```'; sed 's/^/  /' /tmp/dropped.txt; echo '```'
            echo "### ③ 丢掉的包在 feeds/ 里的位置（前 40 个）"
            echo ""
            echo "| 包 | feeds 里的路径 |"
            echo "|---|---|"
            cat /tmp/where-local.txt 2>/dev/null || true
            echo ""
            echo "### ④ 缺包的上游溯源（API，前 40 个）"
            echo ""
            echo "| 缺包 | 上游哪个 feed 有 |"
            echo "|---|---|"
            cat /tmp/where.txt 2>/dev/null || true
            echo ""
            echo "### feeds.conf.default"
            echo '```'; cat feeds.conf.default 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "===== 关键值 ====="
          echo "device=${DEVICE} repo=${REPO} ref=${BRANCH} seed=${SEED} profile=${PROFILE}"
          echo "target=targets/${BOARD}/${SUB} arch=${ARCH} USE_APK=${USE_APK:-no} DEV_ALL=${DEV_ALL} SYM_OK=${SYM_OK}"
          echo "notfound=$(wc -l < /tmp/notfound.txt) dropped=$(wc -l < /tmp/dropped.txt) zhcn=${ZHCN_SEED}->${ZHCN}"
