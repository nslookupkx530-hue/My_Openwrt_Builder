name: Detect Device Arch (DSF 第三方源)
run-name: "Detect Device Arch (DSF 第三方源): ${{ inputs.device }}"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "要检测的设备"
        required: true
        default: all
        type: choice
        options: [all, GL-MT5000, JDC-AX6600]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          MAP=configs/DSF/device_mapping.conf
          SEL='${{ github.event.inputs.device }}'
          [ -f "${MAP}" ] || { echo "ERROR: 找不到 ${MAP}"; exit 1; }

          ITEMS=""
          while IFS= read -r line; do
            line="$(printf '%s' "${line}" | tr -d '\r')"
            case "${line}" in ''|'#'*) continue ;; esac
            name="$(printf '%s' "${line%%=*}" | xargs)"
            val="$(printf '%s' "${line#*=}"  | xargs)"
            [ -n "${name}" ] || continue
            if [ "${SEL}" != "all" ] && [ "${name}" != "${SEL}" ]; then continue; fi

            repo="$(printf '%s'    "${val}" | cut -d'|' -f1 | xargs)"
            branch="$(printf '%s'  "${val}" | cut -d'|' -f2 | xargs)"
            seed="$(printf '%s'    "${val}" | cut -d'|' -f3 | xargs)"
            target="$(printf '%s'  "${val}" | cut -d'|' -f4 | xargs)"
            profile="$(printf '%s' "${val}" | cut -d'|' -f5 | xargs)"

            # 第 5 段可省：从种子配置里的 CONFIG_TARGET_<board>_<sub>_DEVICE_<profile>=y 推导
            if [ -z "${profile}" ]; then
              PREFIX="CONFIG_TARGET_$(printf '%s' "${target}" | sed 's#^targets/##' | tr '/' '_')_DEVICE_"
              if [ -f "${seed}" ]; then
                SYM="$(grep -oE "^${PREFIX}[A-Za-z0-9_.-]+=y" "${seed}" | head -n1 || true)"
                profile="${SYM#"${PREFIX}"}"; profile="${profile%=y}"
              fi
              echo ">>> ${name}: 映射表未写 profile → 从种子推导 = '${profile}'"
            fi

            [ -n "${repo}" ] && [ -n "${branch}" ] && [ -n "${seed}" ] && [ -n "${profile}" ] \
              || { echo "ERROR: ${name} 字段不全 repo='${repo}' branch='${branch}' seed='${seed}' profile='${profile}'"; exit 1; }

            ITEMS="${ITEMS}${ITEMS:+,}{\"device\":\"${name}\",\"repo\":\"${repo}\",\"branch\":\"${branch}\",\"seed\":\"${seed}\",\"target\":\"${target}\",\"profile\":\"${profile}\"}"
          done < "${MAP}"

          [ -n "${ITEMS}" ] || { echo "ERROR: 没解析出任何设备（检查 ${MAP} 格式）"; exit 1; }
          echo ">>> matrix={\"include\":[${ITEMS}]}"
          echo "matrix={\"include\":[${ITEMS}]}" >> "$GITHUB_OUTPUT"

  # ======================================================================
  # 新增：扫描该源的所有 ref —— 解决"该用哪个分支"的问题
  #   feeds.conf（非 .default）才是 scripts/feeds 真正读的文件；
  #   哪个 ref 多挂了 feed，缺包就能对上。
  # ======================================================================
  scanrefs:
    needs: discover
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Scan refs ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Scan all refs
        shell: bash
        run: |
          set -euxo pipefail
          DEVICE='${{ matrix.device }}'
          REPO='${{ matrix.repo }}'
          BASE_BRANCH='${{ matrix.branch }}'

          rm -rf repo
          git clone --filter=blob:none --no-checkout "${REPO}" repo >/dev/null 2>&1

          # 映射表写的是裸名（mt5000 / 25.12.4），但分支在本地是 origin/<名>，tag 才是裸名
          resolve_ref() {
            for c in "origin/$1" "$1" "refs/tags/$1"; do
              if git -C repo rev-parse --verify --quiet "${c}^{commit}" >/dev/null 2>&1; then
                printf '%s' "$c"; return 0
              fi
            done
            return 1
          }
          # 用 tree 判断 feeds 文件（blobless clone 里 tree 是本地就有的，不触发网络）
          feeds_file_of() {
            if [ -n "$(git -C repo ls-tree "$1" -- feeds.conf 2>/dev/null)" ]; then
              echo feeds.conf
            else
              echo feeds.conf.default
            fi
          }

          BASE_REF="$(resolve_ref "${BASE_BRANCH}")" || { echo "::error::解析不到 ref: ${BASE_BRANCH}"; exit 1; }
          BASE_F="$(feeds_file_of "${BASE_REF}")"
          echo ">>> ${DEVICE}  repo=${REPO}  映射 ref=${BASE_BRANCH} → 实际 ${BASE_REF}  文件=${BASE_F}"
          git -C repo show "${BASE_REF}:${BASE_F}" 2>/dev/null | awk '/^[[:space:]]*src-/{print $2}' | sort -u > /tmp/base-feeds.txt || true
          echo ">>> 基准 feed: $(paste -sd' ' /tmp/base-feeds.txt)"

          {
            echo "## ${DEVICE} — ref 扫描（${REPO}）"
            echo ""
            echo "基准 ref：\`${BASE_BRANCH}\`（实际 \`${BASE_REF}\`，文件 \`${BASE_F}\`）"
            echo ""
            echo "基准 feed：$(paste -sd' ' /tmp/base-feeds.txt)"
            echo ""
            echo "| ref | 最后提交 | feeds 文件 | feed 数 | 比基准多挂的 feed |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          REFS="$( { git -C repo branch -r --format='%(refname:short)' | grep -v 'HEAD'; git -C repo tag; } | sort -u | head -40 )"
          for r in ${REFS}; do
            D="$(git -C repo log -1 --format=%ci "${r}" 2>/dev/null || echo '?')"
            F="$(feeds_file_of "${r}")"
            BODY="$(git -C repo show "${r}:${F}" 2>/dev/null || true)"
            N="$(printf '%s\n' "${BODY}" | grep -cE '^[[:space:]]*src-' || true)"
            printf '%s\n' "${BODY}" | awk '/^[[:space:]]*src-/{print $2}' | sort -u > /tmp/this-feeds.txt || true

            EXTRA="$(comm -23 /tmp/this-feeds.txt /tmp/base-feeds.txt 2>/dev/null | paste -sd, - || true)"
            CAND="$(git -C repo ls-tree -r --name-only "${r}" 2>/dev/null \
                    | grep -E '^\.github/workflows/.*\.ya?ml$|^feeds\.conf$|(^|/)(build|diy|feeds|compile)[A-Za-z0-9_.-]*\.sh$' \
                    | head -8 | paste -sd' ' - || true)"

            echo "=============================================================="
            echo "### ${r}   (${D})   ${F}  feed=${N}   extra=${EXTRA:-无}"
            printf '%s\n' "${BODY}" | sed 's/^/    /'
            echo "    candidate scripts: ${CAND:-无}"
            printf '| `%s` | %s | %s | %s | %s |\n' "${r}" "${D%% *}" "${F}" "${N}" "${EXTRA:-—}" >> "$GITHUB_STEP_SUMMARY"
          done

          echo ">>> 提示：EXTRA 非空的 ref 就是"多挂了 feed"的；把它的 feeds 行抄进构建流程即可" 

  detect:
    needs: discover
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Detect ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Collect facts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          DEVICE='${{ matrix.device }}'
          REPO='${{ matrix.repo }}'
          BRANCH='${{ matrix.branch }}'
          SEED='${{ matrix.seed }}'
          PROFILE='${{ matrix.profile }}'

          # ---- 字段自检：错位在这里就报出来，不要等到 git clone 失败 ----
          case "${REPO}" in
            http*|git@*) : ;;
            *) echo "::error::repo 字段不合法: '${REPO}'（device_mapping.conf 解析错位？）"; exit 1 ;;
          esac
          case "${BRANCH}" in
            ""|*.config) echo "::error::branch 字段不合法: '${BRANCH}'（像种子文件路径，说明解析错位）"; exit 1 ;;
          esac
          case "${SEED}" in
            *.config) : ;;
            *) echo "::error::seed 字段不合法: '${SEED}'"; exit 1 ;;
          esac
          case "${PROFILE}" in
            ""|*/*|*.config) echo "::error::profile 字段不合法: '${PROFILE}'"; exit 1 ;;
          esac
          echo ">>> device=${DEVICE} repo=${REPO} branch=${BRANCH} seed=${SEED} profile=${PROFILE}"

          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc make git perl python3 unzip file wget curl \
            libncurses-dev zlib1g-dev libssl-dev 2>/dev/null || true

          rm -rf src
          if ! git clone --depth=1 -b "${BRANCH}" "${REPO}" src >/dev/null 2>&1; then
            echo "## ${DEVICE}：克隆失败（分支 ${BRANCH}）" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::克隆失败: ${REPO} @ ${BRANCH}"; exit 1
          fi
          cd src
          COMMIT="$(git rev-parse HEAD)"; CDATE="$(git log -1 --format=%cd --date=iso)"
          echo ">>> ${DEVICE} commit=${COMMIT} date=${CDATE}"
          echo "--- feeds 文件 ---"
          if [ -f feeds.conf ]; then echo "[feeds.conf 存在]"; cat feeds.conf; else echo "[只有 feeds.conf.default]"; cat feeds.conf.default 2>/dev/null || true; fi
          echo "--- 包体系 ---"; ls -d package/system/apk package/system/opkg 2>/dev/null || echo "(都无)"
          echo "--- 版本线索 ---"; grep -m3 -E 'RELEASE|VERSION_NUMBER|VERSION_CODE' include/version.mk 2>/dev/null || true
          echo "--- 内核 ---"; grep -rhE '^KERNEL_PATCHVER|^LINUX_VERSION' target/linux/*/Makefile target/linux/*/*/target.mk 2>/dev/null | head -5

          # ================================================================
          # 关键：必须先装 feeds！否则 defconfig 会把所有 feed 包当"不存在"丢掉
          # ================================================================
          ./scripts/feeds update -a  > /tmp/feeds.log 2>&1 || { tail -40 /tmp/feeds.log; echo "!! feeds update 失败"; exit 1; }
          ./scripts/feeds install -a >> /tmp/feeds.log 2>&1 || { tail -40 /tmp/feeds.log; echo "!! feeds install 失败"; exit 1; }
          echo ">>> feed 目录: $(ls -d feeds/*/ 2>/dev/null | wc -l) 个"

          SEED_FILE="${GITHUB_WORKSPACE}/${SEED}"
          [ -f "${SEED_FILE}" ] || { echo "!! 种子不存在: ${SEED}"; exit 1; }
          cp -f "${SEED_FILE}" .config
          make defconfig > /tmp/defconfig.log 2>&1 || { tail -40 /tmp/defconfig.log; echo "!! make defconfig 失败"; exit 1; }

          BOARD="$(sed -n 's/^CONFIG_TARGET_BOARD="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          SUB="$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          ARCH="$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          PROF="$(sed -n 's/^CONFIG_TARGET_PROFILE="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          SYM="CONFIG_TARGET_${BOARD}_${SUB}_DEVICE_${PROFILE}"
          DEV_ALL="$(grep -cE '^CONFIG_(TARGET_DEVICE_|TARGET_).*_DEVICE_[A-Za-z0-9_.-]+=y$' .config || true)"
          SYM_OK="$(grep -c "^${SYM}=y" .config || true)"
          ZHCN_SEED="$(grep -cE '^CONFIG_PACKAGE_luci-i18n-.*-zh-cn=y' "${SEED_FILE}" || true)"
          ZHCN="$(grep -cE '^CONFIG_PACKAGE_luci-i18n-.*-zh-cn=y' .config || true)"
          SEL="$(grep -cE '^CONFIG_PACKAGE_.*=y$' .config || true)"

          # ================================================================
          # 三段式差异诊断：真缺 / 存在但没启用（依赖不满足）/ 正常
          # ================================================================
          awk '/^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$/{sub(/^CONFIG_PACKAGE_/,"");sub(/=y$/,"");print}' "${SEED_FILE}" | sort -u > /tmp/seed.txt
          grep -oE '^[[:space:]]*config[[:space:]]+PACKAGE_[A-Za-z0-9_.+-]+' tmp/.config-package.in \
            | sed -E 's/^[[:space:]]*config[[:space:]]+PACKAGE_//' | sort -u > /tmp/tree.txt
          awk '/^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$/{sub(/^CONFIG_PACKAGE_/,"");sub(/=y$/,"");print}' .config | sort -u > /tmp/now.txt

          echo ">>> 种子声明 $(wc -l < /tmp/seed.txt) / 本树可见 $(wc -l < /tmp/tree.txt) / defconfig 后启用 $(wc -l < /tmp/now.txt)"
          [ "$(wc -l < /tmp/tree.txt)" -gt 500 ] || echo "::warning::本树可见包符号数异常少，tmp/.config-package.in 格式可能不同"

          comm -23 /tmp/seed.txt /tmp/now.txt    > /tmp/lost.txt
          comm -23 /tmp/lost.txt  /tmp/tree.txt  > /tmp/notfound.txt
          comm -12 /tmp/lost.txt  /tmp/tree.txt  > /tmp/dropped.txt

          # ================================================================
          # 追查"缺的包该挂哪个 feed"
          #   解析每条 feed 的 URL + pin，用 GitHub API 拉该 pin 处的完整文件树，
          #   再逐个缺包去匹配
          # ================================================================
          echo "--- 哪些脚本/CI 会动 feeds ---"
          grep -rln --include='*.yml' --include='*.yaml' --include='*.sh' --include='*.conf' -E 'src-git|src-link' . 2>/dev/null \
            | grep -v -E '^\./(feeds|build_dir|staging_dir|tmp|dl|package/feeds)/' | head -15 || true

          awk '/^[[:space:]]*src-git[[:space:]]+/{print $2, $3}' feeds.conf.default 2>/dev/null | tr -d '\r' > /tmp/feeds.list
          echo ">>> 待查 feed: $(wc -l < /tmp/feeds.list) 条"

          # 取某个仓库某个 ref 的完整文件列表（失败返回空，绝不触发 errexit）
          fetch_tree() {   # $1=slug  $2=ref
            curl -sSL --max-time 60 \
                 -H "Authorization: Bearer ${GH_TOKEN}" \
                 -H 'Accept: application/vnd.github+json' \
                 "https://api.github.com/repos/$1/git/trees/$2?recursive=1" 2>/dev/null \
              | grep -oE '"path"[[:space:]]*:[[:space:]]*"[^"]+"' \
              | sed -E 's/.*"([^"]+)"[[:space:]]*$/\1/' || true
          }

          while read -r nm u; do
            [ -n "${nm:-}" ] || continue
            # ★ 先拆 pin，再算 slug（顺序反了会把 ^sha 留在仓库名里 → 404）
            url="${u%%^*}"; ref="${u##*^}"; [ "${ref}" = "${u}" ] && ref="HEAD"
            case "${url}" in
              *github.com[:/]*) : ;;
              *) echo "  [${nm}] 非 GitHub，跳过: ${url}"; continue ;;
            esac
            slug="$(printf '%s' "${url}" | sed -E 's#^https?://github\.com/##; s#^git@github\.com:##; s#\.git$##; s#/$##')"

            tree="$(fetch_tree "${slug}" "${ref}")"
            if [ -z "${tree}" ] && [ "${ref}" != "HEAD" ]; then
              echo "  [${nm}] pin ${ref} 取不到 → 退回 HEAD 再试"
              tree="$(fetch_tree "${slug}" "HEAD")"
            fi
            [ -n "${tree}" ] || { echo "  [${nm}] ${slug} 取不到 tree，跳过"; continue; }

            printf '%s\n' "${tree}" > "/tmp/tree-${nm}.txt"
            echo "  [${nm}] ${slug}@${ref}  文件数=$(wc -l < "/tmp/tree-${nm}.txt")"
          done < /tmp/feeds.list

          echo "--- 逐个缺包：哪个 feed 的上游有它 ---"
          : > /tmp/where.txt
          while read -r p; do
            [ -n "${p}" ] || continue
            hit=""
            for f in /tmp/tree-*.txt; do
              [ -f "${f}" ] || continue
              if grep -qF "/${p}/" "${f}" || grep -qF "${p}/Makefile" "${f}"; then
                hit="${hit} $(basename "${f}" .txt | sed 's/^tree-//')"
              fi
            done
            if [ -z "${hit}" ]; then    # 退一步：包名首段模糊匹配（如 amneziawg-tools ← amneziawg）
              alt="${p%%-*}"
              for f in /tmp/tree-*.txt; do
                [ -f "${f}" ] || continue
                if grep -qF "/${alt}/" "${f}"; then
                  hit="${hit} (疑似)${alt}@$(basename "${f}" .txt | sed 's/^tree-//')"
                fi
              done
            fi
            printf '  %-44s %s\n' "${p}" "${hit:-<所有 feed 上游都没有 → 需新 feed 或改名>}"
            printf '| `%s` | %s |\n' "${p}" "${hit:-**都没有**}" >> /tmp/where.txt
          done < /tmp/notfound.txt

          # ================================================================
          # Job Summary
          # ================================================================
          {
            echo "## ${DEVICE}"
            echo ""
            echo "- 源: \`${REPO}@${BRANCH}\`  commit \`${COMMIT}\` (${CDATE})"
            echo "- target: \`targets/${BOARD}/${SUB}\`  ARCH_PACKAGES: \`${ARCH}\`"
            echo "- profile: \`${PROFILE}\`  符号 \`${SYM}\` = $([ "${SYM_OK}" = 1 ] && echo OK || echo '**不匹配**')"
            echo "- CONFIG_TARGET_PROFILE: \`${PROF:-<无>}\`"
            echo "- 收窄前 device 选项数: **${DEV_ALL}**   已选包数: **${SEL}**"
            echo "- zh-cn 包: 种子 ${ZHCN_SEED} → defconfig 后 **${ZHCN}**"
            echo ""
            echo "### ① 本源树根本没有 —— $(wc -l < /tmp/notfound.txt) 个"
            echo '```'; sed 's/^/  /' /tmp/notfound.txt; echo '```'
            echo "### ①附：它到底该挂哪个 feed"
            echo ""
            echo "| 缺包 | 上游哪个 feed 有 |"
            echo "|---|---|"
            cat /tmp/where.txt 2>/dev/null || true
            echo ""
            echo "### ② 存在但没启用（依赖不满足）—— $(wc -l < /tmp/dropped.txt) 个"
            echo '```'; sed 's/^/  /' /tmp/dropped.txt; echo '```'
            echo "### feed 清单"
            echo '```'; cat feeds.conf.default 2>/dev/null; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "===== 关键值 ====="
          echo "device=${DEVICE} repo=${REPO} branch=${BRANCH} seed=${SEED} profile=${PROFILE}"
          echo "target=targets/${BOARD}/${SUB}  arch=${ARCH}  DEV_ALL=${DEV_ALL}  SYM_OK=${SYM_OK}"
          echo "notfound=$(wc -l < /tmp/notfound.txt)  dropped=$(wc -l < /tmp/dropped.txt)  zhcn=${ZHCN_SEED}->${ZHCN}"
