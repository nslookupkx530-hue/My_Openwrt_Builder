name: Detect Device Arch (DSF 第三方源)
run-name: "Detect Device Arch (DSF 第三方源): ${{ inputs.device }}"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "要检测的设备"
        required: true
        default: all
        type: choice
        options: [all, GL-MT5000, JDC-AX6600]

jobs:
  discover:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - id: m
        shell: bash
        run: |
          set -euo pipefail
          MAP=configs/DSF/device_mapping.conf
          SEL='${{ github.event.inputs.device }}'
          JSON="$(awk -F'|' -v sel="$SEL" '
            /^[[:space:]]*#/ {next} /^[[:space:]]*$/ {next}
            { split($0,a,"="); name=a[1]; gsub(/[[:space:]]/,"",name)
              if (name=="") next
              if (sel!="all" && name!=sel) next
              printf "%s{\"device\":\"%s\",\"repo\":\"%s\",\"branch\":\"%s\",\"seed\":\"%s\",\"profile\":\"%s\"}",
                     (n++?",":""), name, $2, $3, $4, $5 }
          ' "$MAP")"
          echo "matrix={\"include\":[${JSON}]}" >> "$GITHUB_OUTPUT"

  detect:
    needs: discover
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Detect ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Collect facts
        shell: bash
        run: |
          set -uxo pipefail
          DEVICE='${{ matrix.device }}'; REPO='${{ matrix.repo }}'
          BRANCH='${{ matrix.branch }}'; SEED='${{ matrix.seed }}'; PROFILE='${{ matrix.profile }}'
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential gcc make git perl python3 unzip file wget curl \
            libncurses-dev zlib1g-dev libssl-dev 2>/dev/null || true
          rm -rf src
          if ! git clone --depth=1 -b "$BRANCH" "$REPO" src >/dev/null 2>&1; then
            echo "## $DEVICE：克隆失败（分支 $BRANCH）" >> "$GITHUB_STEP_SUMMARY"; exit 1; fi
          cd src
          COMMIT="$(git rev-parse HEAD)"; CDATE="$(git log -1 --format=%cd --date=iso)"
          echo "device=$DEVICE commit=$COMMIT branch=$BRANCH seed=$SEED profile=$PROFILE"
          echo "--- feeds.conf.default ---"; cat feeds.conf.default 2>/dev/null || cat feeds.conf 2>/dev/null || echo "(无)"
          echo "--- 包体系 ---"; ls -d package/system/apk package/system/opkg 2>/dev/null || echo "(都无)"
          echo "--- 版本线索 ---"; grep -m3 -E 'RELEASE|VERSION_NUMBER|VERSION_CODE' include/version.mk 2>/dev/null || true
          echo "--- 内核 ---"; grep -rhE '^KERNEL_PATCHVER|^LINUX_VERSION' target/linux/*/Makefile target/linux/*/*/target.mk 2>/dev/null | head -5
          [ -f "${GITHUB_WORKSPACE}/${SEED}" ] || { echo "!! 种子配置不存在: ${SEED}"; exit 1; }
          cp -f "${GITHUB_WORKSPACE}/${SEED}" .config
          make defconfig >/dev/null 2>&1 || { echo "!! make defconfig 失败"; tail -30 .config; exit 1; }
          BOARD="$(sed -n 's/^CONFIG_TARGET_BOARD="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          SUB="$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          ARCH="$(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          PROF="$(sed -n 's/^CONFIG_TARGET_PROFILE="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          SYM="CONFIG_TARGET_${BOARD}_${SUB}_DEVICE_${PROFILE}"
          DEV_ALL="$(grep -cE '^CONFIG_(TARGET_DEVICE_|TARGET_).*_DEVICE_[A-Za-z0-9_.-]+=y$' .config || true)"
          SYM_OK="$(grep -c "^${SYM}=y" .config || true)"
          ZHCN="$(grep -cE '^CONFIG_PACKAGE_luci-i18n-.*-zh-cn=y' .config || true)"
          ZHCN_SEED="$(grep -cE '^CONFIG_PACKAGE_luci-i18n-.*-zh-cn=y' "${GITHUB_WORKSPACE}/${SEED}" || true)"
          SEL="$(grep -cE '^CONFIG_PACKAGE_.*=y$' .config || true)"
          {
            echo "## $DEVICE"
            echo ""
            echo "- 源: \`$REPO@$BRANCH\`"
            echo "- commit: \`$COMMIT\`  ($CDATE)"
            echo "- target: \`targets/$BOARD/$SUB\`   ARCH_PACKAGES: \`$ARCH\`"
            echo "- profile: \`$PROFILE\`  符号 \`$SYM\` = $([ "$SYM_OK" = 1 ] && echo OK || echo '**不匹配**')"
            echo "- CONFIG_TARGET_PROFILE: \`${PROF:-<无>}\`"
            echo "- 收窄前 device 选项数: **$DEV_ALL**（=1 才不用收窄）"
            echo "- 已选包数: **$SEL**   zh-cn 包: 种子里 $ZHCN_SEED → defconfig 后 **$ZHCN**$([ "$ZHCN_SEED" -gt 0 ] && [ "$ZHCN" = 0 ] && echo '  ⚠️ 全丢，需要 CONFIG_LUCI_LANG_zh_Hans=y')"
            echo ""
            echo "### 种子里有、但本源树不存在的包（会静默丢失）"
            echo '```'
            awk '/^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$/{sub(/^CONFIG_PACKAGE_/,"");sub(/=y$/,"");print}' "${GITHUB_WORKSPACE}/${SEED}" | sort -u > /tmp/seed.txt
            awk '/^CONFIG_PACKAGE_[A-Za-z0-9_.+-]+=y$/{sub(/^CONFIG_PACKAGE_/,"");sub(/=y$/,"");print}' .config | sort -u > /tmp/now.txt
            comm -23 /tmp/seed.txt /tmp/now.txt | sed 's/^/  MISS  /' || true
            echo '```'
            echo ""
            echo "### feed 清单"
            echo '```'
            cat feeds.conf.default 2>/dev/null || echo "(无)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "===== 关键值（便于复制到 device_mapping.conf）====="
          echo "device   : $DEVICE"
          echo "repo     : $REPO"
          echo "branch   : $BRANCH"
          echo "seed     : $SEED"
          echo "target   : targets/$BOARD/$SUB"
          echo "profile  : $PROFILE"
          echo "arch     : $ARCH"
          echo "SYM      : $SYM  (=$SYM_OK)"
