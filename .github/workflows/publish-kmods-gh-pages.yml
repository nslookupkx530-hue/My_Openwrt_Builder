name: Publish Kmods Feed (gh-pages)

# 触发：DSF 构建成功后自动发布；也可手动指定 run-id 补发
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "要补发的构建 run id（留空 = 只重新生成索引）"
        required: false
        default: ""
        type: string
  workflow_run:
    workflows:
      # ⚠️ 这里必须写【workflow 的 name】，不是文件名
      - "OpenWrt Build & Release (DSF 第三方源)"
    types: [completed]

permissions:
  contents: write      # 推 gh-pages
  actions: read        # 读上游 run 的 artifacts

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Resolve run id & version
        id: rid
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RID="${{ github.event.workflow_run.id }}"
          else
            RID="${{ github.event.inputs.run_id }}"
          fi
          VERSION="$(date -u +%Y-%m-%d)-${RID:-${{ github.run_id }}}"
          echo "RID=${RID}"         >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "has_rid=$([ -n "${RID}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo ">>> run=${RID:-<无>}  version=${VERSION}"

      - name: Download artifacts
        if: steps.rid.outputs.has_rid == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.RID }}
          pattern: "*-feed-*"
          path: downloaded

      - name: Check artifacts
        shell: bash
        run: |
          set -euxo pipefail
          echo "=============================="
          echo "Downloaded artifacts"
          echo "=============================="
          if [ -d downloaded ]; then find downloaded -maxdepth 3 -type f | sort; else echo "No artifact found"; fi

      - name: Prepare gh-pages
        shell: bash
        run: |
          set -euxo pipefail
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git ls-remote --heads "${REPO_URL}" gh-pages | grep -q gh-pages; then
            echo "gh-pages 已存在"
            git clone --branch gh-pages --single-branch --depth=1 "${REPO_URL}" gh-pages
          else
            echo "创建 gh-pages"
            mkdir gh-pages && cd gh-pages
            git init -b gh-pages
            git config user.name "github-actions"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "${REPO_URL}"
            echo "# OpenWrt DSF Kmods Feed" > README.md
            git add README.md
            git commit -m "Create gh-pages"
            git push origin gh-pages
            cd ..
          fi

      - name: Publish kmods feed
        shell: bash
        run: |
          set -uxo pipefail
          [ -d downloaded ] || { echo "没有 artifact，跳过发布"; exit 0; }

          for artifact in downloaded/*/; do
            ART="${artifact%/}"; NAME="$(basename "${ART}")"
            case "${NAME}" in
              *-kmods-feed-*)  KIND=kmods;    DEVICE="${NAME%-kmods-feed-*}"  ;;
              *-apk-feed-*)    KIND=packages; DEVICE="${NAME%-apk-feed-*}"    ;;
              *) echo "跳过无关 artifact: ${NAME}"; continue ;;
            esac
            echo ">>> ${KIND} / ${DEVICE}  ← ${NAME}"

            if [ "${KIND}" = "packages" ]; then
              DEST="gh-pages/packages/${DEVICE}/latest"
              rm -rf "${DEST}"; mkdir -p "${DEST}"
              cp -rf "${ART}/." "${DEST}/"
              echo ">>> 发布核心 feed: ${DEST} ($(du -sh "${DEST}" | cut -f1))"
              continue
            fi

            # ---------- kmods ----------
            PDB="$(find "${ART}" -type f -name 'packages.adb' | head -n1 || true)"
            if [ -z "${PDB}" ]; then
              if find "${ART}" -type f -name 'index.json' | grep -q .; then
                echo "::error::${NAME} 只有 index.json、没有 packages.adb，apk 客户端无法直接使用该源"
              else
                echo "::error::${NAME} 既没有 packages.adb 也没有 index.json，无法发布"
              fi
              continue
            fi
            SRC="$(dirname "${PDB}")"
            VER="$(basename "${SRC}")"        # = vermagic

            # latest：清空重建（必须是真拷贝，软链在 gh-pages 上会变成文本文件）
            LATEST="gh-pages/kmods/${DEVICE}/latest"
            rm -rf "${LATEST}"; mkdir -p "${LATEST}"
            find "${SRC}" -maxdepth 1 -type f -exec cp -f {} "${LATEST}/" \;
            echo ">>> latest: ${LATEST}  ($(find "${LATEST}" -maxdepth 1 -name '*.apk' | wc -l) 个 apk, $(du -sh "${LATEST}" | cut -f1))"

            # archive：vermagic 保留在路径里，仍可精确指向某一版
            ARCH="gh-pages/archive/${VERSION}/${DEVICE}/kmods/${VER}"
            rm -rf "${ARCH}"; mkdir -p "${ARCH}"
            find "${SRC}" -maxdepth 1 -type f -exec cp -f {} "${ARCH}/" \;
            echo ">>> archive: ${ARCH}"

            # 清掉旧结构遗留的 kmods/<设备>/<vermagic>/（跑过一次后自然清空）
            find "gh-pages/kmods/${DEVICE}" -mindepth 1 -maxdepth 1 -type d ! -name latest -exec rm -rf {} + 2>/dev/null || true
          done

      - name: Prune old versions (keep 3)
        shell: bash
        run: |
          set -uxo pipefail
          KEEP=3
          prune() {   # $1 = archive 根目录
            [ -d "$1" ] || return 0
            # ⚠️ 必须按【名字】排序，不能按时间：--depth=1 clone 后所有目录 mtime 都=检出时间
            ls -1d "$1"/*/ 2>/dev/null | sort -r | tail -n +$((KEEP+1)) | xargs -r rm -rf
          }
          prune gh-pages/archive
          echo ">>> 剩余 archive:"; ls -1 gh-pages/archive 2>/dev/null || true

      - name: Generate indexes
        shell: bash
        run: |
          set -uxo pipefail
          REPO_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"

          # 通用：为任意目录生成 index.html（列子目录 + 列文件），递归复用
          dir_index() {   # $1=目录  $2=标题  $3=返回上一层的相对链接（可空）
            local d="${1%/}" title="$2" up="$3" f n
            {
              echo "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>${title}</title></head><body>"
              echo "<h1>${title}</h1><ul>"
              for f in "${d}"/*/; do
                [ -d "${f}" ] || continue
                n="$(basename "${f%/}")"
                echo "<li><a href=\"${n}/\">${n}/</a></li>"
              done
              for f in "${d}"/*; do
                [ -f "${f}" ] || continue
                n="$(basename "${f}")"
                [ "${n}" = "index.html" ] && continue
                echo "<li><a href=\"${n}\">${n}</a></li>"
              done
              echo "</ul>"
              [ -n "${up}" ] && echo "<p><a href=\"${up}\">← 上一层</a></p>"
              echo "</body></html>"
            } > "${d}/index.html"
          }

          # 站点根
          {
            echo "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>OpenWrt DSF Feed</title></head><body>"
            echo "<h1>OpenWrt DSF Feed</h1><ul>"
            [ -d gh-pages/kmods ]    && echo "<li><a href=\"kmods/\">kmods/</a></li>"
            [ -d gh-pages/packages ] && echo "<li><a href=\"packages/\">packages/</a></li>"
            [ -d gh-pages/archive ]  && echo "<li><a href=\"archive/\">archive/</a></li>"
            echo "</ul></body></html>"
          } > gh-pages/index.html

          # kmods/<设备>/  与  kmods/<设备>/latest/
          if [ -d gh-pages/kmods ]; then
            dir_index gh-pages/kmods "Kmods Feed" "../"
            for d in gh-pages/kmods/*/; do
              [ -d "${d}" ] || continue
              DEV="$(basename "${d%/}")"
              {
                echo "<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>${DEV} kmods</title></head><body>"
                echo "<h1>${DEV} kmods</h1><ul>"
                [ -d "${d}latest" ] && echo "<li><a href=\"latest/\">latest/</a> — 固件固定源: <code>${REPO_URL}/kmods/${DEV}/latest/packages.adb</code></li>"
                echo "</ul><p><a href=\"../\">← kmods</a></p></body></html>"
              } > "${d}index.html"
              [ -d "${d}latest" ] && dir_index "${d}latest" "${DEV} / latest" "../"
            done
          fi

          # archive 全树：版本层 → 设备层 → 类型层 → vermagic 层（每层都落一个 index.html）
          if [ -d gh-pages/archive ]; then
            dir_index gh-pages/archive "Archive" "../"
            for v in gh-pages/archive/*/; do
              [ -d "${v}" ] || continue
              VNAME="$(basename "${v%/}")"
              dir_index "${v}" "${VNAME}" "../"
              for dev in "${v}"*/; do
                [ -d "${dev}" ] || continue
                dir_index "${dev}" "$(basename "${dev%/}") @ ${VNAME}" "../"
                for kind in "${dev}"*/; do
                  [ -d "${kind}" ] || continue
                  dir_index "${kind}" "$(basename "${kind%/}")" "../"
                  for ver in "${kind}"*/; do
                    [ -d "${ver}" ] || continue
                    dir_index "${ver}" "$(basename "${ver%/}")" "../"
                  done
                done
              done
            done
          fi

      - name: Commit gh-pages
        shell: bash
        working-directory: gh-pages
        run: |
          set -euxo pipefail
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无变化，跳过提交"; exit 0; fi
          # 用孤儿分支单提交覆盖式推送：历史不膨胀，站点内容完全等价
          git checkout --orphan clean-gh-pages
          git add -A
          git commit -m "gh-pages site @ $(date -u +%FT%TZ)"
          git branch -M clean-gh-pages gh-pages
          git push -f origin gh-pages

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Kmods Feed 发布 (${VERSION:-?})"
            echo ""
            echo "- 站点根: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            for d in gh-pages/kmods/*/; do
              [ -d "$d" ] || continue
              DEV="$(basename "${d%/}")"
              echo "- ${DEV} 固定源: \`https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/kmods/${DEV}/latest/packages.adb\`"
            done
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
