name: Scan feeds / apk repos (找缺包的来源)
run-name: "Scan sources: users=[${{ inputs.users }}] repos=[${{ inputs.repos }}] arch=${{ inputs.arch }}"

on:
  workflow_dispatch:
    inputs:
      users:
        description: "扫这些人/组织的全部公开仓库（空格分隔，可留空）"
        required: false
        default: "m0eak fanchmwrt nslookupkx530-hue"
        type: string
      repos:
        description: "直接指定仓库，格式 owner/repo[@分支]（空格分隔）"
        required: false
        default: "nslookupkx530-hue/apk@My"
        type: string
      arch:
        description: "只看这个架构目录（DSF 两台设备都是 arm64-a53）"
        required: false
        default: "arm64-a53"
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-22.04
    steps:
      - name: Scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # 只读扫描：故意不用 -e，避免某个仓库的一条命令把整轮打断
          set -uo pipefail
          USERS='${{ github.event.inputs.users }}'
          REPOS_IN='${{ github.event.inputs.repos }}'
          ARCHDIR='${{ github.event.inputs.arch }}'

          # ================= 1. DSF 还缺的包 =================
          cat > /tmp/need.txt <<'EOF'
          luci-app-passwall2
          luci-app-mosdns
          luci-app-turboacc
          luci-app-athena-led
          luci-app-aurora-config
          luci-theme-aurora
          luci-theme-shadcn
          easytier
          v2dat
          amneziawg-tools
          default-settings-m0eak
          EOF

          api() { curl -sSL --max-time 60 -H "Authorization: Bearer ${GH_TOKEN}" \
                    -H 'Accept: application/vnd.github+json' "$1" 2>/dev/null || true; }
          tree_of() {   # $1=owner/repo  $2=ref
            api "https://api.github.com/repos/$1/git/trees/$2?recursive=1" \
              | grep -oE '"path"[[:space:]]*:[[:space:]]*"[^"]+"' \
              | sed -E 's/.*"([^"]+)"[[:space:]]*$/\1/' || true
          }

          : > /tmp/summary.txt
          : > /tmp/detail.txt

          # ================= 2. 组装待扫清单 owner/repo@ref =================
          LIST=""
          for R in ${REPOS_IN}; do LIST="${LIST} ${R}"; done
          for U in ${USERS}; do
            for PG in 1 2 3; do
              P="$(api "https://api.github.com/users/${U}/repos?per_page=100&page=${PG}&type=all" \
                   | grep -oE '"full_name":[[:space:]]*"[^"]+"' | sed -E 's/.*"([^"]+)"$/\1/' || true)"
              [ -n "${P}" ] || break
              for r in ${P}; do LIST="${LIST} ${r}"; done
            done
          done
          LIST="$(printf '%s\n' ${LIST} | sort -u | head -120)"
          echo ">>> 待扫仓库: $(printf '%s\n' "${LIST}" | grep -c . || true) 个  (arch=${ARCHDIR})"

          # ================= 3. 逐个仓库扫 =================
          for ITEM in ${LIST}; do
            R="${ITEM%@*}"; REF="${ITEM##*@}"; [ "${REF}" = "${ITEM}" ] && REF="HEAD"
            TREE="$(tree_of "${R}" "${REF}")"
            if [ -z "${TREE}" ] && [ "${REF}" != "HEAD" ]; then
              echo "    ${R}@${REF}: 取不到 → 退回 HEAD"
              REF="HEAD"; TREE="$(tree_of "${R}" "HEAD")"
            fi
            [ -n "${TREE}" ] || { echo "    ${R}: 取不到 tree（私有/不存在？）"; continue; }
            printf '%s\n' "${TREE}" > /tmp/tree.txt

            # ---- 类型判断 ----
            KIND="源码feed"
            grep -qE '\.apk$'       /tmp/tree.txt && KIND="apk仓库"
            grep -qF 'packages.adb' /tmp/tree.txt && KIND="${KIND}+有索引(packages.adb)"
            grep -qF 'feeds.conf'   /tmp/tree.txt && KIND="${KIND}+含feeds.conf"
            grep -qE '/Makefile$'   /tmp/tree.txt && KIND="${KIND}+有Makefile"

            # ---- apk 仓库：只看 run/<arch>/（openwrt/ 是给官方 OpenWrt 的，DSF 不碰）----
            AAPK="$(grep -cE "^run/${ARCHDIR}/.*\.apk$" /tmp/tree.txt 2>/dev/null || true)"
            if [ -n "${AAPK}" ] && [ "${AAPK}" -gt 0 ] 2>/dev/null; then
              echo "  --- ${R}@${REF}: run/${ARCHDIR} 下共 ${AAPK} 个 apk，按包组统计 ---"
              grep -oE "^run/${ARCHDIR}/[^/]+/" /tmp/tree.txt | sort | uniq -c | sort -rn | head -60 | sed 's/^/      /' || true
              echo "      [包组] $(grep -oE "^run/${ARCHDIR}/[^/]+/" /tmp/tree.txt | sort -u | tr '\n' ' ')"
            fi

            # ---- 逐包匹配 ----
            HITN=0; HITS=""
            while read -r p; do
              [ -n "${p}" ] || continue
              if grep -qF "/${p}/" /tmp/tree.txt \
                 || grep -qE "/${p}-[0-9]" /tmp/tree.txt \
                 || grep -qE "/${p}[^/]*\.apk$" /tmp/tree.txt; then
                HITN=$((HITN+1)); HITS="${HITS} ${p}"

                # 命中路径：优先 run/<arch>/，其次 run/，最后整体（全部 || true，失败不影响）
                ALL="$(grep -E "/${p}/|/${p}-[0-9]|/${p}[^/]*\.apk$" /tmp/tree.txt | head -8 | paste -sd' ' - || true)"
                P2="$(printf '%s\n' "${ALL}" | tr ' ' '\n' | grep -E "^run/${ARCHDIR}/" | head -8 | paste -sd' ' - || true)"
                [ -n "${P2}" ] || P2="$(printf '%s\n' "${ALL}" | tr ' ' '\n' | grep -E '^run/' | head -5 | paste -sd' ' - || true)"
                [ -n "${P2}" ] || P2="${ALL}"
                printf '%-36s %-26s %s\n' "${R}@${REF}" "${p}" "${P2}" >> /tmp/detail.txt
                continue
              fi

              # 退一步：包名首段模糊匹配（排除 luci/kmod/lib 这类太通用的前缀）
              alt="${p%%-*}"
              case "${alt}" in luci|kmod|lib|app|base|default) alt="" ;; esac
              if [ -n "${alt}" ] && grep -qF "/${alt}/" /tmp/tree.txt; then
                HITN=$((HITN+1)); HITS="${HITS} (疑似)${p}"
                FP="$(grep -F "/${alt}/" /tmp/tree.txt | grep -E "^run/${ARCHDIR}/" | head -5 | paste -sd' ' - || true)"
                [ -n "${FP}" ] || FP="$(grep -F "/${alt}/" /tmp/tree.txt | head -5 | paste -sd' ' - || true)"
                printf '%-36s %-26s (疑似) %s\n' "${R}@${REF}" "${p}" "${FP}" >> /tmp/detail.txt
              fi
            done < /tmp/need.txt

            if [ "${HITN}" -gt 0 ]; then
              echo "★ ${R}@${REF}  [${KIND}]  命中 ${HITN}/11 →${HITS}"
              printf '| `%s` | `%s` | %s | %s |\n' "${R}" "${REF}" "${KIND}" "${HITS}" >> /tmp/summary.txt
            else
              echo "    ${R}@${REF}  [${KIND}]  无命中"
            fi
          done

          # ================= 4. Job Summary =================
          {
            echo "## 扫描结果（arch=${ARCHDIR}）"
            echo ""
            echo "| 仓库 | ref | 类型 | 命中的包 |"
            echo "|---|---|---|---|"
            cat /tmp/summary.txt 2>/dev/null || true
            echo ""
            echo "### 命中路径明细（只列 run/ 相关）"
            echo '```'
            cat /tmp/detail.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo ">>> 扫描完成"
