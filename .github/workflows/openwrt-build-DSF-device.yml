name: OpenWrt Build & DSF-Release
run-name: OpenWrt Build & DSF-Release - ${{ inputs.target_device }}

# ============================================================================
# 服务设备：GL-MT5000 (m0eak/fanchmwrt) / JDC-AX6600 (m0eak/libwrt)
# 与 openwrt-build-device.yml 的关键差异：
#   1) 源是第三方：仓库/分支/种子配置由 configs/DSF/device_mapping.conf 决定
#   2) 官方没有这两个 target 的 releases/snapshots → 不用 config.buildinfo 基线，
#      改用你自带的种子 .config（defconfig 展开 + 收窄到单设备）
#   3) 不引用官方 kmods 源：自己的 kmod 库＝构建产物
#      bin/targets/<target>/<subtarget>/kmods/<vermagic>/（随 Artifact/Release 发布）
#   4) 镜像组装会遍历整个 subtarget（filogic 尤甚）→ 保留"缺工件占位+重试"自愈，
#      本文件只服务这两个设备，所以无条件启用，不做设备门控
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: "目标设备"
        required: true
        default: 'GL-MT5000'
        type: choice
        options:
          - JDC-AX6600
          - GL-MT5000
      source_ref:
        description: "覆盖映射表里的分支/tag（留空 = 用 configs/DSF/device_mapping.conf 里的值）"
        required: false
        default: ""
        type: string
      custom_packages:
        description: "额外第三方包（空格分隔，可选）"
        required: false
        default: ""
        type: string
      make_jobs:
        description: "并行度（-j3 较稳；-j$(nproc) 最快但有 OOM 风险）"
        required: false
        default: '-j3'
        type: choice
        options:
          - '-j2'
          - '-j3'
          - '-j4'
      third_party_apk:
        description: "是否额外拉取第三方预编译 apk（源自带这些包时保持 off）"
        required: true
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'

permissions:
  contents: write        # 建 Release 必需

concurrency:
  group: build-dsf-${{ github.event.inputs.target_device }}
  cancel-in-progress: false

env:
  WORKSPACE: ${{ github.workspace }}
  TARGET_DEVICE: ${{ github.event.inputs.target_device }}
  SOURCE_REF: ${{ github.event.inputs.source_ref }}
  CUSTOM_PACKAGE_EXTRA: ${{ github.event.inputs.custom_packages }}
  MAKE_JOBS: ${{ github.event.inputs.make_jobs }}
  THIRD_PARTY_APK: ${{ github.event.inputs.third_party_apk }}

jobs:
  build:
    name: Build ${{ github.event.inputs.target_device }} (DSF)
    runs-on: ubuntu-22.04
    env:
      WORKSPACE: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Syntax check shell scripts
        shell: bash
        run: |
          set -euxo pipefail
          FAIL=0
          check_bash() {
              [ -f "$1" ] || return 0
              if grep -q $'\r' "$1"; then echo "FAIL $1 含 CRLF"; FAIL=1; return 0; fi
              if bash -n "$1" 2>&1; then echo "OK(bash) $1"; else echo "FAIL(bash) $1"; FAIL=1; fi
          }
          check_sh() {
              [ -f "$1" ] || return 0
              if grep -q $'\r' "$1"; then echo "FAIL $1 含 CRLF"; FAIL=1; return 0; fi
              if sh -n "$1" 2>&1; then echo "OK(sh)   $1"; else echo "FAIL(sh) $1"; FAIL=1; fi
          }
          for f in shell/*.sh; do check_bash "$f"; done
          for f in "files/${TARGET_DEVICE:-GL-MT5000}/etc/uci-defaults/"*; do check_sh "$f"; done
          for f in files/etc/uci-defaults/*; do check_sh "$f"; done
          for f in files/etc/init.d/*; do check_sh "$f"; done
          for f in files/etc/third-party/*.sh files/etc/ithird-party/*.sh; do check_sh "$f"; done
          [ "$FAIL" = "0" ] || { echo "存在语法错误，请先修复"; exit 1; }

      - name: Cache OpenWrt downloads (dl)
        uses: actions/cache@v4
        with:
          path: dl-cache
          key: dl-dsf-${{ github.event.inputs.target_device }}-${{ github.run_id }}
          restore-keys: |
            dl-dsf-${{ github.event.inputs.target_device }}-
            dl-dsf-

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang autoconf automake libtool bison flex gawk gettext git file swig \
            python3 python3-pip python3-mako rsync unzip wget curl zstd dos2unix texinfo perl \
            libncurses-dev zlib1g-dev libssl-dev libffi-dev libreadline-dev \
            libsqlite3-dev libcap-dev libgd-dev libjpeg-dev libpng-dev \
            libcurl4-gnutls-dev libxml2-dev libxslt-dev qemu-utils

      # ======================================================================
      # 设备元信息：源 URL / 分支 / 种子配置 / target / profile
      # ======================================================================
      - name: Resolve device meta (configs/DSF/device_mapping.conf)
        shell: bash
        run: |
          set -euxo pipefail
          MAP="${WORKSPACE}/configs/DSF/device_mapping.conf"
          [ -f "${MAP}" ] || { echo "ERROR: 找不到 ${MAP}"; exit 1; }
          LINE="$(grep -E "^[[:space:]]*${TARGET_DEVICE}=" "${MAP}" | head -n1 || true)"
          [ -n "${LINE}" ] || { echo "ERROR: ${MAP} 里没有 ${TARGET_DEVICE}"; exit 1; }
          VAL="${LINE#*=}"
          REPO_URL="$(printf '%s' "${VAL}" | awk -F'|' '{print $1}' | tr -d '[:space:]')"
          REPO_BRANCH="$(printf '%s' "${VAL}" | awk -F'|' '{print $2}' | tr -d '[:space:]')"
          SEED_CONFIG="$(printf '%s' "${VAL}" | awk -F'|' '{print $3}' | tr -d '[:space:]')"
          TARGET_PATH="$(printf '%s' "${VAL}" | awk -F'|' '{print $4}' | tr -d '[:space:]' | sed 's#^targets/##')"
          PROFILE="$(printf '%s' "${VAL}" | awk -F'|' '{print $5}' | tr -d '[:space:]')"
          [ -n "${REPO_URL}" ] && [ -n "${SEED_CONFIG}" ] && [ -n "${PROFILE}" ] \
            || { echo "ERROR: 映射表字段不全（需要 源URL|分支|种子配置|target|profile）: ${VAL}"; exit 1; }
          [ -f "${WORKSPACE}/${SEED_CONFIG}" ] || { echo "ERROR: 种子配置不存在: ${SEED_CONFIG}"; exit 1; }
          if [ -n "${SOURCE_REF:-}" ]; then
            echo ">>> source_ref 覆盖分支: ${REPO_BRANCH} → ${SOURCE_REF}"
            REPO_BRANCH="${SOURCE_REF}"
          fi
          echo ">>> device=${TARGET_DEVICE}"
          echo ">>> repo=${REPO_URL}  branch=${REPO_BRANCH}"
          echo ">>> seed=${SEED_CONFIG}  target=${TARGET_PATH}  profile=${PROFILE}"
          {
            echo "REPO_URL=${REPO_URL}"
            echo "REPO_BRANCH=${REPO_BRANCH}"
            echo "SEED_CONFIG=${SEED_CONFIG}"
            echo "DSF_TARGET_PATH=${TARGET_PATH}"
            echo "PROFILE=${PROFILE}"
          } >> "$GITHUB_ENV"

      - name: Clone Source Repository
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf src
          echo ">>> git clone --depth=1 -b ${REPO_BRANCH} ${REPO_URL}"
          git clone --depth=1 -b "${REPO_BRANCH}" "${REPO_URL}" src \
            || { echo "ERROR: 克隆失败（分支/tag: ${REPO_BRANCH}）"; exit 1; }
          [ -f src/Makefile ] && [ -d src/target/linux ] || { echo "ERROR: src 不是 OpenWrt 源码树"; exit 1; }
          git -C src log -1 --format='>>> 源码: %H  %cd  %s' --date=iso
          echo ">>> 当前分支: $(git -C src rev-parse --abbrev-ref HEAD)"
          {
            echo "SRC_COMMIT=$(git -C src rev-parse HEAD)"
            echo "SRC_BRANCH=$(git -C src rev-parse --abbrev-ref HEAD)"
            echo "SRC_DATE=$(git -C src log -1 --format=%cd --date=iso)"
          } >> "$GITHUB_ENV"
          echo ">>> feeds.conf.default:"
          cat src/feeds.conf.default 2>/dev/null || echo "  (无 feeds.conf.default)"

      - name: Prepare dl cache link & clean build dirs
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          rm -rf staging_dir build_dir tmp dl
          mkdir -p "${GITHUB_WORKSPACE}/dl-cache"
          ln -sfn "${GITHUB_WORKSPACE}/dl-cache" dl
          ls -ld dl "${GITHUB_WORKSPACE}/dl-cache"

      # ======================================================================
      # feeds：第三方源各有自己的 feeds.conf.default，这里不做任何"按源禁用"，
      #        全部按源码自带清单 update/install；清理列表沿用（路径不存在则跳过）
      # ======================================================================
      - name: Update & Install feeds
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          echo ">>> 本次使用的 feed 清单:"
          cat feeds.conf.default 2>/dev/null || cat feeds.conf 2>/dev/null || echo "  (无)"

          rm -rf ./feeds ./data/feeds-*.tmp ./package/feeds
          for i in 1 2 3; do
            ./scripts/feeds update -a && break || { echo "feeds update 失败，重试 ${i}/3"; sleep 5; }
          done
          ./scripts/feeds install -a

          # ---- 清理收尾（必须在最后一次 feeds install -a 之后）----
          for p in \
            feeds/luci/applications/luci-app-bmx7 \
            feeds/luci/applications/luci-app-babeld \
            feeds/luci/applications/luci-app-librespeed \
            feeds/packages/bmx7-dnsupdate \
            feeds/packages/prometheus-node-exporter-lua \
            feeds/telephony/net/rtpengine \
            feeds/telephony/libs/dahdi-linux \
            feeds/telephony/libs/oslec \
            package/devel/perf \
            feeds/packages/net/batctl \
            feeds/packages/libs/libpfring \
            feeds/packages/admin/netatop ; do
            for q in "$p" "package/$p"; do
              if [ -e "$q" ] || [ -L "$q" ]; then echo ">>> 移除: $q"; rm -rf "$q"; fi
            done
          done
          echo ">>> feeds 阶段完成"

      # ======================================================================
      # 组装 .config：种子 → defconfig → 收窄单设备 → zh-cn 兜底 → 断言
      # ======================================================================
      - name: Seed & trim configuration (DSF)
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          bash ../shell/dsf_seed_config.sh "${SEED_CONFIG}" "${PROFILE}"
          test -f .config || { echo "ERROR: .config 未生成"; exit 1; }

      - name: Apply custom files (common + device)
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_DIR="${WORKSPACE}/src"
          REPO_FILES_DIR="${WORKSPACE}/files"
          FIRMWARE_FILES_DIR="${SOURCE_DIR}/files"
          mkdir -p "${FIRMWARE_FILES_DIR}"

          if [ -d "${REPO_FILES_DIR}/etc" ]; then
            cp -af "${REPO_FILES_DIR}/etc" "${FIRMWARE_FILES_DIR}/"
            echo ">>> 已应用公共 overlay: files/etc"
          fi
          [ -d "${REPO_FILES_DIR}/${TARGET_DEVICE}" ] || { echo "ERROR: 找不到设备目录 files/${TARGET_DEVICE}"; exit 1; }
          cp -af "${REPO_FILES_DIR}/${TARGET_DEVICE}/." "${FIRMWARE_FILES_DIR}/"
          echo ">>> 已应用设备 overlay: files/${TARGET_DEVICE}"

          if [ -d "${FIRMWARE_FILES_DIR}/etc/ithird-party" ] && [ ! -d "${FIRMWARE_FILES_DIR}/etc/third-party" ]; then
            mv "${FIRMWARE_FILES_DIR}/etc/ithird-party" "${FIRMWARE_FILES_DIR}/etc/third-party"
            echo ">>> 已重命名 etc/ithird-party → etc/third-party"
          fi

          NET_CONF="${FIRMWARE_FILES_DIR}/etc/uci-defaults/99-custom-network"
          if [ ! -f "${NET_CONF}" ]; then
            echo "ERROR: 缺少 ${NET_CONF}（应来自 files/${TARGET_DEVICE}/）"
            find "${REPO_FILES_DIR}/${TARGET_DEVICE}" -maxdepth 4 -printf '%y %p\n' 2>/dev/null | sort || true
            exit 1
          fi
          chmod 0755 "${FIRMWARE_FILES_DIR}/etc/uci-defaults/"* 2>/dev/null || true
          [ -f "${FIRMWARE_FILES_DIR}/etc/init.d/apk-install" ] && chmod 0755 "${FIRMWARE_FILES_DIR}/etc/init.d/apk-install" || true
          [ -d "${FIRMWARE_FILES_DIR}/etc/third-party" ] && chmod 0755 "${FIRMWARE_FILES_DIR}/etc/third-party/"* || true

          # 只有启用 docker 才打包 docker 防火墙脚本
          UCI_DOCKER="${FIRMWARE_FILES_DIR}/etc/uci-defaults/99-docker-firewall"
          if grep -qE '^[[:space:]]*ENABLE_DOCKER=[1yY]' "${WORKSPACE}/configs/plugins.cfg" 2>/dev/null \
             || grep -qxF 'CONFIG_PACKAGE_docker' "${SOURCE_DIR}/tmp/injected-plugins.txt" 2>/dev/null; then
            echo ">>> ENABLE_DOCKER=1 → 打包 99-docker-firewall"
          else
            rm -f "${UCI_DOCKER}"
            echo ">>> 未启用 docker → 已移除 99-docker-firewall"
          fi
          echo ">>> 网络配置预览:"; cat "${NET_CONF}"

      # ======================================================================
      # 第三方预编译 apk（默认 off：这两个源自带大部分包）
      # ======================================================================
      - name: Fetch third-party APK (optional)
        if: ${{ github.event.inputs.third_party_apk == 'on' }}
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}"
          SRC_DIR="${WORKSPACE}/src" \
          OUT_DIR="${WORKSPACE}/src/packages" \
          APK_REPO_PREFIX="openwrt" \
          bash shell/fetch-openwrt-third-party.sh

      - name: Install Third-Party APKs into image (optional)
        if: ${{ github.event.inputs.third_party_apk == 'on' }}
        shell: bash
        run: |
          set -euxo pipefail
          OPENWRT_DIR="${WORKSPACE}/src"
          FIRMWARE_FILES_DIR="${OPENWRT_DIR}/files"
          REPO_FILES_DIR="${WORKSPACE}/files"
          APK_SOURCE_DIR="${OPENWRT_DIR}/packages"
          mkdir -p "${FIRMWARE_FILES_DIR}/usr/share/third-party" "${FIRMWARE_FILES_DIR}/etc/third-party" \
                   "${FIRMWARE_FILES_DIR}/etc/init.d" "${FIRMWARE_FILES_DIR}/etc/rc.d"
          APK_COUNT="$(find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' | wc -l)"
          [ "${APK_COUNT}" -gt 0 ] || { echo "ERROR: ${APK_SOURCE_DIR} 里没有 apk"; exit 1; }
          find "${APK_SOURCE_DIR}" -maxdepth 1 -type f -name '*.apk' \
            -exec cp -f {} "${FIRMWARE_FILES_DIR}/usr/share/third-party/" \;
          echo ">>> 已拷入 ${APK_COUNT} 个第三方 apk"
          SRC_INIT="$(find "${REPO_FILES_DIR}" -type f -name 'apk-install' -print -quit 2>/dev/null || true)"
          SRC_INSTALLER="$(find "${REPO_FILES_DIR}" -type f -name 'install_third_party_apk.sh' -print -quit 2>/dev/null || true)"
          DST_INIT="${FIRMWARE_FILES_DIR}/etc/init.d/apk-install"
          DST_INSTALLER="${FIRMWARE_FILES_DIR}/etc/third-party/install_third_party_apk.sh"
          [ -f "${DST_INIT}" ]      || { [ -n "${SRC_INIT}" ]      && install -m 0755 "${SRC_INIT}" "${DST_INIT}"; }
          [ -f "${DST_INSTALLER}" ] || { [ -n "${SRC_INSTALLER}" ] && install -m 0755 "${SRC_INSTALLER}" "${DST_INSTALLER}"; }
          chmod 0755 "${DST_INIT}" "${DST_INSTALLER}" 2>/dev/null || true
          ln -sf ../init.d/apk-install "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"
          ls -l "${FIRMWARE_FILES_DIR}/etc/rc.d/S99apk-install"

      # ======================================================================
      # Finalize：再 defconfig 一次 + 校验收窄没被打破 + 范围诊断
      # ======================================================================
      - name: Finalize Configuration (defconfig + 校验)
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          make defconfig

          DEV_ON="$(grep -cE '^CONFIG_(TARGET_DEVICE_|TARGET_).*_DEVICE_[A-Za-z0-9_.-]+=y$' .config || true)"
          echo ">>> Finalize 后已启用 device 选项数: ${DEV_ON}  (期望 1)"
          grep -E '^CONFIG_(TARGET_DEVICE_|TARGET_).*_DEVICE_[A-Za-z0-9_.-]+=y$' .config | sed 's/^/    /' || true
          [ "${DEV_ON}" = "1" ] || { echo "ERROR: 收窄被第二次 defconfig 打破（${DEV_ON} 台）"; exit 1; }

          SEL_ON="$(grep -c '^CONFIG_PACKAGE_.*=y' .config || true)"
          MENU_ON="$(grep -cE '^[[:space:]]*config[[:space:]]+PACKAGE_' tmp/.config-package.in || true)"
          echo ">>> [诊断] 已选包数: ${SEL_ON}   菜单可见包数: ${MENU_ON}"
          echo ">>> [诊断] ALL 系列: $(grep -E '^CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED)=' .config || echo '(未启用)')"
          if [ "${SEL_ON}" -gt 1500 ]; then
            echo "::warning::已选包数 ${SEL_ON} 偏多，可能把整个 feed 都编了"
          fi
          echo ">>> ARCH_PACKAGES = $(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
          echo ">>> 内核版本线索  = $(grep -m1 '^CONFIG_LINUX_' .config || true)"

          # 有注入/裁剪清单才校验（DSF 默认没有这两个文件）
          awk '/^CONFIG_PACKAGE_[^=]*=y$/{sub(/=y$/,"");print}' .config | tr -d '[:blank:]' | sort -u > tmp/enabled-symbols.txt
          echo ">>> 已启用 CONFIG_PACKAGE_* 数量: $(wc -l < tmp/enabled-symbols.txt)"
          for f in tmp/injected-plugins.txt tmp/trimmed-options.txt; do
            [ -s "$f" ] && echo ">>> 发现 $f（$(wc -l < "$f") 行），如需强制校验请自行加断言" || echo ">>> 无 $f（跳过）"
          done
          echo ">>> 配置校验通过"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"

          DATE_UTC="$(date -u +%F)"
          TAG="${TARGET_DEVICE}-DSF-${DATE_UTC}-${{ github.run_id }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo ">>> tag=${TAG}"

          {
            echo "device      : ${TARGET_DEVICE}"
            echo "repo        : ${REPO_URL}"
            echo "branch      : ${REPO_BRANCH}"
            echo "src_commit  : ${SRC_COMMIT:-$(git rev-parse HEAD)}"
            echo "src_branch  : ${SRC_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
            echo "src_date    : ${SRC_DATE:-$(git log -1 --format=%cd --date=iso)}"
            echo "target      : ${DSF_TARGET_PATH}"
            echo "profile     : ${PROFILE}"
            echo "seed_config : ${SEED_CONFIG}"
            echo "arch_packages: $(sed -n 's/^CONFIG_TARGET_ARCH_PACKAGES="\?\([^"]*\)"\?$/\1/p' .config | head -n1)"
            echo "build_time  : $(date -u '+%F %T UTC')"
            echo "run_id      : ${{ github.run_id }}"
            echo "config_md5  : $(md5sum .config | cut -d' ' -f1)"
            echo "kmods_repo  : 本构建产物 bin/targets/${DSF_TARGET_PATH}/kmods/<vermagic>/（发布后即为自有 kmod 库）"
          } > "${WORKSPACE}/BUILDINFO.txt"

          PLIST="$(mktemp)"
          grep -E '^CONFIG_PACKAGE_luci[A-Za-z0-9._-]*=y$' .config \
            | grep -v '_INCLUDE_' | grep -vx 'CONFIG_PACKAGE_luci' \
            | sed -e 's/^CONFIG_PACKAGE_//' -e 's/=y$//' >> "${PLIST}" || true
          if [ -f tmp/injected-plugins.txt ]; then
            grep -v '^CONFIG_PACKAGE_luci' tmp/injected-plugins.txt | sed 's/^CONFIG_PACKAGE_//' >> "${PLIST}" || true
          fi
          sort -u "${PLIST}" -o "${PLIST}"
          echo ">>> LuCI/插件条目数: $(wc -l < "${PLIST}")"

          {
            echo "OpenWrt automated build release (DSF 第三方源)"
            echo
            echo "Device:"
            echo
            echo "${TARGET_DEVICE}"
            echo
            echo "Source:"
            echo
            echo "${REPO_URL}"
            echo "branch ${REPO_BRANCH}  commit ${SRC_COMMIT:-unknown}"
            echo "target ${DSF_TARGET_PATH}  profile ${PROFILE}"
            echo
            echo "Run ID:"
            echo
            echo "${{ github.run_id }}"
            echo
            echo "LuCI package list"
            echo
            echo "${TARGET_DEVICE}"
            echo
            sed 's/^/- /' "${PLIST}" || true
            echo
            echo "Third-Party package list"
            echo
            printf '%s\n' "${CUSTOM_PACKAGES:-}" | tr ' ' '\n' | sed '/^$/d' | sort | sed 's/^/- /'
            echo
            echo "自建 Kmod 库"
            echo
            echo "本固件内核与官方不同源，官方 kmods 源不可用；"
            echo "自有 kmod 库来自本次构建产物 bin/targets/${DSF_TARGET_PATH}/kmods/<vermagic>/。"
          } > "${WORKSPACE}/release-notes.md"
          rm -f "${PLIST}"
          echo ">>> release-notes.md 预览:"; cat "${WORKSPACE}/release-notes.md"

      - name: Prepare build download
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          make download -j"$(nproc)" 2>&1 | tee build_download.log || {
            echo ">>> 并行下载失败，降级单线程重试一次"
            make download -j1 V=s 2>&1 | tee -a build_download.log
          }
          grep -Ei "error|warning" build_download.log || true

      - name: Build firmware
        shell: bash
        # step 超时 < job 超时：step 超时=失败（诊断步骤会跑）；job 超时=取消（诊断不跑）
        timeout-minutes: 300
        run: |
          set -uo pipefail
          cd "${WORKSPACE}/src" || { echo "::error::源码目录不存在"; exit 1; }

          echo ">>> 本次构建: device=${TARGET_DEVICE:-?} repo=${REPO_URL:-?}@${REPO_BRANCH:-?} target=${DSF_TARGET_PATH:-?} profile=${PROFILE:-?}"
          echo ">>> [诊断] DEV_ON=$(grep -cE '^CONFIG_(TARGET_DEVICE_|TARGET_).*_DEVICE_[A-Za-z0-9_.-]+=y$' .config || true)  SEL_ON=$(grep -cE '^CONFIG_PACKAGE_.*=y$' .config || true)"
          echo ">>> 磁盘:"; df -h / /home 2>/dev/null || true
          echo ">>> inode:"; df -i / /home 2>/dev/null || true

          export MAKEFLAGS="${MAKE_JOBS:--j3}"
          printf 'all:\n\t@echo "MAKEFLAGS=${MAKEFLAGS} OK"\n' > /tmp/mf-check.mk
          if ! make -f /tmp/mf-check.mk all; then
            echo "::error::MAKEFLAGS='${MAKEFLAGS}' 被 make 拒绝"; exit 2
          fi

          echo ">>> 开始编译 (CPU=$(nproc), MAKEFLAGS=${MAKEFLAGS})"
          set +e
          rm -f build.log
          make 2>&1 | tee build.log
          BUILD_RC=${PIPESTATUS[0]}

          # ==================================================================
          # 失败自愈（本文件只服务这两个设备，无条件启用）
          #   1) 若是"未选中设备缺 staging 工件"（filogic 镜像组装会遍历整个
          #      subtarget）→ 0 字节占位 + 增量重试，最多 20 轮
          #   2) 其它情况 → 降级 -j1 串行重试一次
          # 注意：缺失路径只能从 V=s 的重跑日志里抓，非 verbose 的 build.log
          #       不含该错误文本（实测）
          # ==================================================================
          if [ "${BUILD_RC}" -ne 0 ]; then
            export MAKEFLAGS="-j1"
            echo "::warning::构建失败（exit ${BUILD_RC}），进入占位自愈循环"
            for i in $(seq 1 20); do
              echo "::warning::第 ${i} 轮：重跑 target/linux/install (V=s) 定位缺失工件"
              echo "===== 组装重试 ${i} $(date -u +%F' '%TZ) =====" >> build.log
              make -j1 target/linux/install V=s > "/tmp/asm-${i}.log" 2>&1
              RC2=$?
              cat "/tmp/asm-${i}.log" >> build.log
              if [ "${RC2}" -eq 0 ]; then echo ">>> 组装通过（第 ${i} 轮）"; BUILD_RC=0; break; fi

              MISS="$(grep -oE 'can not open input file [^[:space:]]+' "/tmp/asm-${i}.log" | tail -n1 | awk '{print $NF}')"
              if [ -z "${MISS}" ]; then
                echo ">>> 第 ${i} 轮失败但不是'缺输入文件'型 → 降级 -j1 全量重试一次"
                tail -40 "/tmp/asm-${i}.log" || true
                echo "===== -j1 全量重试 $(date -u +%F' '%TZ) =====" >> build.log
                make V=s 2>&1 | tee -a build.log
                BUILD_RC=${PIPESTATUS[0]}
                break
              fi
              case "${MISS}" in
                */staging_dir/*) : ;;
                *) echo "::error::缺失路径不在 staging_dir 下，拒绝占位: ${MISS}"; BUILD_RC="${RC2}"; break ;;
              esac
              # 目标设备自己的产物绝不占位（用 profile key 与 target 名双重判断）
              case "${MISS}" in
                *"${PROFILE}"*|*"${TARGET_DEVICE}"*)
                  echo "::error::缺的是目标设备自己的工件，不能占位: ${MISS}"; BUILD_RC="${RC2}"; break ;;
              esac
              echo ">>> 第 ${i} 轮缺失: ${MISS}  → 建 0 字节占位"
              mkdir -p "$(dirname "${MISS}")" && : > "${MISS}" || { BUILD_RC="${RC2}"; break; }
            done
          fi

          set -e
          echo ">>> build.log 行数=$(wc -l < build.log) 大小=$(du -h build.log | cut -f1)"
          echo "make exit code: ${BUILD_RC}"
          if [ "${BUILD_RC}" -ne 0 ]; then
            echo "::error::编译失败（exit ${BUILD_RC}），详细原因见 Diagnose build failure"
            exit "${BUILD_RC}"
          fi
          echo ">>> 编译成功"

      - name: Diagnose build failure
        if: failure()
        continue-on-error: true
        shell: bash
        timeout-minutes: 45
        env:
          WS: ${{ github.workspace }}
        run: |
          set +e
          shopt -s nullglob
          SRC="${WS}/src"; [ -d "${SRC}/target" ] || SRC="${WS}"
          cd "${SRC}" || exit 0
          echo ">>> SRC=${SRC}"
          echo "::group::资源"
          df -h / /home /tmp 2>/dev/null; echo "--- inode ---"; df -i / /home 2>/dev/null
          free -h
          sudo -n dmesg 2>/dev/null | grep -iE 'out of memory|killed process' | tail -20 || echo "(无 OOM)"
          echo "::endgroup::"
          for f in "$SRC/build.log" "$WS/build.log"; do
            [ -s "$f" ] && { echo ">>> 主日志: $f ($(wc -l < "$f") 行)"; LOG="$f"; }
          done
          if [ -n "${LOG:-}" ]; then
            echo "::group::主日志尾部"
            grep -nE "ERROR: (package|target)/|failed to build|make\[[0-9]+\]: \*\*\*" "$LOG" | tail -30 || echo "(无)"
            tail -60 "$LOG"
            echo "::endgroup::"
          fi
          echo "::group::复现 target/linux/install (V=s)"
          timeout --signal=TERM 1500 make -j1 target/linux/install V=s > /tmp/img-vs.log 2>&1
          echo ">>> 退出码 = $?  (0=竞态/已成过, 1=命令失败, 2=make 用法错误, 124=超时, 137=SIGKILL)"
          grep -nE "can not open input file|Error [0-9]|make\[[0-9]+\]: \*\*\*|No space|Killed" /tmp/img-vs.log | tail -30 || echo "(无)"
          tail -40 /tmp/img-vs.log
          echo "::endgroup::"
          echo "::group::产物与暂存"
          du -sh bin build_dir staging_dir tmp 2>/dev/null
          ls -la bin/targets/*/*/ 2>/dev/null | tail -40
          echo "##### staging_dir 下的 u-boot/fip/preloader 产出 #####"
          find staging_dir -path '*/image/*' -type f \
            \( -iname '*u-boot*' -o -iname '*fip*' -o -iname '*preloader*' \) 2>/dev/null | head -60 || true
          find staging_dir -path '*/image/*' -type f 2>/dev/null | wc -l
          echo "::endgroup::"
          cp -f /tmp/img-vs.log "${WS}/img-vs.log" 2>/dev/null || true
          {
            echo "## 构建失败诊断 (${TARGET_DEVICE:-?})"
            echo ""
            echo "- 源: ${REPO_URL:-?}@${REPO_BRANCH:-?}"
            echo "- 复现退出码: 见上方"
            echo '```'
            free -h; df -h / /home
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload build logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dsf-logs-${{ github.event.inputs.target_device }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ github.workspace }}/src/build.log
            ${{ github.workspace }}/src/build_download.log
            ${{ github.workspace }}/src/.config
            ${{ github.workspace }}/img-vs.log

      - name: Verify Images
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          cd "${WORKSPACE}/src"
          ls -lh bin/targets/*/*/ 2>/dev/null | sed -n '1,60p' || true
          IMG="$(find bin/targets -maxdepth 3 -type f \
                 \( -name '*.bin' -o -name '*.img.gz' -o -name '*.itb' -o -name '*.squashfs' \) -print -quit)"
          [ -n "${IMG}" ] || { echo "ERROR: 没有找到固件镜像"; exit 1; }
          echo ">>> 生成镜像示例: ${IMG}"
          echo ">>> 自有 kmod 库（本次产物）:"
          ls -d bin/targets/*/*/kmods/*/ 2>/dev/null || echo "  (没有 kmods 目录，可能未生成)"
          echo ">>> 设备端 distfeeds 应指向该 kmods 目录对应的发布地址（不要指向官方 kmods）"

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.target_device }}-DSF-${{ github.run_id }}
          path: |
            src/bin/targets/*
            !src/bin/targets/**/packages/**
          if-no-files-found: error
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          body_path: release-notes.md
          files: |
            BUILDINFO.txt
            src/bin/targets/*/*/*.bin
            src/bin/targets/*/*/*.img.gz
            src/bin/targets/*/*/*.itb
            src/bin/targets/*/*/*.squashfs
            src/bin/targets/*/*/sha256sums
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
