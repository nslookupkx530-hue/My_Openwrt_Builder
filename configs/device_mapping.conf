# ============================================================
# 设备名=target路径[|profile]
# ============================================================
# 纯符号的值 → 按 CONFIG_TARGET_<board>_<subtarget>_DEVICE_<值>=y 写入
#
# 设备名必须与 files/<设备名>/ 目录名完全一致（区分大小写）
#
# profile 取值方法
# bash ../shell/prepare_base_config.sh --list-profiles GL-MT3600BE
#
# 只编译以下 5 台；GL-MT5000 / JDC-AX6600 官方无驱动支持，暂不编译。
# 不填 profile → 编译该 target 的官方全套镜像；填对之后只出你那一台。
# ============================================================

x86=targets/x86/64
AXT-1800=targets/qualcommax/ipq60xx
GL-MT3600BE=targets/mediatek/filogic
Cudy-TR3000-256MB=targets/mediatek/filogic
Tenda-BE12PRO=targets/mediatek/filogic
