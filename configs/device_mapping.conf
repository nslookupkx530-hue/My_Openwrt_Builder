# ============================================================
# 设备名=target路径[|profile]
# ============================================================
# 纯符号的值 → 按 CONFIG_TARGET_<board>_<subtarget>_DEVICE_<值>=y 写入
#
# 设备名必须与 files/<设备名>/ 目录名完全一致（区分大小写）
#
# profile 取值方法
# bash ../shell/prepare_base_config.sh --list-profiles GL-MT3600BE
#
# 只编译以下 5 台；GL-MT5000 / JDC-AX6600 官方无驱动支持，暂不编译。
# 不填 profile → 编译该 target 的官方全套镜像；填对之后只出你那一台。
#   mediatek/filogic 有一百多台设备，不填 profile 会直接撞 6 小时上限！
# 通道核对结果（detect workflow）：
#   x86 / AXT-1800 / GL-MT3600BE / Cudy-TR3000-256MB → release 通道有，按稳定版编
#   Tenda-BE12PRO                                    → snapshot，源码要用主分支
# ============================================================

x86=targets/x86/64
AXT-1800=targets/qualcommax/ipq60xx|glinet_gl-axt1800
GL-MT3600BE=targets/mediatek/filogic|glinet_gl-mt3600be
Cudy-TR3000-256MB=targets/mediatek/filogic|cudy_tr3000-256mb-v1
Tenda-BE12PRO=targets/mediatek/filogic|tenda_be12-pro|snapshot
