# ============================================================
# 官方插件功能开关配置
# ============================================================
# 规则: 设置为 1 表示启用，0 表示禁用
# 注意: 仅影响用户态插件，确保内核哈希一致性
# ============================================================

# 基础插件
ENABLE_ARGON=1
ENABLE_DISKMAN=1
ENABLE_IRQBALANCE=1
ENABLE_FILEBROWSER_GO=1
ENABLE_SQM=1
ENABLE_TTYD=1
ENABLE_AUTOREBOOT=1
ENABLE_SMARTDNS=1
ENABLE_RAMFREE=1

# ---------------------------------------------------------------
# docker（体积大，按【设备白名单】启用）
#   ENABLE_DOCKER=1 是总开关，并且设备还必须出现在 ENABLE_DOCKER_DEVICES 里
#   两个条件同时满足才会集成；任一不满足 = 完全不集成（不注入包、不打包防火墙配置）
# ---------------------------------------------------------------
# 容器与高级功能
ENABLE_DOCKER=0

# 允许集成 docker 的设备（逗号分隔；留空 = 全部不集成）
#   x86               : 容量无上限
#   GL-MT3600BE       : 512MB
#   Cudy-TR3000-256MB : 256MB，装得下但 overlay 会明显变小，实测后自行决定
#   AXT-1800 / Tenda-BE12PRO / JDC-AX6600 : 128MB 级，不要加进来
ENABLE_DOCKER_DEVICES=x86,GL-MT3600BE,GL-MT5000


# 第三方 APK 插件 (这些在 third-party.config 中定义)
# 注意：这里只控制是否注入到 .config，具体的 APK 安装逻辑由 apk-prepare-packages.sh 处理
